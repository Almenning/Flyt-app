<title id="cv-art-title">Kontinentseilasen, illustrert fantasihav</title>
<desc id="cv-art-desc">Et originalt eventyrhav med fem øyer og sjøveier, kompass, passbrygge, havpassasje, naturøy og fyrtårn. Dette er et fantasilandskap, ikke et verdenskart.</desc>
