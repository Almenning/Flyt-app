function startLearningSession(subject,module,label){
  sessionScope={type:'subject',subject,module:module||null,label:(SUBJECTS[subject]?.title||subject)+' · '+(label||'Blandet'),grade:currentGrade()};
  state.lastActivity={kind:'subject',subject,module:module||null,label:label||SUBJECTS[subject]?.mission||'Blandet'};
  const fresh=buildLearningQuestions(subject,module);
  const all=fresh.length<5?buildLearningQuestions(subject,module,true):fresh;
  sessionQuestions=topUpSessionQuestions(fresh,all,5);
  sessionScope.practiceOnly=sessionQuestions.length>0&&sessionQuestions.every(q=>q.practiceRepeat);
  if(sessionQuestions.length<5){toast('Fant ikke nok oppgaver akkurat nå.');return}
  qIndex=0;sessionCorrect=0;sessionStrengthened=new Set();currentAnswered=null;
  state.activeSession={startedAt:Date.now()};persistActiveSession();showScreen('session');renderQuestion();
}

// --- Real map geometry helpers ---
function geometryPolygons(geom){if(!geom)return[];return geom.type==='Polygon'?[geom.coordinates]:geom.type==='MultiPolygon'?geom.coordinates:[]}
function normalizeLon(lon,ref){while(lon-ref>180)lon-=360;while(lon-ref<-180)lon+=360;return lon}
function unwrapRing(ring){
  if(!ring||!ring.length)return[];
  const out=[[ring[0][0],ring[0][1]]];
  let prev=ring[0][0];
  for(let i=1;i<ring.length;i++){
    let x=ring[i][0];
    while(x-prev>180)x-=360;
    while(x-prev<-180)x+=360;
    out.push([x,ring[i][1]]);
    prev=x;
  }
  return out;
}
function pointInRing(lon,lat,ring){
  const pts=unwrapRing(ring);
  if(pts.length<3)return false;
  let minX=Infinity,maxX=-Infinity;
  for(const p of pts){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0])}

  let x=lon;
  while(x-ref>180)x-=360;
  while(x-ref<-180)x+=360;
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    const hit=((yi>lat)!==(yj>lat))&&(x<(xj-xi)*(lat-yi)/(yj-yi+1e-12)+xi);
    if(hit)inside=!inside;
  }
  return inside;
}
function pointInCountry(c,lon,lat){

    let inHole=false;
    for(let i=1;i<poly.length;i++){
      if(pointInRing(lon,lat,poly[i])){inHole=true;break}
    }

  }

}

  const subject=isGeo?'geography':scope.subject,grade=Number(scope.journeyGrade||currentGrade());
  const model=isGeo?geoJourneyModel(grade):journeyModel(subject,grade);
  const node=model.nodes.find(n=>n.id===scope.journeyNode);
  if(!journeyNodeIsCompleteForWorldReaction(node,isGeo))return;
  window.__journeyWorldReaction={subject,grade,nodeId:node.id,areaId:node.areaId,at:Date.now()};
}
document.getElementById('complete-home').onclick=()=>{
  const scope=lastCompletedScope||{};
  armJourneyWorldReaction(scope);
  if(scope.type==='journey'&&scope.subject&&scope.subject!=='geography'){openSubject(scope.subject);return}
  if(scope.type==='geo-journey'||scope.subject==='geography'){renderGeographyContinue();showScreen('geography');return}
  if(currentGrade()<=2){setTab('progress');return}
  returnToLearningHome();
};


// Onboarding
function updateOnboarding(){
  document.querySelectorAll('.onboard-step').forEach((el,i)=>el.classList.toggle('active',i===onboardingStep));
  document.querySelectorAll('.onboard-dots span').forEach((el,i)=>el.classList.toggle('active',i===onboardingStep));
}
document.querySelectorAll('.onboard-next').forEach(b=>b.onclick=()=>{onboardingStep=Math.min(2,onboardingStep+1);updateOnboarding()});
let selectedGrade=Number(state.profile.grade)||null;
function renderGradeChoice(){document.querySelectorAll('.grade-btn').forEach(b=>b.classList.toggle('selected',Number(b.dataset.grade)===selectedGrade))}
document.querySelectorAll('.grade-btn').forEach(b=>b.onclick=()=>{selectedGrade=Number(b.dataset.grade);renderGradeChoice();document.getElementById('name-error').textContent=''});
document.getElementById('finish-onboarding').onclick=()=>{
  if(!selectedGrade){document.getElementById('name-error').textContent='Velg hvilket klassetrinn du går i.';return}
  state.profile={...state.profile,grade:selectedGrade,onboarded:true};state.activeSession=null;saveState();document.getElementById('onboarding').classList.remove('show');renderAll();
};
renderGradeChoice();

// Lightweight adult gate: requires a deliberate long press rather than a normal child tap.
const adultEntry=document.getElementById('adult-entry');
function startAdultHold(e){e.preventDefault();adultEntry.classList.add('holding');adultEntry.textContent='🔓 Fortsett å holde …';holdTimer=setTimeout(()=>{adultEntry.classList.remove('holding');adultEntry.textContent='🔒 Hold inne for voksne';openAdult();},1500)}
function cancelAdultHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null}adultEntry.classList.remove('holding');adultEntry.textContent='🔒 Hold inne for voksne'}
adultEntry.addEventListener('pointerdown',startAdultHold);adultEntry.addEventListener('pointerup',cancelAdultHold);adultEntry.addEventListener('pointerleave',cancelAdultHold);adultEntry.addEventListener('pointercancel',cancelAdultHold);
function openAdult(){renderAdult();showScreen('adult')}
document.getElementById('adult-back').onclick=()=>setTab('home');
document.getElementById('open-parent-info').onclick=()=>showScreen('parent-info');
document.getElementById('parent-info-back').onclick=()=>showScreen('adult');
document.getElementById('open-feedback').onclick=()=>showScreen('feedback');
document.getElementById('feedback-back').onclick=()=>showScreen('adult');

document.getElementById('reset-progress').onclick=()=>{
  if(!confirm('Nullstille all fremgang, klassetrinn og pågående økt på denne enheten?'))return;
  safeStorageRemove(STORAGE_KEY);safeStorageRemove('laerlittmer-v1');state=cloneDefault();sessionQuestions=[];qIndex=0;sessionCorrect=0;sessionStrengthened=new Set();currentAnswered=null;onboardingStep=0;selectedGrade=null;renderGradeChoice();updateOnboarding();document.getElementById('onboarding').classList.add('show');setTab('home');
};

const adultGradeSelect=document.getElementById('adult-grade');
if(adultGradeSelect)adultGradeSelect.addEventListener('change',()=>{state.profile.grade=Number(adultGradeSelect.value);state.activeSession=null;state.lastActivity=null;ensureJourneyState();state.journey.viewGrades={};selectedGrade=state.profile.grade;saveState();renderGradeChoice();renderAll();toast(`Nivået er tilpasset ${state.profile.grade}. klasse`)});
const adultSoundToggle=document.getElementById('adult-sound-toggle');
const adultAutoReadToggle=document.getElementById('adult-autoread-toggle');
if(adultSoundToggle)adultSoundToggle.addEventListener('change',()=>{state.preferences.sound=adultSoundToggle.checked;saveState();toast(adultSoundToggle.checked?'Lydeffekt er på':'Lydeffekt er av')});
if(adultAutoReadToggle)adultAutoReadToggle.addEventListener('change',()=>{state.preferences.autoRead=adultAutoReadToggle.checked;saveState();toast(adultAutoReadToggle.checked?'Automatisk opplesning er på':'Automatisk opplesning er av')});

// Feedback stays under the parent's control: use native Share when available, otherwise copy.
document.getElementById('feedback-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const lines=[
    'Tilbakemelding – Læria',
    `Barnets klassetrinn: ${document.getElementById('fb-grade').value}`,
    `Forstod uten hjelp: ${document.getElementById('fb-understand').value}`,
    `Fullførte økten: ${document.getElementById('fb-complete').value}`,
    `Vanskelighetsgrad: ${document.getElementById('fb-difficulty').value}`,
    `Ville brukt igjen: ${document.getElementById('fb-again').value}`,
    `Likte best: ${document.getElementById('fb-best').value.trim()||'–'}`,
    `Fungerte dårligst: ${document.getElementById('fb-worst').value.trim()||'–'}`,
    `Annet: ${document.getElementById('fb-notes').value.trim()||'–'}`,
    '',
    `Testdata på enheten: ${state.sessionLog.length} økter, ${state.answerLog.length} svar.`
  ];
  const text=lines.join('\n'),status=document.getElementById('share-status');
  try{
    if(navigator.share){await navigator.share({title:'Tilbakemelding – Læria',text});status.textContent='Tilbakemeldingen er klar til deling.'}
    else{await navigator.clipboard.writeText(text);status.textContent='Kopiert. Lim inn i meldingen du vil sende.'}
  }catch(err){
    if(err&&err.name==='AbortError'){status.textContent='Deling avbrutt.';return}
    try{await navigator.clipboard.writeText(text);status.textContent='Kopiert. Lim inn i meldingen du vil sende.'}catch(_){status.textContent='Kunne ikke dele automatisk. Marker og kopier feltene manuelt.'}
  }
});

function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}

// --- Quality-assured external data layer ---
const NE50_URL='https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson';
const WB2024_URL='https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?date=2024&format=json&per_page=400';
const qualityStatus={map:false,population:false};
function updateDataStatus(){const el=document.getElementById('data-status');if(!el)return;if(qualityStatus.map&&qualityStatus.population)el.textContent='Kart: Natural Earth 1:50m · befolkning: Verdensbanken 2024';else if(qualityStatus.map)el.textContent='Kart: Natural Earth 1:50m · befolkning bruker reserveverdier';else if(qualityStatus.population)el.textContent='Befolkning: Verdensbanken 2024 · kart bruker innebygd reserve';else el.textContent='Norske navn og hovedsteder · innebygde reservefakta er aktive offline'}
function findCountryForFeature(p={}){const a2=[p.ISO_A2_EH,p.ISO_A2,p.WB_A2].find(v=>typeof v==='string'&&v.length===2&&v!=='-99');if(a2){const hit=WORLD_COUNTRIES.find(c=>c.a2===a2);if(hit)return hit}const a3=[p.ISO_A3_EH,p.ADM0_A3,p.ISO_A3,p.SOV_A3].find(v=>typeof v==='string'&&v.length===3&&v!=='-99');return a3?WORLD_COUNTRIES.find(c=>c.a3===a3):null}
async function loadDetailedGeometry(){try{const r=await fetch(NE50_URL,{cache:'force-cache'});if(!r.ok)throw new Error('map '+r.status);const geo=await r.json();let updated=0;for(const f of geo.features||[]){const c=findCountryForFeature(f.properties);if(!c||!f.geometry)continue;c.geometry=f.geometry;c._geometrySpan=null;const px=Number(f.properties?.LABEL_X),py=Number(f.properties?.LABEL_Y);if(Number.isFinite(px)&&Number.isFinite(py)){c.lon=px;c.lat=py}updated++}qualityStatus.map=updated>150;if(document.getElementById('world-screen').classList.contains('active')){resizeGlobe();drawGlobe()}updateDataStatus()}catch(e){updateDataStatus()}}
async function loadPopulation2024(){try{const r=await fetch(WB2024_URL,{cache:'force-cache'});if(!r.ok)throw new Error('population '+r.status);const data=await r.json(),rows=Array.isArray(data)&&Array.isArray(data[1])?data[1]:[];let updated=0;for(const row of rows){if(!row||row.value==null)continue;const code=String(row.countryiso3code||'').toUpperCase(),c=WORLD_COUNTRIES.find(x=>x.a3===code);if(!c)continue;c.population=Number(row.value);c.populationYear=2024;updated++}qualityStatus.population=updated>150;updateDataStatus()}catch(e){updateDataStatus()}}
function loadQualityData(){updateDataStatus();Promise.allSettled([loadDetailedGeometry(),loadPopulation2024()]).then(()=>{renderAll();if(document.getElementById('world-screen').classList.contains('active'))drawGlobe()})}

// PWA registration: network-first navigation in sw.js prevents stale HTML/JS mixes after deploy.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
}

// App resume policy:
// - A real launch always starts on Home.
// - Short background pauses keep the current screen.
// - After 10 minutes away, return to Home while preserving any unfinished session.
const APP_RESUME_HOME_AFTER_MS=10*60*1000;
let appHiddenAt=null;

function returnHomeAfterLongPause(){
  if(activeScreenName()==='session'&&state.activeSession)persistActiveSession();
  setTab('home');
  renderHomeContinue();
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    appHiddenAt=Date.now();
    if(activeScreenName()==='session'&&state.activeSession)persistActiveSession();
    return;
  }
  if(document.visibilityState==='visible'&&appHiddenAt){
    const awayFor=Date.now()-appHiddenAt;
    appHiddenAt=null;
    if(awayFor>=APP_RESUME_HOME_AFTER_MS)returnHomeAfterLongPause();
  }
});

window.addEventListener('pagehide',()=>{
  appHiddenAt=Date.now();
  if(activeScreenName()==='session'&&state.activeSession)persistActiveSession();
});

window.addEventListener('pageshow',event=>{
  if(!event.persisted)return;
  const awayFor=appHiddenAt?Date.now()-appHiddenAt:APP_RESUME_HOME_AFTER_MS;
  appHiddenAt=null;
  if(awayFor>=APP_RESUME_HOME_AFTER_MS)returnHomeAfterLongPause();
});

// Initial render / recovery
renderAll();updateOnboarding();loadQualityData();
// norwegian-content.js is deferred. Refresh journey-derived UI after deferred local content has executed.
document.addEventListener('DOMContentLoaded',()=>{
  renderAll();
  if(activeScreenName()==='subject'&&activeSubject){renderSubjectModules();renderSubjectJourney();renderSubjectContinue()}
  if(activeScreenName()==='geography')renderGeographyContinue();
});
if(!state.profile.onboarded||!state.profile.grade){
  onboardingStep=state.profile.onboarded?2:0;
  selectedGrade=Number(state.profile.grade)||null;
  renderGradeChoice();updateOnboarding();document.getElementById('onboarding').classList.add('show');
}else{
  // Never drop the child straight back into yesterday's question on a fresh launch.
  // The unfinished session remains in state and is offered from Home.
  setTab('home');
  renderHomeContinue();
}
