function subjectAnswered(subject,grade=currentGrade()){return state.answerLog.filter(a=>a.countsForLearning!==false&&a.subject===subject&&Number(a.grade||grade)===Number(grade)).length}
function subjectMasteredSkills(subject,grade=currentGrade()){
  ensureLearningState();const prefix=learningKeyPrefix(subject,grade);
  return Object.keys(state.skillMastery).filter(k=>k.startsWith(prefix)&&stageRank(skillStageByKey(k))>=stageRank('can-now')).length;
}
function subjectLongTermMasteredSkills(subject,grade=currentGrade()){
  ensureLearningState();const prefix=learningKeyPrefix(subject,grade);
  return Object.keys(state.skillEvidence).filter(k=>k.startsWith(prefix)&&skillStageByKey(k)==='mastered').length;
}

const GRADE2_FIRST_JOURNEYS=Object.freeze({
  norwegian:Object.freeze({title:'Bokskogen'}),
  math:Object.freeze({title:'Tallvika'}),
  english:Object.freeze({title:'Ordlandsbyen'}),
  geography:Object.freeze({title:'Nordlysleiren'})
});
function journeyChapterInfo(subject,grade=currentGrade()){
  if(Number(grade)!==2)return null;
  const meta=GRADE2_FIRST_JOURNEYS[subject];
  return meta?{subject,grade:2,chapter:1,title:meta.title}:null;
}
function journeyCompleteCompact(subject,grade=currentGrade()){
  return journeyChapterInfo(subject,grade)?'Første eventyr fullført 🏆':'Trinnet fullført 🏆';
}
function journeyCompleteTitle(subject,grade=currentGrade()){
  const chapter=journeyChapterInfo(subject,grade);
  return chapter?'🏆 '+chapter.title+' · første eventyr fullført':'🏆 '+GRADE_CONFIG[grade].label+' fullført';
}

function gradeJourneyOverview(grade=currentGrade()){
  const items=[
    {id:'geography',label:'Geografi',icon:'🌍',progress:geoJourneyProgress(grade)},
    {id:'norwegian',label:'Norsk',icon:'📖',progress:journeyProgress('norwegian',grade)},
    {id:'math',label:'Matte',icon:'➗',progress:journeyProgress('math',grade)},
    {id:'english',label:'Engelsk',icon:'🇬🇧',progress:journeyProgress('english',grade)}
  ];
  const done=items.filter(x=>x.progress.complete).length;
  return {grade,items,done,total:items.length,complete:done===items.length};
}
function renderGradeJourneyOverview(){
  const card=document.getElementById('grade-round-card');if(!card)return;
  const o=gradeJourneyOverview(),label=GRADE_CONFIG[o.grade].label,chapterMode=Number(o.grade)===2;
  card.classList.toggle('complete',o.complete);
  document.getElementById('grade-round-eyebrow').textContent=chapterMode?'DINE FØRSTE EVENTYR':label;
  document.getElementById('grade-round-title').textContent=chapterMode
    ?(o.complete?'🏆 Fire første eventyr fullført':'Fire første eventyr')
    :(o.complete?'🏆 '+label+' rundet i Læria':'Rund '+label);
  document.getElementById('grade-round-score').textContent=o.done+'/'+o.total;
  document.getElementById('grade-round-copy').textContent=chapterMode
    ?(o.complete
      ?'Du har fullført det første eventyret i alle fire fag. Spill favorittene igjen eller utforsk fritt.'
      :'Fire fag, fire første eventyr. Følg reisen videre eller bli værende der du liker deg best.')
    :(o.complete
      ?'Du har rundet appens kjerneløp i alle fire fag. Nå handler det om å hente kunnskapen fram igjen og gjøre den varig.'
      :'Fullfør appens kjerneløp i hvert fag. Du trenger ikke gjøre alt på én gang.');
  document.getElementById('grade-round-subjects').innerHTML=o.items.map(x=>{
    const first=Number(o.grade)===2;
    const status=x.progress.complete?(first?'første eventyr fullført':'fullført'):(x.progress.pct+' %'+(first?' av første eventyr':''));
    return '<div class="grade-round-pill '+(x.progress.complete?'done':'')+'"><b>'+(x.progress.complete?'✓':x.icon)+'</b><span>'+x.label+' · '+status+'</span></div>';
  }).join('');
  const historyTitle=document.getElementById('grade-round-history-title');
  if(historyTitle){historyTitle.hidden=true;historyTitle.setAttribute('aria-hidden','true')}
  const history=document.getElementById('grade-round-history');
  if(history){history.hidden=true;history.setAttribute('aria-hidden','true');history.innerHTML=''}
}
function renderSubjectProgress(){
  renderGradeJourneyOverview();
  for(const s of Object.keys(SUBJECTS)){
    const el=document.getElementById('topic-'+s+'-progress');if(!el)continue;
    const jp=journeyProgress(s,currentGrade());
    el.textContent=jp.complete?journeyCompleteCompact(s,currentGrade()):subjectAnswered(s)?jp.pct+' % av reisen':'Start reisen';
  }
  const grid=document.getElementById('subject-progress-grid');
  if(grid)grid.innerHTML=[
    ['🌍','Geografi',geoJourneyProgress().complete?journeyCompleteCompact('geography',currentGrade()):geoJourneyProgress().pct+' % av reisen'],
    ['📖','Norsk',journeyProgress('norwegian').complete?journeyCompleteCompact('norwegian',currentGrade()):journeyProgress('norwegian').pct+' % av reisen'],
    ['➗','Matte',journeyProgress('math').complete?journeyCompleteCompact('math',currentGrade()):journeyProgress('math').pct+' % av reisen'],
    ['🇬🇧','Engelsk',journeyProgress('english').complete?journeyCompleteCompact('english',currentGrade()):journeyProgress('english').pct+' % av reisen']
  ].map(x=>'<div class="subject-progress-card"><strong>'+x[0]+' '+x[1]+'</strong><span>'+x[2]+'</span></div>').join('');
}

function visibleSubjectModules(subject=activeSubject){

function openSubject(subject){
  activeSubject=subject;activeModule=null;
  const s=SUBJECTS[subject];if(!s)return;
  const screen=document.getElementById('subject-screen');screen.dataset.subject=subject;
  document.getElementById('subject-eyebrow').textContent=GRADE_CONFIG[currentGrade()].label;
  document.getElementById('subject-title').textContent=s.title;
  document.getElementById('subject-copy').textContent=s.copy;
  document.getElementById('subject-icon').textContent=s.icon;
  const bannerIcon=document.getElementById('subject-banner-icon');if(bannerIcon)bannerIcon.textContent=s.icon;
  document.getElementById('subject-grade-label').textContent=GRADE_CONFIG[currentGrade()].label;
  const labEntry=document.getElementById('math-lab-entry');if(labEntry)labEntry.hidden=subject!=='math';
  renderSubjectModules();renderSubjectJourney();renderSubjectContinue();showScreen('subject');
  // The approved locked Tallenga journey hides #subject-modules. A private
  // preview launcher must therefore live directly in the visible subject
  // screen, not in the hidden free-practice area.
  screen.querySelector(':scope > [data-laria-math-chapter2-preview]')?.remove();
  if(subject==='math'&&currentGrade()===2&&window.LARIA_MATH_PATTERN_HAVEN?.previewEnabled(location.search)){
    const preview=document.createElement('button');
    preview.type='button';preview.className='mh-dev-launch';
    preview.dataset.lariaMathChapter2Preview='1';
    preview.textContent='✿ Mønsterhagen · test';
    preview.setAttribute('aria-label','Åpne Mønsterhagen, intern test av Mattekappittel 2');
    preview.onclick=()=>window.LARIA_MATH_PATTERN_HAVEN_UI?.open({
      state,save:saveState,foxSrc:avatarSrc(state.profile?.avatar==='girl'?'girl':'boy')
    });
    screen.appendChild(preview);
  }
  // English adventure two is a private preview. Approved Ordlandsbyen
  // hides the old module list, so this button belongs to the subject screen.
  screen.querySelector(':scope > [data-laria-english-chapter2-preview]')?.remove();
  if(subject==='english'&&currentGrade()===2&&window.LARIA_ENGLISH_SENTENCE_HARBOR?.previewEnabled(location.search)){
    const preview=document.createElement('button');
    preview.type='button';preview.className='sh-dev-launch';
    preview.dataset.lariaEnglishChapter2Preview='1';
    preview.textContent='⚓ Setningshavna · test';
    preview.onclick=()=>window.LARIA_ENGLISH_SENTENCE_HARBOR_UI?.open({
      state,save:saveState,foxSrc:avatarSrc(state.profile?.avatar==='girl'?'girl':'boy')
    });
    screen.appendChild(preview);
  }

function renderSubjectContinue(){

  document.getElementById('subject-mission-title').textContent=sameActive?(a.label||s.mission):prog.complete?(chapter?'🏆 '+chapter.title+' fullført':'🏆 '+GRADE_CONFIG[currentGrade()].label+' fullført'):next?.title||s.mission;

  const btn=document.getElementById('start-subject-session');
  btn.textContent=sameActive?'Fortsett økten 🚀':prog.complete?'Ekstra utfordring ⚡':'Fortsett reisen 🚀';

function validLearningQuestion(q){
  if(!q||!q.subject||!q.skill||!q.type||q.answer===undefined||q.answer===null)return false;
  if(q.type==='learning-choice')return Array.isArray(q.options)&&q.options.length>=2&&q.options.map(String).includes(String(q.answer));
  if(q.type==='build-word')return Array.isArray(q.letters)&&q.letters.length>0&&String(q.answer).length===q.letters.length;
  if(q.type==='sentence-order')return Array.isArray(q.words)&&q.words.length>1&&String(q.answer).length>0;
  if(q.type==='number-input')return String(q.answer).length>0;
  if(q.type==='sequence-order')return Array.isArray(q.items)&&q.items.length>1&&String(q.answer).length>0;
  return false;
}

function buildLearningQuestions(subject,module,allowCooldown=false){
  const getPool=(m)=>subjectPoolForGrade(subject,currentGrade(),m);
  const focused=module?getPool(module).filter(validLearningQuestion):[];
  const mixed=getPool(null).filter(validLearningQuestion),seen=new Set(),pool=[];
  for(const q of [...focused,...mixed]){
    const sig=questionIdentity(q),cooling=questionOnCooldown(q);if(seen.has(sig)||(cooling&&!allowCooldown))continue;
    seen.add(sig);q._focused=focused.includes(q);q.practiceRepeat=!!cooling;
    const key=learningMasteryKey(q.subject,q.skill,currentGrade()),stage=skillStageByKey(key),ev=evidenceForSkill(q.subject,q.skill,currentGrade()),bucket=learningBucket(stage,ev),mist=Number(state.skillMistakes[key]||0),focus=q._focused?-.28:0;
    q._adaptive={stage,bucket,score:bucketBias(bucket)-Math.min(.7,mist*.12)+focus+Math.random()*.1};pool.push(q);
  }
  if(!pool.length)return [];
  pool.sort((a,b)=>a._adaptive.score-b._adaptive.score);
  const chosen=[],used=new Set(),types=new Set(),skills=new Set();
  const add=q=>{const sig=questionIdentity(q);if(!q||used.has(sig)||chosen.length>=5)return false;chosen.push(q);used.add(sig);types.add(q.type);skills.add(q.skill);return true};
  const warm=pool.find(q=>q.type==='learning-choice'&&(q.visual||q._adaptive.stage!=='new'))||pool.find(q=>q.type==='learning-choice')||pool[0];
  add(warm);
  const take=(bucket,limit)=>{
    for(const q of pool){if(chosen.length>=5||limit<=0)break;if(q._adaptive.bucket!==bucket)continue;if(add(q))limit--}
  };
  take('review',1);take('active',2);take('new',1);
  for(const q of pool){
    if(chosen.length>=5)break;
    // When scores are close, prefer a different skill and interaction type.
    if(skills.has(q.skill)&&pool.some(x=>!used.has(questionIdentity(x))&&!skills.has(x.skill)&&Math.abs(x._adaptive.score-q._adaptive.score)<.55))continue;
    if(types.has(q.type)&&pool.some(x=>!used.has(questionIdentity(x))&&!types.has(x.type)&&Math.abs(x._adaptive.score-q._adaptive.score)<.45))continue;
    add(q);
  }
  for(const q of pool){if(chosen.length>=5)break;add(q)}
  return chosen.slice(0,5);
}

function topUpSessionQuestions(fresh,all,count=5){
  const out=[],seen=new Set();
  for(const q of [...(fresh||[]),...(all||[])]){
    if(!q)continue;
    const sig=questionIdentity(q);
    if(seen.has(sig))continue;
    seen.add(sig);out.push(q);
    if(out.length>=count)break;
  }
  return out;
}
function buildJourneyQuestions(subject,node,allowCooldown=false){
  const grade=node.grade||currentGrade(),module=node.module||null,focused=subjectPoolForGrade(subject,grade,module),all=subjectPoolForGrade(subject,grade,null);
  const source=[],sourceSeen=new Set(),addSource=questions=>{
    for(const q of questions){
      const sig=questionIdentity(q);if(sourceSeen.has(sig))continue;
      sourceSeen.add(sig);source.push(q);
    }
  };
  addSource(focused.filter(q=>(node.skills||[]).includes(q.skill)));
  if(source.length<5)addSource(focused.filter(q=>(node.areaSkills||node.skills||[]).includes(q.skill)));
  if(source.length<5)addSource(all.filter(q=>(node.areaSkills||node.skills||[]).includes(q.skill)));
  if(source.length<5)addSource(focused);
  if(source.length<5)addSource(all);
  const seen=new Set(),pool=[];
  for(const q0 of source){
    const q={...q0},sig=questionIdentity(q),cooling=questionOnCooldown(q);
    if(seen.has(sig)||(cooling&&!allowCooldown))continue;
    seen.add(sig);q.practiceRepeat=!!cooling;
    const key=learningMasteryKey(q.subject,q.skill,grade),st=skillStageByKey(key),ev=evidenceForSkill(q.subject,q.skill,grade),bucket=learningBucket(st,ev),mist=Number(state.skillMistakes[key]||0);
    q._adaptive={stage:st,bucket,score:bucketBias(bucket)-Math.min(.7,mist*.12)+Math.random()*.12};pool.push(q);
  }
  pool.sort((a,b)=>a._adaptive.score-b._adaptive.score);
  const chosen=[],used=new Set(),skills=new Set(),types=new Set();
  const add=q=>{
    if(!q||chosen.length>=5)return false;
    const sig=questionIdentity(q);if(used.has(sig))return false;
    chosen.push(q);used.add(sig);skills.add(q.skill);types.add(q.type);return true;
  };
  if(node.type==='checkpoint'||node.type==='challenge'){
    for(const skill of node.skills||[]){const q=pool.find(x=>x.skill===skill&&!used.has(questionIdentity(x)));if(q)add(q)}
  }
  if(node.type==='review'){
    for(const q of pool.filter(x=>reviewDue(skillStage(x.subject,x.skill,grade),evidenceForSkill(x.subject,x.skill,grade))))add(q);
  }
  if(node.type==='skill'){
    for(const skill of node.skills||[]){const q=pool.find(x=>x.skill===skill&&!used.has(questionIdentity(x)));if(q)add(q)}
  }
  for(const q of pool){
    if(chosen.length>=5)break;
    if(!skills.has(q.skill)||!types.has(q.type))add(q);
  }
  for(const q of pool){if(chosen.length>=5)break;add(q)}
  return chosen.slice(0,5);
}

function journeySkillGlyph(node,isGeo=false){

  if(isGeo||node.subject==='geography'){
    const map={flag:'FLAG',capital:'CAP',country:'LAND',continent:'360',map:'MAP'};
    return '<span class="journey-node-glyph tiny">'+(map[node.geoType]||'GEO')+'</span>';
  }

  let glyph='•',tiny=false;
  if(s==='math'){
    if(skills.some(x=>String(x).includes('addition')))glyph='+';
    else if(skills.some(x=>String(x).includes('subtraction')))glyph='−';
    else if(skills.includes('multiplication'))glyph='×';
    else if(skills.includes('division'))glyph='÷';
    else if(skills.some(x=>['fractions'].includes(x)))glyph='½';
    else if(skills.some(x=>['percent','percent-change','ratio'].includes(x)))glyph='%';
    else if(skills.some(x=>['area','perimeter','angles','circle','volume','scale','pythagoras'].includes(x)))glyph='△';
    else if(skills.some(x=>['algebra','expression','functions','linear','pattern'].includes(x)))glyph='x';

    if(skills.some(x=>['letter-sound','missing-letter','spelling','double-consonant'].includes(x)))glyph='Aa';
    else if(skills.some(x=>['word-picture','synonyms','rhyme','compound-words'].includes(x))){glyph='ORD';tiny=true}
    else if(skills.some(x=>['sentence-order','punctuation','grammar','word-class'].includes(x))){glyph='abc';tiny=true}
    else if(skills.some(x=>String(x).startsWith('reading'))){glyph='LES';tiny=true}

  }else if(s==='english'){

function journeySidePositionV5(type,index){

function journeyRouteSvgV5(area,isGeo=false){
  const core=isGeo?geoJourneyCoreNodes(area):journeyCoreNodes(area),pts=journeyCorePositionsV5(core.length);if(pts.length<2)return '';
  const segs=[],progress=[],dots=[];
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1],bend=i%2===0?11:-11,mx=(x1+x2)/2+bend,my=(y1+y2)/2,d='M '+x1+' '+y1+' Q '+mx+' '+my+' '+x2+' '+y2;
    segs.push('<path class="route-shadow" d="'+d+'"/><path class="route-earth" d="'+d+'"/><path class="route-light" d="'+d+'"/>');
    const done=journeyNodeDoneV4(core[i],isGeo)&&journeyNodeDoneV4(core[i+1],isGeo);
    if(done)progress.push('<path class="route-progress" d="'+d+'"/>');
    for(let j=1;j<=3;j++){
      const t=j/4,one=1-t,x=one*one*x1+2*one*t*mx+t*t*x2,y=one*one*y1+2*one*t*my+t*t*y2;
      dots.push('<circle class="route-dot '+(done?'done':'')+'" cx="'+x+'" cy="'+y+'" r="1.25"/>');
    }
  }
  return '<svg class="journey-route-v5" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+segs.join('')+dots.join('')+progress.join('')+'</svg>';
}

function journeyMissionCopy(node,isGeo){
  if(node.type==='checkpoint')return 'En blandet runde fra denne verdenen. Få minst 4 av 5 riktige for å vinne troféet og åpne neste verden.';
  if(node.type==='challenge')return 'Et frivillig bonusoppdrag med litt mer variasjon. Det er lov å prøve selv om du ikke er ferdig med hovedstien.';
  if(node.type==='review')return 'Hent fram noe du har møtt før. Repetisjon gjør kunnskapen lettere å finne igjen senere.';

function openJourneyMission(subject,nodeId,grade,isGeo=false){

    osc.type='sine';osc.frequency.setValueAtTime(520,now);osc.frequency.exponentialRampToValueAtTime(720,now+.09);
    gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.055,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+.14);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+.15);
  }catch(_){}

  if(q.type==='build-word')return 'Se på bokstavene og prøv ordet en gang til neste gang det dukker opp.';
  if(q.subject==='math')return 'Se på tallene på nytt. Feilen brukes til å gi deg en bedre neste oppgave.';
  return 'Nesten. Oppgaven kommer tilbake senere, med litt mer støtte.';
}
function answerLearningChoice(answer){
  if(currentAnswered)return;
  const q=sessionQuestions[qIndex],correct=String(answer)===String(q.answer),young=currentGrade()<=2;
  // On young screens a wrong first tap is the one assessed attempt.
  // Later retries teach the answer but must not manufacture a second scored attempt.
  const alreadyFailed=young&&q._youngFirstAttemptWrong===true;
  if(!alreadyFailed){
    recordLearningAnswer(q,correct,answer);
    if(young&&!correct)q._youngFirstAttemptWrong=true;
  }else if(correct){
    currentAnswered={selected:answer,correct:false,corrected:true,practiceRepeat:!!q.practiceRepeat};
    persistActiveSession();
  }
  const buttons=[...document.querySelectorAll('.answer')];
  buttons.forEach(b=>{
    b.classList.remove('correct','wrong');
    if(correct){
      b.disabled=true;
      if(b.dataset.answer===String(q.answer))b.classList.add('correct');
    }else if(b.dataset.answer===String(answer)){
      b.classList.add('wrong');
      b.disabled=true;
    }
  });
  showLearningFeedback(q,correct,{retry:young&&!correct});
  if(young&&!correct){
    currentAnswered=null;
    persistActiveSession();
    buttons.forEach(b=>{if(!b.classList.contains('wrong'))b.disabled=false});
  }
}
function showLearningFeedback(q,correct,options={}){

  box.classList.toggle('bad',!correct);
  box.classList.toggle('success-pop',!!correct);
  box.classList.toggle('retry',!!options.retry);
  document.getElementById('feedback-title').textContent=correct?'Riktig!':'Nesten!';
  let copy=correct&&currentAnswered?.corrected
    ?'Du fant det etter et nytt forsøk! '+learningFeedbackText(q,true)
    :learningFeedbackText(q,correct);
  if(options.retry)copy+=' Prøv en gang til.';
  const last=state.answerLog[state.answerLog.length-1];
  if(correct&&!currentAnswered?.corrected&&last?.correct===true&&currentGrade()<=2&&last.strengthened)

  document.getElementById('feedback-copy').textContent=copy;

function renderBuildWord(q,wrap){
  const letters=q.letters.map((x,i)=>Object.assign({},x,{idx:i}));

  const slotBox=wrap.querySelector('#letter-slots'),bankBox=wrap.querySelector('.letter-bank'),helper=wrap.querySelector('#letter-helper'),check=wrap.querySelector('#check-build');

  const usedLetter=idx=>slots.some(x=>x&&x.idx===idx);
  const answerString=()=>slots.map(x=>x?.l||'').join('');
  const clearDragHighlights=()=>{
    wrap.querySelectorAll('.letter-slot.drag-over').forEach(x=>x.classList.remove('drag-over'));
    bankBox?.classList.remove('return-target');
  };
  function slotAtPoint(x,y){
    const candidates=[...slotBox.querySelectorAll('.letter-slot')];
    let best=null,bestDistance=Infinity;
    for(const slot of candidates){
      const r=slot.getBoundingClientRect(),pad=12;
      if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad){
        const cx=r.left+r.width/2,cy=r.top+r.height/2,d=Math.hypot(x-cx,y-cy);

  function bankAtPoint(x,y){

  }
  function hideRetryFeedback(){

  }
  function placeLetter(letterIdx,slotIdx){
    if(currentAnswered||letterIdx===null||slotIdx===null||Number.isNaN(letterIdx)||Number.isNaN(slotIdx))return;
    hideRetryFeedback();
    const from=slots.findIndex(x=>x&&x.idx===letterIdx);
    if(from===slotIdx){selectedLetterIdx=null;selectedSlotIdx=null;paint();return}
    const target=slots[slotIdx];
    if(from>=0){
      slots[from]=target||null;
      slots[slotIdx]=letters[letterIdx];
    }else{
      slots[slotIdx]=letters[letterIdx];
    }
    selectedLetterIdx=null;selectedSlotIdx=null;paint();
  }
  function returnLetter(slotIdx){
    if(currentAnswered||slotIdx===null||Number.isNaN(slotIdx)||!slots[slotIdx])return;
    hideRetryFeedback();
    slots[slotIdx]=null;
    selectedLetterIdx=null;selectedSlotIdx=null;
    paint();
  }
  function moveSlot(from,to){
    if(currentAnswered||from===to||!slots[from])return;
    hideRetryFeedback();

    slots[to]=moving;slots[from]=target||null;

  function bindPointerDrag(el,sourceType,sourceIndex){
    let touchState=null;
    const finishTouch=()=>{
      if(!touchState)return;

        const to=Number(targetSlot.dataset.slot);

      }
      suppressTapUntil=Date.now()+180;
    };
    el.addEventListener('touchstart',event=>{
      if(currentAnswered||event.touches.length!==1)return;
      const t=event.touches[0];

      if(!touchState||event.touches.length!==1)return;

    el.addEventListener('pointerdown',down=>{

  }
  function helperText(){

    if(selectedSlotIdx!==null)return 'Velg bokstaven som skal stå i rute '+(selectedSlotIdx+1)+'.';

  function paint(){

  wrap.querySelectorAll('.letter-tile').forEach(b=>{
    const idx=Number(b.dataset.idx);

      if(Date.now()<suppressTapUntil||currentAnswered||usedLetter(idx))return;

        currentAnswered={selected:answer,correct:true,corrected:true};

      wrap.querySelectorAll('.letter-tile,.letter-slot').forEach(b=>b.disabled=true);
      showLearningFeedback(q,true);
      if(mistakeRecorded)document.getElementById('feedback-copy').textContent='Der satt den! Du rettet ordet selv.';

    }
    if(!mistakeRecorded){
      const repeatPractice=isPracticeRepeat(q),result=repeatPractice?{newlyMastered:false}:bumpSkill(q.subject,q.skill,false);
      state.answerLog.push({at:Date.now(),subject:q.subject,skill:q.skill,type:q.type,grade:Number(sessionScope?.journeyGrade||sessionScope?.grade||currentGrade()),questionKey:questionIdentity(q),correct:false,newlyMastered:result.newlyMastered,practiceRepeat:repeatPractice,countsForLearning:!repeatPractice,curriculum:q.curriculum||null});

    const box=wrap.querySelector('#feedback');box.style.display='block';box.classList.add('bad');
    wrap.querySelector('#feedback-title').textContent='Prøv igjen';
    wrap.querySelector('#feedback-copy').textContent='Noen bokstaver står feil. Flytt dem, trykk dem tilbake, eller dra dem ned til bokstavene igjen.';

function normalizeNumericAnswer(v){
  return String(v??'').trim().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(',','.');
}
function numericalAnswersMatch(given,expected){
  const typed=normalizeNumericAnswer(given),correct=normalizeNumericAnswer(expected);
  if(!typed||!correct)return false;
  // Reject text, units and malformed numbers. Never use parseFloat() here.
  const decimal=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/;
  if(!decimal.test(typed)||!decimal.test(correct))return false;
  if(typed===correct)return true;
  const a=Number(typed),b=Number(correct);
  if(!Number.isFinite(a)||!Number.isFinite(b))return false;
  // Computed curriculum answers can contain IEEE-754 noise such as
  // 27.500000000000004. Twelve significant figures exceed task precision.
  return Number(a.toPrecision(12))===Number(b.toPrecision(12));
}

// --- Real map geometry helpers ---
function geometryPolygons(geom){if(!geom)return[];return geom.type==='Polygon'?[geom.coordinates]:geom.type==='MultiPolygon'?geom.coordinates:[]}
function normalizeLon(lon,ref){while(lon-ref>180)lon-=360;while(lon-ref<-180)lon+=360;return lon}
function unwrapRing(ring){
  if(!ring||!ring.length)return[];
  const out=[[ring[0][0],ring[0][1]]];
  let prev=ring[0][0];
  for(let i=1;i<ring.length;i++){
    let x=ring[i][0];
    while(x-prev>180)x-=360;
    while(x-prev<-180)x+=360;
    out.push([x,ring[i][1]]);
    prev=x;
  }
  return out;
}
function pointInRing(lon,lat,ring){
  const pts=unwrapRing(ring);
  if(pts.length<3)return false;
  let minX=Infinity,maxX=-Infinity;
  for(const p of pts){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0])}
  const ref=(minX+maxX)/2;
  let x=lon;
  while(x-ref>180)x-=360;
  while(x-ref<-180)x+=360;
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    const hit=((yi>lat)!==(yj>lat))&&(x<(xj-xi)*(lat-yi)/(yj-yi+1e-12)+xi);
    if(hit)inside=!inside;
  }
  return inside;
}
function pointInCountry(c,lon,lat){
  for(const poly of geometryPolygons(c.geometry)){
    if(!poly[0]||!pointInRing(lon,lat,poly[0]))continue;
    let inHole=false;
    for(let i=1;i<poly.length;i++){
      if(pointInRing(lon,lat,poly[i])){inHole=true;break}
    }
    if(!inHole)return true;
  }
  return false;
}
function geographicHitDistance(c,lon,lat){
  const clat=Number.isFinite(c.lat)?c.lat:0,clon=Number.isFinite(c.lon)?normalizeLon(c.lon,lon):lon;
  const dx=(clon-lon)*Math.cos(((clat+lat)/2)*Math.PI/180),dy=clat-lat;

function canSpeak(){return typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined'}
let lariaSpeechRun=0;
function stopSpeech(){
  lariaSpeechRun++;

  if(b){b.classList.remove('is-speaking');b.setAttribute('aria-pressed','false')}
}
function speechSegmentsForQuestion(q){
  const segments=[];
  const add=(value,lang)=>{
    const spoken=String(value||'').trim();
    if(spoken)segments.push({text:spoken,lang});
  };
  const english=q.subject==='english',prompt=String(q.prompt||'');
  const norwegianInstruction=english&&/^(?:Hva|Hvilket|Hvilken|Velg|Finn|Hvor)\b/i.test(prompt);
  if(q.passage)add(q.passage,english?'en-GB':'nb-NO');
  if(norwegianInstruction){
    const quoted=/(?:“([^”]+)”|«([^»]+)»)/g;
    let from=0,match;
    while((match=quoted.exec(prompt))){
      add(prompt.slice(from,match.index),'nb-NO');
      const word=match[1]||match[2];
      const isEnglishWord=q.englishWord&&word.toLocaleLowerCase('nb-NO')===String(q.englishWord).toLocaleLowerCase('nb-NO');
      add(word,isEnglishWord?'en-GB':'nb-NO');
      from=match.index+match[0].length;
    }
    add(prompt.slice(from),'nb-NO');
  }else add(prompt,english?'en-GB':'nb-NO');
  if(Array.isArray(q.options)&&q.options.length&&currentGrade()<=2){
    const norwegianAnswers=english&&norwegianInstruction&&/på norsk\??\s*$/i.test(prompt);
    add(norwegianInstruction||!english?'Svaralternativer':'Answers',
      norwegianInstruction||!english?'nb-NO':'en-GB');
    add(q.options.join(', '),norwegianAnswers||!english?'nb-NO':'en-GB');
  }
  return segments;
}

  let index=0;
  const next=()=>{
    if(run!==lariaSpeechRun)return;
    const part=segments[index++];

    }
    const u=new SpeechSynthesisUtterance(part.text);

function englishPronunciationTarget(q){
  if(q?.subject!=='english')return '';
  if(typeof q.englishWord==='string'&&q.englishWord.trim())return q.englishWord.trim();

  if(/på engelsk\??\s*$/i.test(q.prompt||''))return String(q.answer||'').trim().slice(0,140);

  if(/^(?:Hva|Hvilket|Hvilken)\b/i.test(q.prompt||''))return '';

}

async function refreshCommerceScreen(){
  const api=window.LARIA_COMMERCE_V18;
  const title=document.getElementById('commerce-status-title'),copy=document.getElementById('commerce-status-copy'),products=document.getElementById('commerce-products'),message=document.getElementById('commerce-message');
  if(!api||!title||!copy||!products)return;
  title.textContent='Kontrollerer abonnement …';copy.textContent='Henter status fra App Store.';products.innerHTML='';if(message)message.textContent='';
  const status=await api.refresh();
  if(status.active){
    title.textContent='Premium er aktiv ⭐';
    copy.textContent='Hele læringsreisen er låst opp på denne App Store-kontoen.';
  }else if(!status.native){
    title.textContent='Forhåndsvisning';
    copy.textContent='Webversjonen tar ikke betalt. Den brukes til utvikling og testing av hele Læria.';
  }else if(status.error){
    title.textContent='App Store er midlertidig utilgjengelig';
    copy.textContent='Vi klarte ikke å kontrollere abonnementene nå. Prøv igjen, eller bruk «Gjenopprett kjøp» hvis du allerede abonnerer.';
  }else if(!status.storeReady){
    title.textContent='App Store-oppsettet er ikke aktivt ennå';
    copy.textContent='Læria-appen er klar for StoreKit, men abonnementene må opprettes i App Store Connect før betaling kan gjennomføres.';
  }else{
    title.textContent='Premium er ikke aktiv';
    copy.textContent='Velg et abonnement under for å låse opp hele læringsreisen.';
  }
  products.innerHTML=(status.products||[]).map(p=>'<div class="subject-progress-card"><strong>'+escapeHtml(p.displayName||'Læria Premium')+'</strong><span>'+escapeHtml(p.displayPrice||'')+(p.periodValue?' · '+escapeHtml(String(p.periodValue))+' '+escapeHtml(String(p.periodUnit||'')):'')+'</span><button class="primary commerce-buy" type="button" data-product-id="'+escapeHtml(p.id)+'">Velg</button></div>').join('');
  products.querySelectorAll('[data-product-id]').forEach(button=>button.onclick=async()=>{
    if(message)message.textContent='Åpner App Store …';
    try{
      const result=await api.purchase(button.dataset.productId);
      if(result.status==='cancelled')message.textContent='Kjøpet ble avbrutt.';
      else if(result.status==='pending')message.textContent='Kjøpet venter på godkjenning i App Store.';
      else message.textContent='Premium er aktivert.';
      await refreshCommerceScreen();
    }catch(error){message.textContent=String(error?.message||error||'Kjøpet kunne ikke gjennomføres.')}
  });
}
document.getElementById('commerce-restore').onclick=async()=>{

  try{await window.LARIA_COMMERCE_V18.restore();if(message)message.textContent='Kjøp er kontrollert.';await refreshCommerceScreen()}
  catch(error){if(message)message.textContent=String(error?.message||error||'Kunne ikke gjenopprette kjøp.')}
};

// --- Quality-assured external data layer ---
const NE50_URL='https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson';
const WB2024_URL='https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?date=2024&format=json&per_page=400';
const qualityStatus={map:false,population:false};
function updateDataStatus(){const el=document.getElementById('data-status');if(!el)return;if(qualityStatus.map&&qualityStatus.population)el.textContent='Kart: Natural Earth 1:50m · befolkning: Verdensbanken 2024';else if(qualityStatus.map)el.textContent='Kart: Natural Earth 1:50m · befolkning bruker reserveverdier';else if(qualityStatus.population)el.textContent='Befolkning: Verdensbanken 2024 · kart bruker innebygd reserve';else el.textContent='Norske navn og hovedsteder · innebygde reservefakta er aktive offline'}
function findCountryForFeature(p={}){const a2=[p.ISO_A2_EH,p.ISO_A2,p.WB_A2].find(v=>typeof v==='string'&&v.length===2&&v!=='-99');if(a2){const hit=WORLD_COUNTRIES.find(c=>c.a2===a2);if(hit)return hit}const a3=[p.ISO_A3_EH,p.ADM0_A3,p.ISO_A3,p.SOV_A3].find(v=>typeof v==='string'&&v.length===3&&v!=='-99');return a3?WORLD_COUNTRIES.find(c=>c.a3===a3):null}
async function loadDetailedGeometry(){try{const r=await fetch(NE50_URL,{cache:'force-cache'});if(!r.ok)throw new Error('map '+r.status);const geo=await r.json();let updated=0;for(const f of geo.features||[]){const c=findCountryForFeature(f.properties);if(!c||!f.geometry)continue;c._detailGeometry=f.geometry;const px=Number(f.properties?.LABEL_X),py=Number(f.properties?.LABEL_Y);if(Number.isFinite(px)&&Number.isFinite(py)){c.lon=px;c.lat=py}updated++}qualityStatus.map=updated>150;updateDataStatus()}catch(e){updateDataStatus()}}
async function loadPopulation2024(){try{const r=await fetch(WB2024_URL,{cache:'force-cache'});if(!r.ok)throw new Error('population '+r.status);const data=await r.json(),rows=Array.isArray(data)&&Array.isArray(data[1])?data[1]:[];let updated=0;for(const row of rows){if(!row||row.value==null)continue;const code=String(row.countryiso3code||'').toUpperCase(),c=WORLD_COUNTRIES.find(x=>x.a3===code);if(!c)continue;c.population=Number(row.value);c.populationYear=2024;updated++}qualityStatus.population=updated>150;updateDataStatus()}catch(e){updateDataStatus()}}
let qualityDataPromise=null;
function loadQualityData(){
  if(qualityDataPromise)return qualityDataPromise;
  updateDataStatus();
  qualityDataPromise=Promise.allSettled([loadDetailedGeometry(),loadPopulation2024()]).then(()=>{updateDataStatus();return true});
  return qualityDataPromise;
}
let qualityDataScheduled=false;
function scheduleQualityData(){
  if(qualityDataPromise||qualityDataScheduled)return;
  qualityDataScheduled=true;
  setTimeout(()=>{
    const run=()=>loadQualityData().catch(()=>{});
    if('requestIdleCallback' in window)requestIdleCallback(run,{timeout:6000});
    else setTimeout(run,1200);
  },2500);
}

// App resume policy:
// - A real launch always starts on Home.
// - Short background pauses keep the current screen.
// - After 10 minutes away, return to Home while preserving any unfinished session.
const APP_RESUME_HOME_AFTER_MS=10*60*1000;
let appHiddenAt=null;

function returnHomeAfterLongPause(){
  if(activeScreenName()==='session'&&state.activeSession)persistActiveSession();
  setTab('home');
  renderHomeContinue();
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    appHiddenAt=Date.now();
    if(activeScreenName()==='session'&&state.activeSession)persistActiveSession();
    return;
  }
  if(document.visibilityState==='visible'&&appHiddenAt){
    const awayFor=Date.now()-appHiddenAt;
    appHiddenAt=null;
    if(awayFor>=APP_RESUME_HOME_AFTER_MS)returnHomeAfterLongPause();
  }
});

window.addEventListener('pagehide',()=>{
  appHiddenAt=Date.now();
  if(activeScreenName()==='session'&&state.activeSession)persistActiveSession();
});

window.addEventListener('pageshow',event=>{
  if(!event.persisted)return;
  const awayFor=appHiddenAt?Date.now()-appHiddenAt:APP_RESUME_HOME_AFTER_MS;
  appHiddenAt=null;
  if(awayFor>=APP_RESUME_HOME_AFTER_MS)returnHomeAfterLongPause();
});
