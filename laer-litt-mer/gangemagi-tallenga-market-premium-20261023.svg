<radialGradient id="premiumSun"><stop stop-color="#fff3c0" stop-opacity=".75"/><stop offset=".47" stop-color="#ffe5b2" stop-opacity=".22"/><stop offset="1" stop-color="#fce1b6" stop-opacity="0"/></radialGradient></defs>
<g id="market-overlay-art" opacity=".32" aria-hidden="true" pointer-events="none">
<g transform="translate(715 331)" opacity=".76" aria-hidden="true"><path d="M-17 172Q150 2 333 171L330 190Q149 38-18 192Z" fill="#c7ac87" stroke="#866d55" stroke-width="8"/><path d="M0 169Q158 25 318 170" fill="none" stroke="#fff0c5" stroke-width="7"/><path d="M1 166L3 192M46 129L50 162M97 90L103 133M149 77L149 115M209 91L202 134M261 126L251 162M306 165L310 188" stroke="#987e62" stroke-width="6"/><path d="M0 134Q150 -27 318 134" fill="none" stroke="#a68663" stroke-width="8"/><path d="M0 127Q154 -35 318 127" fill="none" stroke="#fff0c2" stroke-width="5"/><g stroke="#d0b18d" stroke-width="6" fill="#967858"><rect x="-5" y="121" width="15" height="36" rx="6"/><rect x="75" y="40" width="15" height="53" rx="6"/><rect x="147" y="16" width="15" height="57" rx="6"/><rect x="231" y="45" width="15" height="53" rx="6"/><rect x="314" y="123" width="15" height="36" rx="6"/></g><g fill="#f5ddb3"><circle cy="121" r="10"/><circle cx="82" cy="39" r="10"/><circle cx="154" cy="16" r="10"/><circle cx="238" cy="44" r="10"/><circle cx="321" cy="123" r="10"/></g></g>
