 <linearGradient id="hill1" x2=".6" y2="1"><stop stop-color="#a2bc96"/><stop offset="1" stop-color="#719c7c"/></linearGradient>
 <linearGradient id="hill2" x2=".9" y2="1"><stop stop-color="#94b18b"/><stop offset="1" stop-color="#638f78"/></linearGradient>
