name: Bust status alert cache 1216
on:
  push:
    paths:
      - '.github/workflows/bust-status-alert-cache-1216.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust cache refs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./oss.js?v=20260824-0802','./oss.js?v=20260824-1214',1)
          s=s.replace('./planned-ui.js?v=20260824-1124','./planned-ui.js?v=20260824-1216',1)
          p.write_text(s)
          p=Path('planned-ui.js')
          s=p.read_text()
          s=s.replace('./seen-ui.js?v=20260824-1114','./seen-ui.js?v=20260824-1212',1)
          s=s.replace("version:'20260824-1124'","version:'20260824-1216'",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html planned-ui.js
          git commit -m "Bust cache for dagsformvarsler"
          git push
