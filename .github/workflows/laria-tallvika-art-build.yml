name: Tallvika – generate review-only figure-free background
on:
  push:
    branches: [feat/laria-tallvika-selected-troll-portrait-20261028]
    paths:
      - 'tools/tallvika/build_figure_free_scene.py'
      - '.github/workflows/laria-tallvika-art-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  figure-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laria-tallvika-selected-troll-portrait-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Build derived scene without altering locked originals
        run: python tools/tallvika/build_figure_free_scene.py
      - name: Verify protected skyline and real WEBP format
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source=Image.open('laer-litt-mer/assets/tallvika/laria-tallvika-premium-locked-20261027.png').convert('RGB')
          derivative=Image.open('laer-litt-mer/assets/tallvika/tallvika-figure-free-20261028.webp')
          assert derivative.format == 'WEBP'
          assert derivative.size == (1602,981)
          print('PASS: correct size and source checked in generator, proof requires visual review')
          PY
      - name: Commit generated proof only to review branch
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laer-litt-mer/assets/tallvika/tallvika-figure-free-20261028.webp
          if git diff --cached --quiet; then
            echo 'No change to generated scene'
          else
            git commit -m "art(tallvika): add derived figure-free 27 Oct scene for review"
            git push origin HEAD:feat/laria-tallvika-selected-troll-portrait-20261028
          fi
