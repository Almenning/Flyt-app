name: Oss dagsform
on:
  push:
    paths:
      - '.github/workflows/oss-dagsform.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync.js with Oss
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sync.js')
          s=p.read_text()
          marker="window.FlytSync={queueSave,pull,bootstrap};window.addEventListener('DOMContentLoaded',bootstrap);"
          if marker not in s:
              raise SystemExit('sync marker not found')
          code=r'''
const OSS_LEVELS=['low','med','high'];
const OSS_LABEL={low:'Lav',med:'Middels',high:'Høy'};
const OSS_NEEDS=[['relief','💛 Avlastning'],['closeness','💗 Nærhet'],['sex','🔥 Sex'],['initiative','⚡ Initiativ'],['alone','🌿 Alenetid'],['quiet','🌙 Ro']];
let ossRows=[];
function ossAge(ts){if(!ts)return 'Ikke oppdatert ennå';const m=Math.max(0,Math.round((Date.now()-new Date(ts).getTime())/60000));if(m<2)return 'Oppdatert nå';if(m<60)return `Oppdatert for ${m} min siden`;const h=Math.round(m/60);if(h<24)return `Oppdatert for ${h} t siden`;return `Oppdatert for ${Math.round(h/24)} d siden`}
async function loadOssRows(){const {data,error}=await sb.rpc('get_household_status');if(error)throw error;ossRows=Array.isArray(data)?data:[];return ossRows}
function myOss(){return ossRows.find(x=>x.user_id===ctx?.user_id)||{energy:'med',capacity:'med',closeness:'med',desire:'med',stress:'med',needs:[]}}
function partnerOss(){return ossRows.find(x=>x.user_id!==ctx?.user_id)||null}
function ossSegments(k,v){return `<div class="segments">${OSS_LEVELS.map(x=>`<button data-oss-level="${k}" data-oss-value="${x}" class="${v===x?'on':''}">${OSS_LABEL[x]}</button>`).join('')}</div>`}
function ossRow(name,key,value){return `<div class="card"><strong>${name}</strong>${ossSegments(key,value)}</div>`}
function ossPartnerCard(){const member=partnerMember(),p=partnerOss();if(!member)return `<div class="card"><p class="sub">Partneren er ikke koblet til ennå.</p></div>`;if(!p)return `<div class="card"><strong>${esc(member.display_name||'Partner')}</strong><p class="sub">Har ikke delt dagsform ennå.</p></div>`;const rows=[['Energi',p.energy],['Overskudd',p.capacity],['Nærhet',p.closeness],['Sexlyst',p.desire],['Stress',p.stress]].map(([n,v])=>`<div class="row" style="padding:5px 0"><span class="grow">${n}</span><span class="tag">${OSS_LABEL[v]||'Middels'}</span></div>`).join('');const needs=(p.needs||[]).map(k=>OSS_NEEDS.find(x=>x[0]===k)?.[1]).filter(Boolean);return `<div class="card hero"><strong>${esc(member.display_name||'Partner')} akkurat nå</strong><div class="taskmeta">${ossAge(p.updated_at)}</div><div style="margin-top:8px">${rows}</div><div class="taskmeta" style="margin-top:11px">Behov</div>${needs.length?`<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:7px">${needs.map(n=>`<span class="tag">${n}</span>`).join('')}</div>`:'<p class="sub">Ingen behov markert akkurat nå.</p>'}</div>`}
async function renderOss(){const c=$('#content');if(!c)return;try{if(!ctx)await loadContext();await loadOssRows()}catch(e){c.innerHTML='<div class="ey">Oss</div><h1 class="title">Dagsform</h1><div class="card"><strong>Kunne ikke hente dagsform</strong><p class="sub">Prøv igjen om et øyeblikk.</p></div>';return}const a=myOss();c.innerHTML=`<div class="ey">Oss · Dagsform</div><h1 class="title">Hvordan har du det?</h1><p class="sub">Del hvordan kapasiteten og behovene dine er akkurat nå. Partneren ser statusen, men kan ikke endre den.</p>${ossRow('Energi','energy',a.energy)}${ossRow('Overskudd','capacity',a.capacity)}${ossRow('Nærhet','closeness',a.closeness)}${ossRow('Sexlyst','desire',a.desire)}${ossRow('Stress','stress',a.stress)}<div class="section"><strong>Hva trenger du akkurat nå?</strong><p class="sub">Velg gjerne flere.</p><div class="grid2" style="margin-top:8px">${OSS_NEEDS.map(([k,n])=>`<button class="need ${(a.needs||[]).includes(k)?'on':''}" data-oss-need="${k}">${n}</button>`).join('')}</div><button id="ossNoNeeds" class="secondary full" style="margin-top:10px">Ingen behov akkurat nå</button></div><div class="section"><div class="ey">Partnerens status</div>${ossPartnerCard()}</div>`;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view==='us'));c.scrollTop=0}
async function saveOss(next){const {error}=await sb.rpc('save_my_status',{p_energy:next.energy,p_capacity:next.capacity,p_closeness:next.closeness,p_desire:next.desire,p_stress:next.stress,p_needs:next.needs||[]});if(error)throw error}
document.addEventListener('click',async e=>{const nav=e.target.closest('#nav button[data-view="us"]');if(nav){e.preventDefault();e.stopImmediatePropagation();await renderOss();return}const level=e.target.closest('[data-oss-level]');if(level){e.preventDefault();e.stopImmediatePropagation();const a={...myOss(),needs:[...(myOss().needs||[])]};a[level.dataset.ossLevel]=level.dataset.ossValue;try{await saveOss(a);await renderOss()}catch(err){alert('Kunne ikke lagre dagsformen akkurat nå.')}return}const need=e.target.closest('[data-oss-need]');if(need){e.preventDefault();e.stopImmediatePropagation();const a={...myOss(),needs:[...(myOss().needs||[])]},k=need.dataset.ossNeed,i=a.needs.indexOf(k);i>=0?a.needs.splice(i,1):a.needs.push(k);try{await saveOss(a);await renderOss()}catch(err){alert('Kunne ikke lagre behovet akkurat nå.')}return}if(e.target.closest('#ossNoNeeds')){e.preventDefault();e.stopImmediatePropagation();const a={...myOss(),needs:[]};try{await saveOss(a);await renderOss()}catch(err){alert('Kunne ikke lagre behovet akkurat nå.')}}},true);
'''
          s=s.replace(marker,code+'\n'+marker,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync.js
          git commit -m "Åpne Oss med dagsform og individuelle behov"
          git push
