name: Laria Brøklab Premium WebKit

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/fraction-*'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-fraction-premium.playwright.js'
      - '.github/workflows/laria-fraction-premium.yml'
  push:
    branches: [main]
    paths:
      - 'laer-litt-mer/fraction-*'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-fraction-premium.playwright.js'
      - '.github/workflows/laria-fraction-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-fraction-premium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fraction-premium:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Brøklaben in Chromium and WebKit
        env:
          FRACTION_QA_SCREENSHOTS: /tmp/laria-fraction-workshop
        run: |
          node --check laer-litt-mer/fraction-premium-v2.js
          node --check tests/laria-fraction-premium.playwright.js
          node tests/laria-fraction-premium.playwright.js
      - name: Preserve Brøklab screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-fraction-premium-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/laria-fraction-workshop
          if-no-files-found: warn
          retention-days: 14
