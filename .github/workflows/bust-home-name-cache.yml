name: Bust Home Name cache
on:
  push:
    paths:
      - '.github/workflows/bust-home-name-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump sync and home script versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./sync.js?v=20260823-2024','./sync.js?v=20260823-2043',1)
          s=s.replace('./home-ui.js?v=20260823-2031','./home-ui.js?v=20260823-2043',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tving ferskt profilnavn på Hjem"
          git push
