name: Stability pass core
on:
  push:
    paths:
      - '.github/workflows/stability-pass-core.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-stability-pass
      - name: Patch index render ownership and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          for f in ['sync','oss','app-watchdog','tasks-ui']:
              import re
              s=re.sub(rf'<script src="\./{re.escape(f)}\.js(?:\?v=[^"]+)?" defer></script>',f'<script src="./{f}.js?v=20260823-1948" defer></script>',s,1)
          old="function render(){const map={home,tasks,seen,rewards,us};const fn=map[state.view]||home;$('#content').innerHTML=fn();$('#switchUser').textContent=state.user+' + '+partner()+' ▾';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}"
          new="function render(){if(state.view==='tasks'&&window.FlytTasksUI?.render){window.FlytTasksUI.render();return}if(state.view==='us'&&window.FlytOss?.render){window.FlytOss.render({refresh:false});return}const map={home,seen,rewards};const fn=map[state.view]||home;$('#content').innerHTML=fn();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}"
          if old not in s:
              raise SystemExit('legacy render marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "La nye moduler eie Gjøre og Oss"
          git push origin HEAD:beta-stability-pass
