name: Laria verify bounded free-play pickup correction
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/laria-verify-free-supply.yml']
permissions:
  contents: read
jobs:
  prepare-reviewed-files:
    if: github.repository == 'Almenning/Flyt-app' && github.event.pull_request.number == 192 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/laria-gangemagi-premium-main-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare only the hash-verified render fix and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='Almenning/Flyt-app'
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          before={'laer-litt-mer/multiplication-gangemagi-v1.js':'5f74a075a70f243b4b5a607816bc4a77ffbb5384','tests/laria-gangemagi.playwright.js':'24651d58bdc92260f96a5bd5ace568b44510fa56','tests/laria-gangemagi-tap-intent.test.cjs':'614df57d5e787d16504c06c0e76871e740877c88'}
          after={'laer-litt-mer/multiplication-gangemagi-v1.js':'7c7c73722590c5bf03c2668c23b2da61e899f692','tests/laria-gangemagi.playwright.js':'63403a3519ff301875f27719f044c53339b1f934','tests/laria-gangemagi-tap-intent.test.cjs':'833c08d75115ad4c6f3c8c15c87aa42cb69e1b10'}
          for name,sha in before.items():assert blob(Path(name).read_bytes())==sha,name
          p=Path('laer-litt-mer/multiplication-gangemagi-v1.js');s=p.read_text()
          old="'+berrySourceArt+'</span><span>'+(free?"
          new="'+(free?berrySvg:berrySourceArt)+'</span><span>'+(free?"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          p=Path('tests/laria-gangemagi.playwright.js');s=p.read_text()
          anchor="  assert.equal(await page.locator('.gm-quest').count(),0,'free play keeps its existing independent controls');"
          block='''
            // Free play has a single-icon pickup button, not the mission's five-berry
            // crate. Stacking crate art here used to paint over the mode/factor controls.
            const freeSupply=page.locator('[data-gm-action="source"]');
            assert.equal(await freeSupply.locator('.gm-source-berry').count(),0,
              label+' free play must not inherit the mission crate pile');
            assert.equal(await freeSupply.locator('.gm-pick-fruit [data-gm-prop="berry"]').count(),1,
              label+' free pickup button has exactly one illustrated fruit');
            const freeProp=await freeSupply.evaluate(button=>{
              const b=button.getBoundingClientRect();
              const f=button.querySelector('.gm-pick-fruit svg').getBoundingClientRect();
              return {inside:f.left>=b.left-1&&f.right<=b.right+1&&f.top>=b.top-1&&f.bottom<=b.bottom+1,
                button:b.toJSON(),fruit:f.toJSON()};
            });
            assert.ok(freeProp.inside,label+' free-play fruit must stay inside its own button '+JSON.stringify(freeProp));
            const freeBefore=(await page.evaluate(()=>LARIA_GANGEMAGI.snapshot())).counts;
            await freeSupply.click();
            assert.deepEqual((await page.evaluate(()=>LARIA_GANGEMAGI.snapshot())).counts,
              freeBefore.map((n,i)=>n+(i===0?1:0)),label+' free pickup still adds exactly one berry');
            await page.locator('[data-gm-action="undo"]').click();
            assert.deepEqual((await page.evaluate(()=>LARIA_GANGEMAGI.snapshot())).counts,freeBefore,
              label+' undo restores free play after the pickup regression');
          '''
          assert s.count(anchor)==1;p.write_text(s.replace(anchor,anchor+'\n'+block))
          sha=after['tests/laria-gangemagi-tap-intent.test.cjs']
          req=urllib.request.Request('https://api.github.com/repos/Almenning/Flyt-app/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response: data=base64.b64decode(json.load(response)['content'])
          assert blob(data)==sha;Path('tests/laria-gangemagi-tap-intent.test.cjs').write_bytes(data)
          for name,sha in after.items():assert blob(Path(name).read_bytes())==sha,name
          out=Path('/tmp/laria-free-supply');out.mkdir()
          (out/'expected.json').write_text(json.dumps(after))
          print('Verified three locally reviewed output hashes')
          PY
      - name: Validate syntax and all seventeen focused regressions
        run: |
          node --check laer-litt-mer/multiplication-gangemagi-v1.js
          node --check tests/laria-gangemagi.playwright.js
          node --test tests/laria-gangemagi-engine.test.cjs tests/laria-gangemagi-release-cache.test.cjs tests/laria-gangemagi-tap-intent.test.cjs tests/laria-gangemagi-props.test.cjs
      - name: Store reviewed blobs only; never move a remote reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='Almenning/Flyt-app'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['SOURCE_HEAD']
          out=Path('/tmp/laria-free-supply');expected=json.loads((out/'expected.json').read_text());entries=[]
          assert len(expected)==3
          for name,sha in expected.items():
              data=Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              req=urllib.request.Request('https://api.github.com/repos/Almenning/Flyt-app/git/blobs',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              assert result['sha']==sha
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
              dest=out/'reviewed-files'/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          manifest={'parent':git('rev-parse','HEAD'),'base_tree':git('rev-parse','HEAD^{tree}'),'tree_elements':entries,'remote_refs_changed':False}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('REVIEWED_FREE_SUPPLY',json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: laria-free-supply-review-${{ github.event.pull_request.head.sha }}
          path: /tmp/laria-free-supply
          if-no-files-found: error
          retention-days: 3
