name: Laria Journey Integrated WebKit

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/*journey*'
      - 'laer-litt-mer/locked-journeys/**'
      - 'laer-litt-mer/laria-navigation-v13.*'
      - 'tests/laria-journey-integrated-ux.playwright.js'
      - '.github/workflows/laria-journey-integrated.yml'
  push:
    branches: [main]
    paths:
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/*journey*'
      - 'laer-litt-mer/locked-journeys/**'
      - 'laer-litt-mer/laria-navigation-v13.*'
      - 'tests/laria-journey-integrated-ux.playwright.js'
      - '.github/workflows/laria-journey-integrated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-journey-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey-integrated:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start exact-head local server
        shell: bash
        run: |
          python3 -m http.server 8765 --directory . >/tmp/laria-journey-server.log 2>&1 &
          echo $! >/tmp/laria-journey-server.pid
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laria-journey-server.log
          exit 1
      - name: Verify integrated four-journey flow on iPhone and iPad WebKit
        run: |
          node --check tests/laria-journey-integrated-ux.playwright.js
          node tests/laria-journey-integrated-ux.playwright.js
      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/laria-journey-server.pid ]; then
            kill "$(cat /tmp/laria-journey-server.pid)" 2>/dev/null || true
          fi
