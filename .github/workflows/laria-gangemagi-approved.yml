name: Laria Gangemagi approved Markedsbok visual QA

on:
  push:
    paths:
      - 'laer-litt-mer/gangemagi-markedsbok-approved-v2.css'
      - 'laer-litt-mer/gangemagi-approved-eight-scenes-20261017.webp'
      - 'laer-litt-mer/multiplication-gangemagi-v1.js'
      - 'laer-litt-mer/multiplication-gangemagi-engine-v1.js'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-gangemagi.playwright.js'
      - 'laer-litt-mer/gangemagi-dagens-oppdrag-v1.css'
      - 'laer-litt-mer/gangemagi-market-table-premium.svg'
      - 'laer-litt-mer/gangemagi-math-parchment.svg'
      - 'laer-litt-mer/gangemagi-quest-board-painted.svg'
      - 'laer-litt-mer/gangemagi-strawberry-painted.svg'
      - 'laer-litt-mer/gangemagi-picking-hand.svg'
      - 'tests/laria-gangemagi-props.test.cjs'
      - 'tests/laria-gangemagi-tap-intent.test.cjs'
      - 'tests/laria-gangemagi-release-cache.test.cjs'
      - '.github/workflows/laria-gangemagi-approved.yml'
  pull_request:
    paths:
      - 'laer-litt-mer/gangemagi-markedsbok-approved-v2.css'
      - 'laer-litt-mer/gangemagi-approved-eight-scenes-20261017.webp'
      - 'laer-litt-mer/multiplication-gangemagi-v1.js'
      - 'laer-litt-mer/multiplication-gangemagi-engine-v1.js'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-gangemagi.playwright.js'
      - 'laer-litt-mer/gangemagi-dagens-oppdrag-v1.css'
      - 'laer-litt-mer/gangemagi-market-table-premium.svg'
      - 'laer-litt-mer/gangemagi-math-parchment.svg'
      - 'laer-litt-mer/gangemagi-quest-board-painted.svg'
      - 'laer-litt-mer/gangemagi-strawberry-painted.svg'
      - 'laer-litt-mer/gangemagi-picking-hand.svg'
      - 'tests/laria-gangemagi-props.test.cjs'
      - 'tests/laria-gangemagi-tap-intent.test.cjs'
      - 'tests/laria-gangemagi-release-cache.test.cjs'
      - '.github/workflows/laria-gangemagi-approved.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-gangemagi-art-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markedsbok-visual:
    # The pinned Playwright WebKit binary requires libicudata.so.74.
    # ubuntu-latest moved beyond that ABI and crashes before app QA starts.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Resolve Playwright cache key
        id: playwright-version
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium and WebKit binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: gangemagi-playwright-${{ runner.os }}-ubuntu2404-${{ steps.playwright-version.outputs.version }}-chromium-webkit
      - name: Validate original image and JavaScript
        run: |
          test -s laer-litt-mer/gangemagi-approved-eight-scenes-20261017.webp
          node --check laer-litt-mer/multiplication-gangemagi-v1.js
          node --check tests/laria-gangemagi.playwright.js
          node --test tests/laria-gangemagi-engine.test.cjs tests/laria-gangemagi-release-cache.test.cjs tests/laria-gangemagi-tap-intent.test.cjs tests/laria-gangemagi-props.test.cjs
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install Chromium and WebKit binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Test six real viewport sizes and render book screenshots
        env:
          QA_SCREENSHOTS: /tmp/laria-gangemagi-approved-visual
        run: node tests/laria-gangemagi.playwright.js
      - name: Preserve visual proof for child-first layout review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-gangemagi-approved-art-${{ github.sha }}
          path: /tmp/laria-gangemagi-approved-visual
          retention-days: 14
          if-no-files-found: warn
