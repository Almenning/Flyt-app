name: Laria review shared play-prop illustrations
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/laria-review-play-props.yml']
permissions:
  contents: read
jobs:
  prepare-reviewed-files:
    if: github.repository == 'Almenning/Flyt-app' && github.event.pull_request.number == 192 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/laria-gangemagi-premium-main-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the exact locally verified preparation script
        run: |
          python3 - <<'PYTHON'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='Almenning/Flyt-app'
          sha='46ba4eb4dabd0c53ab5f841c3d4be9b4b95a4fdf'
          req=urllib.request.Request('https://api.github.com/repos/Almenning/Flyt-app/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
          data=base64.b64decode(result['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          Path('/tmp/laria-props-prepare.py').write_bytes(data)
          PYTHON
      - name: Verify and prepare the eleven bounded files
        run: python3 /tmp/laria-props-prepare.py prepare
      - name: Validate actual source and all sixteen focused regressions
        run: |
          node --check laer-litt-mer/multiplication-gangemagi-v1.js
          node --check tests/laria-gangemagi.playwright.js
          node --test tests/laria-gangemagi-engine.test.cjs tests/laria-gangemagi-release-cache.test.cjs tests/laria-gangemagi-tap-intent.test.cjs tests/laria-gangemagi-props.test.cjs
      - name: Store only reviewed blobs without changing a remote reference
        run: python3 /tmp/laria-props-prepare.py stage
      - uses: actions/upload-artifact@v4
        with:
          name: laria-play-props-review-${{ github.event.pull_request.head.sha }}
          path: /tmp/laria-props-review
          if-no-files-found: error
          retention-days: 3
