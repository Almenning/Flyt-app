name: Declutter task setup
on:
  push:
    paths:
      - '.github/workflows/declutter-task-setup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Declutter setup library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          s=s.replace("{id:'windows',cat:'Hus',name:'Vaske vinduer'","{id:'windows',cat:'Periodisk vedlikehold',name:'Vaske vinduer'",1)
          s=s.replace("{id:'laundry_machine_clean',cat:'Hus',name:'Rense vaskemaskin/tørketrommel'","{id:'laundry_machine_clean',cat:'Periodisk vedlikehold',name:'Rense vaskemaskin/tørketrommel'",1)
          s=s.replace('let step=0;','let step=0,setupExpanded={};',1)

          old="""}else if(step===1){const cats=[...new Set(LIB.map(x=>x.cat))];$('#setupTitle').textContent='Bygg husholdningen';$('#setupBody').innerHTML=`<h1 class=\"title\">Hva gjør dere i løpet av en uke?</h1><p class=\"sub\">Velg oppgaver og juster antall, poeng og ansvar.</p>${cats.map(cat=>`<div class=\"section\"><strong>${cat}</strong>${LIB.filter(x=>x.cat===cat).map(templateRow).join('')}</div>`).join('')}<div class=\"section\"><strong>Egendefinerte</strong>${state.custom.map(templateRow).join('')}<button id=\"customTask\" class=\"secondary full\" style=\"margin-top:10px\">+ Legg til ny egendefinert oppgave</button></div>`;bindSetup()}"""
          new="""}else if(step===1){const cats=[...new Set(LIB.map(x=>x.cat))];$('#setupTitle').textContent='Bygg husholdningen';$('#setupBody').innerHTML=`<h1 class=\"title\">Hva gjør dere i løpet av en uke?</h1><p class=\"sub\">Velg det som er relevant. Vi viser de vanligste først, resten kan åpnes ved behov.</p>${cats.map(cat=>{const all=LIB.filter(x=>x.cat===cat),selected=new Set(state.tasks.map(t=>t.id)),shown=setupExpanded[cat]?all:all.filter((t,i)=>i<6||selected.has(t.id)),hidden=all.length-shown.length;return `<div class=\"section\"><strong>${cat}</strong>${shown.map(templateRow).join('')}${hidden>0?`<button type=\"button\" class=\"secondary full\" data-expand-cat=\"${encodeURIComponent(cat)}\" style=\"margin-top:8px\">Vis ${hidden} flere forslag</button>`:''}${setupExpanded[cat]&&all.length>6?`<button type=\"button\" class=\"secondary full\" data-collapse-cat=\"${encodeURIComponent(cat)}\" style=\"margin-top:8px\">Vis færre</button>`:''}</div>`}).join('')}<div class=\"section\"><strong>Egendefinerte</strong>${state.custom.map(templateRow).join('')}<button id=\"customTask\" class=\"secondary full\" style=\"margin-top:10px\">+ Legg til ny egendefinert oppgave</button></div>`;bindSetup()}"""
          if old not in s:
            raise SystemExit('renderSetup step 1 anchor not found')
          s=s.replace(old,new,1)

          anchor="function bindSetup(){document.querySelectorAll('[data-taskcheck]')"
          repl="function bindSetup(){document.querySelectorAll('[data-expand-cat]').forEach(el=>el.onclick=()=>{setupExpanded[decodeURIComponent(el.dataset.expandCat)]=true;renderSetup()});document.querySelectorAll('[data-collapse-cat]').forEach(el=>el.onclick=()=>{setupExpanded[decodeURIComponent(el.dataset.collapseCat)]=false;renderSetup()});document.querySelectorAll('[data-taskcheck]')"
          if anchor not in s:
            raise SystemExit('bindSetup anchor not found')
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Forenkle oppgavebiblioteket i oppsett"
          git push
