name: Expand task library
on:
  push:
    paths:
      - '.github/workflows/expand-task-library.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand predefined task library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          anchor="{id:'train',cat:'Personlig investering',name:'Trening',freq:3,pts:40,type:'flex',kind:'personal'}];"
          replacement="""{id:'train',cat:'Personlig investering',name:'Trening',freq:3,pts:40,type:'flex',kind:'personal'},
{id:'homework',cat:'Barn',name:'Lekser',freq:5,pts:20,type:'flex',kind:'house'},
{id:'kids_clothes_school',cat:'Barn',name:'Skifte klær til barnehage/skole',freq:2,pts:20,type:'flex',kind:'house'},
{id:'kids_clothes_buy',cat:'Barn',name:'Kjøpe nye klær til barna',freq:1,pts:35,type:'period',kind:'house'},
{id:'counter',cat:'Kjøkken',name:'Vaske kjøkkenbenken',freq:7,pts:15,type:'daily',kind:'house'},
{id:'bath_tidy',cat:'Bad',name:'Rydde badet',freq:3,pts:20,type:'flex',kind:'house'},
{id:'pet_food',cat:'Husdyr',name:'Gi mat og friskt vann',freq:7,pts:15,type:'daily',kind:'house'},
{id:'pet_walk',cat:'Husdyr',name:'Lufte hund',freq:7,pts:25,type:'daily',kind:'house'},
{id:'pet_litter',cat:'Husdyr',name:'Rense kattekasse',freq:7,pts:20,type:'daily',kind:'house'},
{id:'pet_groom',cat:'Husdyr',name:'Stell og børsting',freq:2,pts:20,type:'flex',kind:'house'},
{id:'pet_home_clean',cat:'Husdyr',name:'Rengjøre bur/akvarium/dyreområde',freq:1,pts:40,type:'flex',kind:'house'},
{id:'pet_supplies',cat:'Husdyr',name:'Kjøpe dyremat og utstyr',freq:1,pts:30,type:'flex',kind:'house'},
{id:'pet_vet',cat:'Husdyr',name:'Veterinær, vaksiner og avtaler',freq:1,pts:40,type:'period',kind:'house'},
{id:'pet_meds',cat:'Husdyr',name:'Gi medisiner/behandling',freq:7,pts:20,type:'daily',kind:'house'}];"""
          if anchor not in s:
            raise SystemExit('LIB anchor not found')
          s=s.replace(anchor,replacement,1)
          p.write_text(s)

          p=Path('tasks-ui.js')
          s=p.read_text()
          s=s.replace("const ORDER=['Barn','Kjøkken','Bad','Hus','Utearbeid','Usynlig arbeid','Personlig investering','Egendefinert'];","const ORDER=['Barn','Kjøkken','Bad','Hus','Husdyr','Utearbeid','Usynlig arbeid','Personlig investering','Egendefinert'];",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tasks-ui.js
          git commit -m "Utvid forhåndsdefinerte gjøremål og Husdyr"
          git push
