name: Laria original journey artwork inspection
on:
  push:
    branches: [feat/laria-fox-live-companion-20261011]
    paths:
      - '.github/workflows/laria-journey-art-inspection.yml'
jobs:
  export-originals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Upload approved original paintings for precise fox removal
        uses: actions/upload-artifact@v4
        with:
          name: laria-journey-originals-${{ github.sha }}
          path: |
            laer-litt-mer/locked-journeys/bokskogen-locked-20261010.png
            laer-litt-mer/locked-journeys/tallenga-locked-20261010.png
            laer-litt-mer/locked-journeys/ordlandsbyen-locked-20261010.png
            laer-litt-mer/locked-journeys/nordlysleiren-locked-20261010.png
            laer-litt-mer/bokskogen-verden.png
            laer-litt-mer/matte-verden.png
            laer-litt-mer/engelsk-verden.png
            laer-litt-mer/geografi-verden.png
          if-no-files-found: error
          retention-days: 7
