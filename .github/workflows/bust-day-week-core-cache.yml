name: Bust Day Week Core cache
on:
  push:
    paths:
      - '.github/workflows/bust-day-week-core-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump core script versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./sync.js?v=20260823-2024','./sync.js?v=20260823-2034',1)
          s=s.replace('./app-watchdog.js?v=20260823-1948','./app-watchdog.js?v=20260823-2034',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tving fersk Dag og Uke-kjerne på mobil"
          git push
