name: Bust Sett cache 1124
on:
  push:
    paths:
      - '.github/workflows/bust-sett-cache-1124.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust task and planned UI cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./tasks-ui.js?v=20260824-0847','./tasks-ui.js?v=20260824-1120',1)
          s=s.replace('./planned-ui.js?v=20260824-0947','./planned-ui.js?v=20260824-1124',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bust cache for ny Sett-logikk"
          git push
