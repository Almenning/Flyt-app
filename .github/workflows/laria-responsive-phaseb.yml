name: Laria responsive phase B

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/laria-responsive-phaseb.css'
      - 'laer-litt-mer/locked-journey-renderer.css'
      - 'laer-litt-mer/locked-journey-renderer.js'
      - 'tests/laria-responsive-phaseb-journeys.playwright.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-responsive-phaseb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-original-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and locked-original contracts
        run: |
          node --check tests/laria-responsive-phaseb-journeys.playwright.js
          node --check laer-litt-mer/locked-journey-renderer.js
          node tests/laria-locked-journey-contract.test.cjs
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Verify full-width iPad and Mac composition on four ORIGINAL journeys
        env:
          LARIA_RESPONSIVE_PHASEB_IMAGES: /tmp/laria-responsive-phaseb
        run: node tests/laria-responsive-phaseb-journeys.playwright.js
      - name: Upload original artwork device screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-responsive-phaseb-${{ github.sha }}
          path: /tmp/laria-responsive-phaseb
          if-no-files-found: warn
          retention-days: 7
