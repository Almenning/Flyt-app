name: Laria nattkontroll (uten AI)

on:
  schedule:
    # UTC: 23/22, 02/01, 05/04, 08/07 norsk tid (sommer/vinter).
    - cron: '17 21,0,3,6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: laria-nightly-qa
  cancel-in-progress: false

jobs:
  nightly-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run regression tests and capture visuals (no AI)
        id: qa
        shell: bash
        env:
          QA_SCREENSHOTS: ${{ github.workspace }}/nightly-artifacts/screenshots
          WORD_HUNT_QA_SCREENSHOTS: ${{ github.workspace }}/nightly-artifacts/ordjakt
        run: |
          mkdir -p nightly-artifacts/{screenshots,ordjakt,logs}
          python3 -m http.server 8765 --directory . >nightly-artifacts/logs/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' >/dev/null; then break; fi
            sleep 1
          done
          failed=0
          printf '| Test | Resultat |\n|---|---|\n' >nightly-artifacts/results.md
          while IFS='|' read -r label command; do
            if bash -o pipefail -c "$command" >"nightly-artifacts/logs/${label}.log" 2>&1; then
              printf '| %s | BESTATT |\n' "$label" >>nightly-artifacts/results.md
            else
              printf '| %s | FEILET |\n' "$label" >>nightly-artifacts/results.md
              failed=1
            fi
          done <<'TESTS'
          node|npm run test:node
          basecamp|node tests/laria-basecamp-v12.cjs
          reiser|node tests/laria-journey-integrated-ux.playwright.js
          ordjakt|node tests/laria-word-hunt-phase4.playwright.js
          gangemagi|node tests/laria-gangemagi.playwright.js
          enheter|node tests/laria-device-hardening.playwright.js
          TESTS
          cat nightly-artifacts/results.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-nattkontroll-${{ github.run_id }}
          path: nightly-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Update one GitHub status issue
        if: always()
        uses: actions/github-script@v7
        env:
          QA_FAILED: ${{ steps.qa.outputs.failed }}
        with:
          script: |
            const fs = require('fs');
            const resultPath = 'nightly-artifacts/results.md';
            const results = fs.existsSync(resultPath) ? fs.readFileSync(resultPath, 'utf8') : 'Testene ble ikke fullfort; se Actions-logg.';
            const failed = process.env.QA_FAILED !== '0';
            const title = 'Læria: nattlig QA og arbeidslogg (automatisk)';
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '# Læria nattkontroll',
              '',
              'Siste kjøring: ' + new Date().toISOString(),
              'Commit: `' + context.sha + '` (workflow henter fersk main ved start)',
              '**Status: ' + (failed ? 'FEIL / KREVER GJENNOMGANG' : 'TESTER BESTATT') + '**',
              '',
              results,
              '',
              '[Se testkjøring, logger og WebKit-skjermbilder](' + url + ')',
              '',
              'Dette er teknisk QA, ikke visuell premiumgodkjenning eller fysisk Apple-enhetstest.',
              'Ingen kode endres, ingen PR flettes, og ingenting publiseres av denne workflowen.'
            ].join('\n');
            const {data: issues} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(x => !x.pull_request && x.title === title);
            if (existing) {
              await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
      - name: Fail if any checks failed
        if: steps.qa.outputs.failed != '0'
        run: exit 1
