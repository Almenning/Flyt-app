name: Laria responsive phase C2

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/multiplication-premium-v2.css'
      - 'laer-litt-mer/multiplication-premium-v2.js'
      - 'tests/laria-responsive-phasec2-task-firstfold.playwright.js'
      - '.github/workflows/laria-responsive-phasec2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-responsive-phasec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplication-task-firstfold:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify JavaScript syntax
        run: |
          node --check laer-litt-mer/multiplication-premium-v2.js
          node --check tests/laria-responsive-phasec2-task-firstfold.playwright.js
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Test iPad first viewport and unchanged mobile
        env:
          LARIA_C2_FIRSTFOLD_IMAGES: /tmp/laria-c2-firstfold
        run: node tests/laria-responsive-phasec2-task-firstfold.playwright.js
      - name: Upload first-viewport screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-responsive-c2-${{ github.sha }}
          path: /tmp/laria-c2-firstfold
          if-no-files-found: warn
          retention-days: 7
