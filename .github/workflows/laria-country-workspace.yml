name: Laria country workspace
on:
  push:
    branches: [feat/laria-country-discoveries-20261015]
    paths: ['.github/workflows/laria-country-workspace.yml', 'tests/apply-country-discoveries.cjs']
permissions:
  contents: write
concurrency:
  group: laria-country-discoveries-integration
  cancel-in-progress: false
jobs:
  integrate-and-verify:
    if: github.ref == 'refs/heads/feat/laria-country-discoveries-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laria-country-discoveries-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact-anchor integration
        run: |
          if [ -f tests/apply-country-discoveries.cjs ]; then
            node tests/apply-country-discoveries.cjs
            git add laer-litt-mer/index.html laer-litt-mer/laria-country-detail-premium-v1.js laer-litt-mer/globe-v25-renderer.js laer-litt-mer/sw.js laer-litt-mer/country-population-sources-2024.json laer-litt-mer/country-discoveries-coverage.json tests/laria-country-detail-premium.playwright.js tests/apply-country-discoveries.cjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(laria): connect country discoveries, globe teasers and reader lifecycle'
            git push origin HEAD:feat/laria-country-discoveries-20261015
          fi
      - name: Verify country syntax and content contracts
        run: |
          node --check laer-litt-mer/country-discoveries-v1.js
          node --check laer-litt-mer/country-discoveries-ui-v1.js
          node --check laer-litt-mer/laria-country-detail-premium-v1.js
          node --check laer-litt-mer/globe-v25-renderer.js
          node --test tests/laria-country-discoveries.test.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify country discoveries and reading on six device configurations
        env:
          COUNTRY_DISCOVERY_SCREENSHOTS: /tmp/laria-country-discoveries
        run: node tests/laria-country-discoveries.playwright.js
      - name: Verify existing art, silhouette, fox and practice regressions
        env:
          COUNTRY_STORY_QA_SCREENSHOTS: /tmp/laria-country-story
        run: node tests/laria-country-detail-premium.playwright.js
      - name: Save visual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-discovery-evidence-${{ github.run_id }}
          path: |
            /tmp/laria-country-discoveries
            /tmp/laria-country-story
          retention-days: 7
          if-no-files-found: warn
      - name: Export integrated app and tests for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-workspace-${{ github.run_id }}
          path: |
            laer-litt-mer/
            tests/
            package.json
            package-lock.json
          retention-days: 1
