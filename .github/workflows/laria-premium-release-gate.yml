name: "Læria Premium - release readiness"
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install image pixel-integrity checker
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Verify locked art, exact-SHA devices, progression and child beta
        env:
          LARIA_PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/laria_release/release_gate.cjs
      - name: Mark draft release BLOCKED until objective and human gates pass
        if: failure()
        run: |
          echo "Læria Premium is **not release-ready**. See docs/LARIA-PREMIUM-RELEASE-STATE.json." >> "$GITHUB_STEP_SUMMARY"
          echo "Never equate green code checks with visual product approval." >> "$GITHUB_STEP_SUMMARY"
