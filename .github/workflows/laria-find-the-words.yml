name: Laria Finn ordene WebKit

on:
  push:
    branches: [main]
    paths:
      - 'laer-litt-mer/find-the-words*'
      - 'laer-litt-mer/laria-navigation-v13.*'
      - 'laer-litt-mer/index.html'
      - '.github/workflows/laria-find-the-words.yml'
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/find-the-words*'
      - 'laer-litt-mer/laria-navigation-v13.*'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-find-the-words.playwright.js'
      - '.github/workflows/laria-find-the-words.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-find-words-${{ github.ref }}
  cancel-in-progress: true

jobs:
  picture-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install real WebKit and Chromium browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify picture hunt on iPhone and iPad
        env:
          FIND_WORDS_SCREENSHOTS: /tmp/laria-find-words
        run: |
          node --check laer-litt-mer/find-the-words.js
          node --check tests/laria-find-the-words.playwright.js
          node tests/laria-find-the-words.playwright.js
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-find-words-${{ github.sha }}
          path: /tmp/laria-find-words
          if-no-files-found: warn
          retention-days: 14

  pages-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      pages: read
    steps:
      - name: Report the actual GitHub Pages publication source
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              core.info('Pages URL: ' + data.html_url);
              core.info('Pages build type: ' + data.build_type);
              core.info('Pages source: ' + JSON.stringify(data.source || null));
            } catch (error) {
              core.warning('Pages configuration unavailable: ' + error.message);
            }

  pages-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: picture-hunt
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify real published Læria resources after merge
        shell: bash
        run: |
          set -eu
          base="https://almenning.github.io/Flyt-app/laer-litt-mer"
          for attempt in $(seq 1 42); do
            if curl -fsSL --max-time 15 -H "Cache-Control: no-cache" "$base/find-the-words.js?revision=$GITHUB_SHA" -o /tmp/find-words-live.js &&
               curl -fsSL --max-time 15 "$base/find-the-words.css?revision=$GITHUB_SHA" -o /tmp/find-words-live.css &&
               curl -fsSL --max-time 15 "$base/find-the-words-scene.svg?revision=$GITHUB_SHA" -o /tmp/find-words-live.svg &&
               curl -fsSL --max-time 15 "$base/?app=laria&revision=$GITHUB_SHA" -o /tmp/find-words-live.html &&
               curl -fsSL --max-time 15 "$base/laria-navigation-v13.js?revision=$GITHUB_SHA" -o /tmp/find-words-live-navigation.js &&
               curl -fsSL --max-time 15 "$base/laria-navigation-v13.css?revision=$GITHUB_SHA" -o /tmp/find-words-live-navigation.css &&
               curl -fsSL --max-time 15 "$base/bokskogen-reference-bg.webp?revision=$GITHUB_SHA" -o /tmp/find-words-live-painting.webp &&
               curl -fsSL --max-time 15 "$base/sw.js?revision=$GITHUB_SHA" -o /tmp/find-words-live-sw.js &&
               grep -Fq 'root.openFindTheWords=open' /tmp/find-words-live.js &&
               grep -Fq '.fw-art' /tmp/find-words-live.css &&
               grep -Fq '<svg' /tmp/find-words-live.svg &&
               grep -Fq '20261019-painted-card2' /tmp/find-words-live.html &&
               grep -Fq '20261019-match-first2' /tmp/find-words-live.html &&
               grep -Fq "find-words" /tmp/find-words-live-navigation.js &&
               grep -Fq 'bokskogen-reference-bg.webp' /tmp/find-words-live-navigation.js &&
               grep -Fq '.bc13-find-lens' /tmp/find-words-live-navigation.css &&
               grep -Fq 'paintedfindcard2' /tmp/find-words-live-sw.js &&
               test "$(wc -c < /tmp/find-words-live-painting.webp)" -gt 8000; then
              echo "PASS: Finn ordene JS, CSS, scene and Læria HTML are live on GitHub Pages."
              exit 0
            fi
            echo "Waiting for real Pages publication ($attempt/42)..."
            sleep 10
          done
          echo "FAIL: Læria was not published with Finn ordene at $base." >&2
          exit 1
