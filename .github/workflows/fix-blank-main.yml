name: Fix blank Flyt main view
on:
  push:
    paths:
      - '.github/workflows/fix-blank-main.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch resilient state and render
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),partner=()=>state.user==='Tore'?'Jannicke':'Tore';"
          new="""const defaults=fresh();
state={...defaults,...state};
state.points={...defaults.points,...(state.points||{})};
state.status={
  Tore:{...defaults.status.Tore,...((state.status||{}).Tore||{})},
  Jannicke:{...defaults.status.Jannicke,...((state.status||{}).Jannicke||{})}
};
['Tore','Jannicke'].forEach(u=>{if(!Array.isArray(state.status[u].needs))state.status[u].needs=[]});
if(!Array.isArray(state.tasks))state.tasks=defaults.tasks;
if(!Array.isArray(state.custom))state.custom=[];
if(!Array.isArray(state.completions))state.completions=[];
if(!Array.isArray(state.work))state.work=[];
if(!Array.isArray(state.rewards))state.rewards=defaults.rewards;
if(!['home','tasks','seen','rewards','us'].includes(state.view))state.view='home';
if(!state.user||!['Tore','Jannicke'].includes(state.user))state.user='Tore';
try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),partner=()=>state.user==='Tore'?'Jannicke':'Tore';"""
          if old not in s: raise SystemExit('state insertion pattern not found')
          s=s.replace(old,new,1)

          old="function render(){const views={home,tasks,seen,rewards,us};$('#content').innerHTML=views[state.view]();$('#switchUser').textContent=state.user+' + '+partner()+' ▾';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}"
          new="""function render(){
  const views={home,tasks,seen,rewards,us};
  try{
    const fn=views[state.view]||home;
    $('#content').innerHTML=fn();
    $('#switchUser').textContent=state.user+' + '+partner()+' ▾';
    document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));
  }catch(err){
    console.error('Flyt render error',err);
    $('#content').innerHTML=`<div class=\"ey\">Flyt reparerer data</div><h1 class=\"title\">Noe i den gamle pilotdataen stoppet visningen</h1><p class=\"sub\">Oppsettet kan gjenopprettes uten å påvirke publiseringen.</p><button id=\"repairState\" class=\"primary full\">Reparer lokal appdata</button>`;
  }
}"""
          if old not in s: raise SystemExit('render pattern not found')
          s=s.replace(old,new,1)

          old="if(b.id==='addReward'){const t=prompt('Hva vil du tilby '+partner()+'?');if(t){const req=confirm('Skal den kreve poeng?'),cost=req?(Number(prompt('Hvor mange poeng?',250))||250):0;state.rewards.unshift({id:Date.now(),title:t,by:state.user,requiresPoints:req,cost});save();render()}}});"
          new="""if(b.id==='addReward'){const t=prompt('Hva vil du tilby '+partner()+'?');if(t){const req=confirm('Skal den kreve poeng?'),cost=req?(Number(prompt('Hvor mange poeng?',250))||250):0;state.rewards.unshift({id:Date.now(),title:t,by:state.user,requiresPoints:req,cost});save();render()}}if(b.id==='repairState'){const keepUser=state.user||'Tore';const keepSetup=state.setupDone;state=fresh();state.user=keepUser;state.setupDone=!!keepSetup;state.version=3;save();render();toast('Lokal appdata er reparert')}});"""
          if old not in s: raise SystemExit('click handler pattern not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fiks blank hovedvisning og gammel lokaltilstand"
          git push
