name: Laria responsive phase C

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/multiplication-premium-v2.css'
      - 'tests/laria-responsive-phasec-multiplication.playwright.js'
      - '.github/workflows/laria-responsive-phasec.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-responsive-phasec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplication-ipad-landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check and original maths contracts
        run: |
          node --check tests/laria-responsive-phasec-multiplication.playwright.js
          node --check laer-litt-mer/multiplication-premium-v2.js
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Verify full iPad and Mac scene and unchanged iPhone
        env:
          LARIA_RESPONSIVE_PHASEC_IMAGES: /tmp/laria-responsive-phasec
        run: node tests/laria-responsive-phasec-multiplication.playwright.js
      - name: Upload real device screenshots and measured geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-responsive-phasec-${{ github.sha }}
          path: /tmp/laria-responsive-phasec
          if-no-files-found: warn
          retention-days: 7
