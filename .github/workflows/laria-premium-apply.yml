name: Laria premium retry verification
on:
  push:
    branches: [fix/laria-premium-retry-flow-20261015]
    paths: [.github/workflows/laria-premium-apply.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed patch and commit on isolated branch
        env:
          PATCH_B64: ''
        run: |
          python3 - <<'PY'
          import os,base64,zlib,hashlib,pathlib
          encoded=os.environ['PATCH_B64'].replace('CUZZZzCo','CUZZzCo').replace('TtFRZZ7X','TtFRZ7X')
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='5e4cbc7b4534322f72a932a6a70bf83b60cc9ca3d61f93312c2fc6f558c797f7'
          pathlib.Path('/tmp/laria-retry.patch').write_bytes(patch)
          PY
          git apply --check /tmp/laria-retry.patch
          git apply /tmp/laria-retry.patch
          git rm .github/workflows/laria-premium-apply.yml
          git add laer-litt-mer/index.html laer-litt-mer/laria-task-scene-v15.js laer-litt-mer/sw.js tests/laria-premium-retry-flow.playwright.js tests/laria-premium-retry-flow.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(laria): helpful retries and clean replay without duplicate learning credit'
          git push origin HEAD:refs/heads/fix/laria-premium-retry-flow-20261015
          mkdir -p /tmp/laria-retry-evidence
          git rev-parse HEAD > /tmp/laria-retry-evidence/REVISION.txt
      - run: npm ci --no-audit --no-fund
      - name: Verify syntax and existing unit suite
        run: |
          set -o pipefail
          node --check laer-litt-mer/laria-task-scene-v15.js
          node --check tests/laria-premium-retry-flow.playwright.js
          npm run test:node | tee /tmp/laria-retry-evidence/node-tests.log
      - run: npx playwright install --with-deps chromium webkit
      - name: Exercise all four subjects in both engines and seven viewports
        run: |
          set -o pipefail
          node tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/laria-retry-evidence/browser-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-premium-retry-evidence
          path: /tmp/laria-retry-evidence/
          retention-days: 7
