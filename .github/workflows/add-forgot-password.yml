name: Add forgot password flow
on:
  push:
    paths:
      - '.github/workflows/add-forgot-password.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sync.js')
          s=p.read_text()
          old="""<div class=\"grid2\"><button id=\"betaSignup\" class=\"secondary\">Opprett konto</button><button id=\"betaSignin\" class=\"primary\">Logg inn</button></div><p id=\"betaStatus\" class=\"sub\" style=\"min-height:42px\">${esc(message)}</p>"""
          new="""<div class=\"grid2\"><button id=\"betaSignup\" class=\"secondary\">Opprett konto</button><button id=\"betaSignin\" class=\"primary\">Logg inn</button></div><button id=\"betaForgot\" class=\"secondary full\" style=\"margin-top:10px\">Glemt passord?</button><p id=\"betaStatus\" class=\"sub\" style=\"min-height:42px\">${esc(message)}</p>"""
          if old not in s: raise SystemExit('auth buttons pattern not found')
          s=s.replace(old,new,1)
          old="$('#betaSignup').onclick=signup;$('#betaSignin').onclick=signin;"
          new="$('#betaSignup').onclick=signup;$('#betaSignin').onclick=signin;$('#betaForgot').onclick=forgotPassword;"
          if old not in s: raise SystemExit('auth binding pattern not found')
          s=s.replace(old,new,1)
          marker="async function signup()"
          insert="""async function forgotPassword(){
  const email=$('#betaEmail').value.trim();
  if(!email){status('Skriv inn e-postadressen din først.',true);return}
  status('Sender lenke for nytt passord…');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://almenning.github.io/Flyt-app/'});
  if(error){status(error.message,true);return}
  status('Vi har sendt en lenke for å lage nytt passord. Sjekk innboksen og søppelpost.');
}
"""
          if marker not in s: raise SystemExit('signup marker not found')
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync.js
          git commit -m "Legg til glemt passord"
          git push
