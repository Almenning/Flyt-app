name: Laria Dual Globes Release QA

on:
  push:
    branches: [feat/laria-two-globes-release-20261017, feat/laria-discovery-landscapes-v2-20261017, feat/laria-superglobe-premium-art-20261018, main]
    paths:
      - 'laer-litt-mer/discovery-globe-phase1.js'
      - 'laer-litt-mer/discovery-globe-view-v1.css'
      - 'laer-litt-mer/globe-v25-renderer.js'
      - 'tests/laria-discovery-globe-phase1.playwright.js'
      - 'tests/laria-discovery-globe-phase1-static.js'
      - 'tests/laria-discovery-diagnostics.cjs'
  pull_request:
    branches: [main, feat/laria-discovery-landscapes-v2-20261017]
    paths:
      - 'laer-litt-mer/discovery-globe-phase1.js'
      - 'laer-litt-mer/discovery-globe-view-v1.css'
      - 'laer-litt-mer/globe-v25-renderer.js'
      - 'tests/laria-discovery-globe-phase1.playwright.js'
      - 'tests/laria-discovery-globe-phase1-static.js'
      - 'tests/laria-discovery-diagnostics.cjs'

permissions:
  contents: read

concurrency:
  group: laria-dual-globes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check isolated renderer contract and visual test
        run: |
          node --check laer-litt-mer/discovery-globe-phase1.js
          node --check laer-litt-mer/globe-v25-renderer.js
          node --check tests/laria-discovery-globe-phase1.playwright.js
          node --check tests/laria-discovery-diagnostics.cjs
          node tests/laria-discovery-globe-phase1-static.js
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Capture exact-head iPhone and iPad evidence
        env:
          DISCOVERY_GLOBE_SCREENSHOTS: /tmp/laria-discovery-globe-phase1
        run: node --require ./tests/laria-discovery-diagnostics.cjs tests/laria-discovery-globe-phase1.playwright.js
      - name: Upload comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-discovery-globe-phase1-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/laria-discovery-globe-phase1
          if-no-files-found: warn
          retention-days: 7
