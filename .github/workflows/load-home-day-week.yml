name: Load Home Day Week
on:
  push:
    paths:
      - '.github/workflows/load-home-day-week.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="./tasks-ui.js?v=20260823-2013" defer></script>','<script src="./tasks-ui.js?v=20260823-2031" defer></script>\n<script src="./home-ui.js?v=20260823-2031" defer></script>',1)
          old="function render(){if(state.view==='tasks'&&window.FlytTasksUI?.render){window.FlytTasksUI.render();return}if(state.view==='us'&&window.FlytOss?.render){window.FlytOss.render({refresh:false});return}const map={home,seen,rewards};const fn=map[state.view]||home;$('#content').innerHTML=fn();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}"
          new="function render(){if(state.view==='home'&&window.FlytHomeUI?.render){window.FlytHomeUI.render();return}if(state.view==='tasks'&&window.FlytTasksUI?.render){window.FlytTasksUI.render();return}if(state.view==='us'&&window.FlytOss?.render){window.FlytOss.render({refresh:false});return}const map={seen,rewards};const fn=map[state.view]||home;$('#content').innerHTML=fn();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}"
          if old not in s:
              raise SystemExit('render marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aktiver Dag og Uke på Hjem og Gjøre"
          git push
