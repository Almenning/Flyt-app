name: Laria Math Chapter 2 Pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/math-pattern-haven-*'
      - 'tests/laria-math-pattern-haven.*'
  push:
    branches: [main]
    paths:
      - 'laer-litt-mer/math-pattern-haven-*'
      - 'tests/laria-math-pattern-haven.*'
permissions:
  contents: read
concurrency:
  group: math-pattern-haven-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authoring, persistence and syntax
        run: |
          node --check laer-litt-mer/math-pattern-haven-v1.js
          node --check laer-litt-mer/math-pattern-haven-preview-v1.js
          node --check tests/laria-math-pattern-haven.playwright.js
          node --test tests/laria-math-pattern-haven.test.cjs
      - name: Browser dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Serve exact PR branch
        run: |
          python3 -m http.server 8765 --directory . > /tmp/math-pattern-haven-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/math-pattern-haven-server.log
          exit 1
      - name: Playable on desktop, iPhone and iPad Safari
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_MATH_CHAPTER2_SCREENSHOTS: /tmp/laria-pattern-haven
        run: node tests/laria-math-pattern-haven.playwright.js
      - name: Upload proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-math-chapter2-${{ github.sha }}
          path: /tmp/laria-pattern-haven
          retention-days: 7
          if-no-files-found: warn
