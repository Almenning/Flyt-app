name: Laria journey first paint

on:
  push:
    branches:
      - 'fix/laria-locked-journey-firstpaint-*'
  pull_request:
    paths:
      - 'laer-litt-mer/locked-journey-renderer.js'
      - 'laer-litt-mer/locked-journey-renderer.css'
      - 'tests/laria-locked-journey-firstpaint.playwright.js'
      - '.github/workflows/laria-journey-firstpaint.yml'

permissions:
  contents: read

jobs:
  journey-firstpaint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static syntax check
        run: |
          node --check laer-litt-mer/locked-journey-renderer.js
          node --check tests/laria-locked-journey-firstpaint.playwright.js
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Test original-image first paint and recovery
        env:
          LARIA_JOURNEY_FIRSTPAINT_IMAGES: /tmp/laria-journey-firstpaint
        run: node tests/laria-locked-journey-firstpaint.playwright.js
      - name: Save phone and iPad screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-journey-firstpaint-${{ github.sha }}
          path: /tmp/laria-journey-firstpaint
          if-no-files-found: warn
          retention-days: 7
