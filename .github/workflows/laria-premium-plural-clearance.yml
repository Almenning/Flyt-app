name: Laria plural companion clearance
on:
  push:
    branches: [qa/laria-premium-snapshot-20261015]
    paths: [.github/workflows/laria-premium-plural-clearance.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/laria-premium-retry-flow-20261015
      - run: test "$(git rev-parse HEAD)" = eb10e5c5ea81cd0f4c32a15b61fa2103845a03be
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Reserve the companion space in the existing two-apple composition
        id: apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('laer-litt-mer/laria-task-scene-v15.js');s=p.read_text();old='viewBox="0 0 440 180"';assert s.count(old)==1
          s=s.replace(old,'viewBox="0 0 600 180"').replace('// artwork twice; changing q.visual would change the persisted question key.','// artwork twice; changing q.visual would change the persisted question key.\n      // The trailing canvas reserves space for the companion on narrow phones.')
          p.write_text(s)
          p=Path('tests/laria-premium-retry-flow.playwright.js');s=p.read_text()
          old='return {pluralApples,objects,clippedFeedback,';assert s.count(old)==1
          s=s.replace(old,"return {foxBounds:rect(card.querySelector('.laria-fox-wardrobe-placed')),pluralApples,objects,clippedFeedback,")
          old="  assert(g.objects[0].right<=g.objects[1].left+1,label+' apples overlap');";assert s.count(old)==1
          s=s.replace(old,old+"\n  assert(g.foxBounds&&g.objects.every(r=>r.right+4<=g.foxBounds.left||r.left>=g.foxBounds.right+4||r.bottom+4<=g.foxBounds.top||r.top>=g.foxBounds.bottom+4),label+' companion covers a learning object');")
          p.write_text(s)
          for f in ['laer-litt-mer/index.html','laer-litt-mer/sw.js']:
           p=Path(f);s=p.read_text();assert 'plural1' in s;p.write_text(s.replace('plural1','plural2'))
          PY
          mkdir -p /tmp/plural-clearance
          git diff --check
          node --check laer-litt-mer/laria-task-scene-v15.js
          node --check tests/laria-premium-retry-flow.playwright.js
          npm run test:node > /tmp/plural-clearance/node-tests.log
          git add laer-litt-mer/laria-task-scene-v15.js laer-litt-mer/index.html laer-litt-mer/sw.js tests/laria-premium-retry-flow.playwright.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(laria): keep the selected fox clear of both apples on narrow screens'
          git push origin HEAD:refs/heads/fix/laria-premium-retry-flow-20261015
          git rev-parse HEAD > /tmp/plural-clearance/REVISION.txt
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-plural-clearance-node
          path: /tmp/plural-clearance/
          retention-days: 7
  browser:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Focus the unchanged real bank entry, not a synthetic task
        run: |
          mkdir -p /tmp/plural-clearance
          git rev-parse HEAD > /tmp/plural-clearance/REVISION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/laria-premium-retry-flow.playwright.js');s=p.read_text()
          marker='   const initial=await page.evaluate(()=>({keys:sessionQuestions.map(questionIdentity),questions:sessionQuestions,scope:sessionScope}));entry.initial=initial;';assert s.count(marker)==1
          fixture='''   // Explicit existing-bank fixture; the normal four-subject journeys are tested separately.
             entry.fixture=await page.evaluate(()=>{
              const q=norwegianPool(2,null).find(q=>q.type==='build-word'&&q.answer==='EPLER');
              if(!q)throw Error('Existing EPLER bank entry is missing');
              const key=questionIdentity(q),content=JSON.stringify(q);
              sessionQuestions[0]=q;persistActiveSession();renderQuestion();
              if(questionIdentity(sessionQuestions[0])!==key||JSON.stringify(q)!==content)throw Error('Fixture identity/content changed');
              return {source:'norwegianPool(2,null)',key,content};
             });
          '''
          s=s.replace(marker,fixture+marker)
          s=s.replace("if([390,1180].includes(width)||(width===320&&subject==='math'))",'if(true)')
          p.write_text(s)
          Path('/tmp/plural-clearance/driver.js').write_text(s)
          PY
          git diff -- tests/laria-premium-retry-flow.playwright.js > /tmp/plural-clearance/fixture-only.diff
      - name: Verify actual objects and fox bounds, then correct, replay and return
        env:
          LARIA_RETRY_ENGINE: ${{ matrix.engine }}
          LARIA_RETRY_FORMATS: 320x568,390x844,1180x820
          LARIA_RETRY_SUBJECTS: norwegian
          LARIA_RETRY_EVIDENCE: /tmp/plural-clearance
        run: |
          set -o pipefail
          if [ "$LARIA_RETRY_ENGINE" = webkit ]; then
            printf '%s\n' "const {webkit}=require('./node_modules/playwright');const launch=webkit.launch.bind(webkit);webkit.launch=o=>launch({...o,headless:false});" > .plural-browser-mode.cjs
            xvfb-run -a node -r ./.plural-browser-mode.cjs tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/plural-clearance/browser.log
          else
            node tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/plural-clearance/browser.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-plural-clearance-${{ matrix.engine }}
          path: /tmp/plural-clearance/
          retention-days: 7
