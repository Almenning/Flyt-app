name: Laria English Chapter 2 Pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/english-sentence-harbor-*'
      - 'tests/laria-english-sentence-harbor.*'
permissions:
  contents: read
concurrency:
  group: laria-english-chapter2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate English content, states and syntax
        run: |
          node --check laer-litt-mer/english-sentence-harbor-v1.js
          node --check laer-litt-mer/english-sentence-harbor-preview-v1.js
          node --check tests/laria-english-sentence-harbor.playwright.js
          node --test tests/laria-english-sentence-harbor.test.cjs
      - name: Install Chrome and Safari WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Launch exact-branch web server
        run: |
          python3 -m http.server 8765 --directory . >/tmp/laria-english2-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laria-english2-server.log
          exit 1
      - name: Play English chapter on desktop, iPhone and iPad Safari
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_ENGLISH_CHAPTER2_SCREENSHOTS: /tmp/laria-english2
        run: node tests/laria-english-sentence-harbor.playwright.js
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-english2-${{ github.sha }}
          path: /tmp/laria-english2
          retention-days: 7
          if-no-files-found: warn
