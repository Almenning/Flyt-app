name: Laria multiplication illustration audit
on:
  push:
    branches: [qa/laria-premium-snapshot-20261015]
    paths: [.github/workflows/laria-multiplication-illustration-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b89be7f423008316bf3327b91ebe590705d8044
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Audit actual countable multiplication artwork
        run: |
          mkdir -p /tmp/laria-multiplication-audit
          git rev-parse HEAD > /tmp/laria-multiplication-audit/REVISION.txt
          cat > /tmp/multiplication-audit.cjs <<'JS'
          'use strict';
          const assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path'),http=require('node:http');
          const {chromium,webkit}=require('playwright');
          const root=process.cwd(),out='/tmp/laria-multiplication-audit';
          const seed={version:7,progressSchemaVersion:3,profile:{grade:2,onboarded:true,name:'EventyrQA',avatar:'girl',setupVersion:2},mastery:{},mistakes:{},skillMastery:{},skillMistakes:{},skillLastSeen:{},masteryEvidence:{},skillEvidence:{},preferences:{sound:false,autoRead:false},lastMilestone:null,recentCountryWin:null,lastActivity:null,journey:{nodes:{},gradeWins:{},viewGrades:{}},answerLog:[],sessionLog:[],activeSession:null};
          const mime={'.html':'text/html; charset=utf-8','.css':'text/css','.js':'application/javascript','.json':'application/json','.svg':'image/svg+xml','.webp':'image/webp','.png':'image/png'};
          const server=http.createServer((req,res)=>{let u=new URL(req.url,'http://localhost').pathname;if(u.endsWith('/'))u+='index.html';const f=path.resolve(root,'.'+decodeURIComponent(u));if(!f.startsWith(root+path.sep)){res.writeHead(403);return res.end()}fs.readFile(f,(e,b)=>{res.writeHead(e?404:200,{'Content-Type':mime[path.extname(f)]||'application/octet-stream','Cache-Control':'no-store'});res.end(e?'Missing':b)})});
          const formats=[[390,844],[320,568],[1180,820]],report=[];let failed=false;
          const intersect=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
          async function openLab(page){
            await page.waitForFunction(()=>window.LARIA_MULT_PREMIUM?.version==='illustrated-v2',{}, {timeout:20000});
            await page.evaluate(()=>window.openMultiplicationLab());
            await page.locator('#multiplication-lab-screen.active .mp-shell').waitFor();
            assert.equal(await page.evaluate(()=>window.LARIA_MULT_PREMIUM?.version),'illustrated-v2');
            assert.deepEqual(await page.evaluate(()=>window.LARIA_MULT_ILLUSTRATED_V3?.themes),['strawberry','bun','mushroom','apple']);
          }
          async function geometry(page,selector){
            return page.locator(selector).evaluate(el=>{
              const R=x=>{const r=x.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
              const clippedByHidden=x=>{
                const r=x.getBoundingClientRect();let p=x.parentElement;
                while(p&&p!==document.body){
                  const s=getComputedStyle(p),o=[s.overflow,s.overflowX,s.overflowY].join(' ');
                  if(/hidden|clip/.test(o)){const q=p.getBoundingClientRect();if(r.left<q.left-1||r.right>q.right+1||r.top<q.top-1||r.bottom>q.bottom+1)return true}
                  p=p.parentElement;
                }return false;
              };
              const groups=[...el.querySelectorAll('.mp3-basket')],items=[...el.querySelectorAll('.mp3-item')],foxes=[...document.querySelectorAll('#multiplication-lab-screen.active .mp-mascot img')].filter(x=>R(x).width>0).map(R);
              const area=el.closest('.mp-task-apples')||el,visibleArea=R(area);
              const inside=r=>r.left>=visibleArea.left-1&&r.right<=visibleArea.right+1&&r.top>=visibleArea.top-1&&r.bottom<=visibleArea.bottom+1;
              return {
                width:innerWidth,height:innerHeight,pageScrollWidth:document.documentElement.scrollWidth,
                stage:R(el),visibleArea,groups:groups.map(g=>R(g)),groupItemCounts:groups.map(g=>g.querySelectorAll('.mp3-item').length),
                items:items.map(x=>{const r=R(x);return {...r,insideVisibleArea:inside(r),clipped:clippedByHidden(x),visible:getComputedStyle(x).visibility!=='hidden'&&getComputedStyle(x).display!=='none'}}),
                foxes
              };
            });
          }
          function verifyGeometry(g,a,b,label){
            assert.equal(g.groups.length,a,label+' wrong number of groups');
            assert.equal(g.items.length,a*b,label+' wrong number of countable objects');
            assert(g.groupItemCounts.every(n=>n===b),label+' a group does not contain exactly '+b+' objects: '+g.groupItemCounts);
            assert(g.items.every(x=>x.visible&&x.width>3&&x.height>3&&!x.clipped&&x.insideVisibleArea),label+' hidden, clipped or outside the visible counting area');
            assert(g.groups.every(x=>x.width>20&&x.height>20),label+' collapsed group');
            assert(g.pageScrollWidth<=g.width+1,label+' horizontal page overflow '+g.pageScrollWidth+' > '+g.width);
            for(const item of g.items)for(const fox of g.foxes)assert.equal(intersect(item,fox),0,label+' selected fox covers a countable object');
          }
          async function setFactor(page,key,target){
            for(let guard=0;guard<15;guard++){
              const s=await page.evaluate(()=>window.LARIA_MULT_PREMIUM.snapshot()),now=Number(s[key]);
              if(now===target)return;
              const step=now<target?1:-1;
              await page.locator('[data-mp-action="factor"][data-factor="'+key+'"][data-step="'+step+'"]').click();
            }
            throw Error('Could not set '+key+' to '+target);
          }
          (async()=>{
            await new Promise(r=>server.listen(0,'127.0.0.1',r));
            const url='http://127.0.0.1:'+server.address().port+'/laer-litt-mer/?app=laria';
            const selectedName=process.env.ENGINE,selectedEngine=selectedName==='webkit'?webkit:chromium;
            for(const [engine,name] of [[selectedEngine,selectedName]]){
              const browser=await engine.launch({headless:name==='chromium',args:name==='chromium'?['--no-sandbox']:[]});
              try{
                for(const [width,height] of formats){
                  const label=name+'-'+width+'x'+height,entry={label,engine:name,width,height,checks:[],errors:[]};report.push(entry);
                  const context=await browser.newContext({viewport:{width,height},hasTouch:true,isMobile:width<600,reducedMotion:'reduce',serviceWorkers:'block'});
                  await context.addInitScript(s=>{localStorage.setItem('laerlittmer-v2',JSON.stringify(s));const tries={};for(const a of [5,10])for(let b=1;b<=9;b++)tries[a+'x'+b]={right:10,wrong:0,last:1};localStorage.setItem('laria_mult_premium_v1',JSON.stringify({tries,sessions:0,days:{},stars:0,draft:null}));let n=712;Math.random=()=>((n=Math.imul(1664525,n)+1013904223>>>0)/4294967296);},seed);
                  const page=await context.newPage();page.setDefaultTimeout(12000);page.on('pageerror',e=>entry.errors.push(String(e)));
                  await page.route(/https:\/\/(raw\.githubusercontent\.com|api\.worldbank\.org)\//,r=>r.abort());
                  try{
                    await page.goto(url,{waitUntil:'domcontentloaded'});await openLab(page);
                    // Use the real table chooser. Prior evidence makes ×10 the first
                    // generated question, so we inspect the densest 5×10 and 10×10
                    // practice scenes without replacing learning content.
                    for(const table of [5,10]){
                      await page.locator('.mp-home-screen .mp-menu-choose').click();
                      await page.locator('.mp-table-choice[data-table="'+table+'"]').first().click();
                      await page.locator('.mp-practice-screen .mp3-collections').waitFor();
                      const snap=await page.evaluate(()=>window.LARIA_MULT_PREMIUM.snapshot()),q=snap.round[snap.index];
                      assert.equal(q.a,table,label+' selected table changed');
                      assert.equal(q.b,10,label+' audit evidence did not surface the densest ×10 question first');
                      const pg=await geometry(page,'.mp-practice-screen .mp3-collections');
                      await page.screenshot({path:path.join(out,label+'-practice-'+q.a+'x'+q.b+'.png'),fullPage:true,animations:'disabled'});
                      verifyGeometry(pg,q.a,q.b,label+' practice '+q.a+'x'+q.b);
                      entry.checks.push({kind:'practice',a:q.a,b:q.b,objects:pg.items.length,groups:pg.groups.length,pageScrollWidth:pg.pageScrollWidth,visibleArea:pg.visibleArea,stage:pg.stage});
                      await page.locator('.mp-back').click();
                      await page.locator('.mp-home-screen').waitFor();
                    }
                    // Real explore route, maximum supported premium factors: 10 x 10 = 100 objects.
                    await page.locator('[data-mp-action="go"][data-page="explore"]').click();
                    await page.locator('[data-mp-action="mode"][data-mode="groups"]').click();
                    await setFactor(page,'a',10);await setFactor(page,'b',10);
                    const eg=await geometry(page,'.mp-explore-screen .mp3-collections');
                    await page.screenshot({path:path.join(out,label+'-groups-10x10.png'),fullPage:true,animations:'disabled'});
                    verifyGeometry(eg,10,10,label+' explore 10x10');
                    entry.checks.push({kind:'explore-groups',a:10,b:10,objects:eg.items.length,groups:eg.groups.length,pageScrollWidth:eg.pageScrollWidth,stageHeight:eg.stage.height});
                    // Active premium table is intentionally 10 x 10, not the dormant 12 x 12 legacy lab.
                    await page.locator('[data-mp-action="mode"][data-mode="table"]').click();
                    const cells=await page.locator('.mp-times-grid tbody .mp-grid-cell').count();
                    assert.equal(cells,100,label+' premium table is not 10x10');
                    const pageOverflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
                    assert(pageOverflow<=1,label+' table caused horizontal page overflow');
                    entry.checks.push({kind:'table',cells,pageOverflow});
                    assert.equal(entry.errors.length,0,label+' page errors: '+entry.errors.join(' | '));
                    entry.ok=true;
                  }catch(e){entry.ok=false;entry.failure=String(e);failed=true;}
                  fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));
                  await context.close();
                }
              }finally{await browser.close();}
            }
            server.closeAllConnections();server.close();
            console.log(JSON.stringify(report,null,2));if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          NODE_PATH="$PWD/node_modules" xvfb-run -a node /tmp/multiplication-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-multiplication-illustration-audit-${{ matrix.engine }}
          path: /tmp/laria-multiplication-audit/
          retention-days: 7
