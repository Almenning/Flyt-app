name: Laria sprint 2 windowed WebKit verification
on:
  push:
    branches: [qa/laria-premium-snapshot-20261015]
    paths: [.github/workflows/laria-sprint2-webkit-window.yml]
permissions:
  contents: read
jobs:
  webkit:
    strategy:
      fail-fast: false
      matrix:
        formats: ['320x568,390x844,430x932,844x390', '820x1180,1180x820', '1440x900']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad64daeb52f0ef61ad18d2cee23ea300dba5e182
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Select windowed engine only; retain every interaction assertion and deadline
        run: |
          mkdir -p /tmp/webkit-window
          git rev-parse HEAD > /tmp/webkit-window/REVISION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/laria-premium-retry-flow.playwright.js');s=p.read_text()
          assert s.count('headless:true')==1
          s=s.replace('headless:true','headless:false')
          p.write_text(s)
          PY
          git diff -- tests/laria-premium-retry-flow.playwright.js > /tmp/webkit-window/launch-mode-only.diff
          node --check tests/laria-premium-retry-flow.playwright.js
      - name: Four real grade-two journeys including full help text, correction and repeat
        env:
          LARIA_RETRY_ENGINE: webkit
          LARIA_RETRY_FORMATS: ${{ matrix.formats }}
          LARIA_RETRY_EVIDENCE: /tmp/webkit-window/grade2
        run: |
          mkdir -p /tmp/webkit-window/grade2
          set -o pipefail
          xvfb-run -a node tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/webkit-window/grade2/browser.log
      - name: Grade-one phone regression including existing number-order tasks
        if: always() && matrix.formats == '320x568,390x844,430x932,844x390'
        env:
          LARIA_RETRY_ENGINE: webkit
          LARIA_RETRY_FORMATS: 390x844
          LARIA_RETRY_GRADE: '1'
          LARIA_RETRY_EVIDENCE: /tmp/webkit-window/grade1
        run: |
          mkdir -p /tmp/webkit-window/grade1
          set -o pipefail
          xvfb-run -a node tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/webkit-window/grade1/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-sprint2-webkit-window-${{ matrix.formats }}
          path: /tmp/webkit-window/
          retention-days: 7
