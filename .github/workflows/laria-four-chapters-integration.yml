name: Laria Four Chapter Integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/chapter-expansion-*'
      - 'laer-litt-mer/math-pattern-haven-*'
      - 'laer-litt-mer/english-sentence-harbor-*'
      - 'laer-litt-mer/geography-continent-voyage-*'
      - 'tests/laria-four-chapters-integration.*'
      - '.github/workflows/laria-four-chapters-integration.yml'
permissions:
  contents: read
concurrency:
  group: laria-four-chapters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  all-subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate four independent chapter state machines
        run: |
          node --check tests/laria-four-chapters-integration.playwright.js
          node --test tests/laria-four-chapters-integration.test.cjs
      - name: Install desktop and iOS WebKit browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Serve the integrated exact branch
        run: |
          python3 -m http.server 8765 --directory . >/tmp/laria-four-chapters-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laria-four-chapters-server.log
          exit 1
      - name: Navigate all four subjects with one saved child
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_CHAPTER2_INTEGRATION_SCREENSHOTS: /tmp/laria-four-chapters
        run: node tests/laria-four-chapters-integration.playwright.js
      - name: Upload per-subject screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-four-chapters-${{ github.sha }}
          path: /tmp/laria-four-chapters
          retention-days: 7
          if-no-files-found: warn
