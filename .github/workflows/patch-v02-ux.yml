name: Patch Flyt v0.2 task UX
on:
  push:
    paths:
      - '.github/workflows/patch-v02-ux.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="{id:'dish',cat:'Kjøkken',name:'Tømme/fylle oppvaskmaskin',freq:7,pts:20,type:'daily',kind:'house'},{id:'kitchen'"
          new="{id:'dish_empty',cat:'Kjøkken',name:'Tømme oppvaskmaskin',freq:7,pts:20,type:'daily',kind:'house'},{id:'dish_fill',cat:'Kjøkken',name:'Fylle oppvaskmaskin',freq:7,pts:20,type:'daily',kind:'house'},{id:'kitchen'"
          if old not in s: raise SystemExit('dish pattern not found')
          s=s.replace(old,new,1)

          old="{id:'vacuum',cat:'Hus',name:'Støvsuge',freq:2,pts:50,type:'flex',kind:'house'},{id:'bed'"
          new="{id:'vacuum',cat:'Hus',name:'Støvsuge',freq:2,pts:50,type:'flex',kind:'house'},{id:'hallway',cat:'Hus',name:'Rydde gangen',freq:3,pts:25,type:'flex',kind:'house'},{id:'living',cat:'Hus',name:'Rydde stuen',freq:3,pts:25,type:'flex',kind:'house'},{id:'bed'"
          if old not in s: raise SystemExit('house pattern not found')
          s=s.replace(old,new,1)

          old="['dish','kitchen','dinner','lunch','bag','bath','bed','laundry','trash','train']"
          new="['dish_empty','dish_fill','kitchen','dinner','lunch','bag','bath','bed','laundry','trash','train']"
          if old not in s: raise SystemExit('default filter pattern not found')
          s=s.replace(old,new,1)

          old="let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}const save="
          new="""let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}
          if((state.version||2)<3){
            const oldDish=(state.tasks||[]).find(t=>t.id==='dish');
            if(oldDish){
              state.tasks=state.tasks.filter(t=>t.id!=='dish');
              state.tasks.push({...oldDish,id:'dish_empty',name:'Tømme oppvaskmaskin'});
              state.tasks.push({...oldDish,id:'dish_fill',name:'Fylle oppvaskmaskin'});
            }
            state.version=3;
            try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
          }
          const save="""
          if old not in s: raise SystemExit('state migration pattern not found')
          s=s.replace(old,new,1)

          old="<button id=\"customTask\" class=\"secondary full\" style=\"margin-top:14px\">+ Egendefinert oppgave</button>${state.custom.map(t=>templateRow(t)).join('')}`;bindSetupInputs()"
          new="${state.custom.map(t=>templateRow(t)).join('')}<button id=\"customTask\" class=\"secondary full\" style=\"margin:14px 0 26px\">+ Legg til en ny egendefinert oppgave</button>`;bindSetupInputs()"
          if old not in s: raise SystemExit('custom button pattern not found')
          s=s.replace(old,new,1)

          old="state.custom.push(x);state.tasks.push({...x,owner:'Begge'});save();renderSetup()}}"
          new="state.custom.push(x);state.tasks.push({...x,owner:'Begge'});save();renderSetup();setTimeout(()=>{const b=$('#setupBody');if(b)b.scrollTo({top:b.scrollHeight,behavior:'smooth'})},0)}}"
          if old not in s: raise SystemExit('custom add handler pattern not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Forbedre oppgaver og egendefinert oppgaveflyt"
          git push
