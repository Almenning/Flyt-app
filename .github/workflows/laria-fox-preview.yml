name: Laria selected living fox preview
on:
  push:
    branches: [feat/laria-fox-live-companion-20261011]
    paths:
      - 'laer-litt-mer/**'
      - 'tests/laria-live-fox-presence.playwright.js'
      - '.github/workflows/laria-fox-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laria-living-fox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Boot exact-head app without publishing
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/laria-fox-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laria-fox-server.log
          exit 1
      - name: Check one dressed fox on iPhone / iPad and record screenshot evidence
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_LIVE_FOX_QA: /tmp/laria-live-fox
        run: node tests/laria-live-fox-presence.playwright.js
      - name: Verify persistent wardrobe with new full-body fox and preserved portrait fallback
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_COLLECTION_QA: /tmp/laria-fox-collection-smoke
        run: node tests/laria-collection-persistence.playwright.js
      - name: Keep visual evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-fox-review-${{ github.sha }}
          path: /tmp/laria-live-fox
          if-no-files-found: warn
          retention-days: 7
