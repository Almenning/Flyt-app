name: Limit setup history
on:
  push:
    paths:
      - '.github/workflows/limit-setup-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limit setup history to five versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="state.setupHistory=state.setupHistory.slice(0,20)"
          new="state.setupHistory=state.setupHistory.slice(0,5)"
          if old not in s:
            raise SystemExit('setup history limit anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Begrens oppsettshistorikk til fem versjoner"
          git push
