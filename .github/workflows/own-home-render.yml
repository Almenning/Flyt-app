name: Own Home Render
on:
  push:
    paths:
      - '.github/workflows/own-home-render.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync and watchdog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sync.js')
          s=p.read_text()
          old="function restoreActiveModule(view){if(view==='us'&&window.FlytOss?.render){window.FlytOss.render({refresh:false});return}if(view==='tasks'&&window.FlytTasksUI?.render){window.FlytTasksUI.render()}}"
          new="function restoreActiveModule(view){if(view==='home'&&window.FlytHomeUI?.render){window.FlytHomeUI.render();return}if(view==='us'&&window.FlytOss?.render){window.FlytOss.render({refresh:false});return}if(view==='tasks'&&window.FlytTasksUI?.render){window.FlytTasksUI.render()}}"
          if old not in s: raise SystemExit('sync marker not found')
          p.write_text(s.replace(old,new,1))
          p=Path('app-watchdog.js')
          s=p.read_text()
          old="function restoreOwnedView(view){if(view==='tasks'&&window.FlytTasksUI?.render){queueMicrotask(()=>window.FlytTasksUI.render());return}if(view==='us'&&window.FlytOss?.render){queueMicrotask(()=>window.FlytOss.render({refresh:false}))}}"
          new="function restoreOwnedView(view){if(view==='home'&&window.FlytHomeUI?.render){queueMicrotask(()=>window.FlytHomeUI.render());return}if(view==='tasks'&&window.FlytTasksUI?.render){queueMicrotask(()=>window.FlytTasksUI.render());return}if(view==='us'&&window.FlytOss?.render){queueMicrotask(()=>window.FlytOss.render({refresh:false}))}}"
          if old not in s: raise SystemExit('watchdog marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync.js app-watchdog.js
          git commit -m "Hold Dag og Uke stabilt på Hjem"
          git push
