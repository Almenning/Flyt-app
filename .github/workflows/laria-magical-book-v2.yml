name: Laria Magical Collection V2
on:
  pull_request:
    paths:
      - 'laer-litt-mer/laria-magical-collection-v2.*'
      - 'laer-litt-mer/laria-collection-book-ornaments-approved.webp'
      - 'laer-litt-mer/home-basecamp-v12.js'
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/multiplication-gangemagi-v1.js'
      - 'tests/laria-magical-book-v2.*'
      - '.github/workflows/laria-magical-book-v2.yml'
  push:
    branches: [main]
    paths:
      - 'laer-litt-mer/laria-magical-collection-v2.*'
      - 'laer-litt-mer/laria-collection-book-ornaments-approved.webp'
      - 'laer-litt-mer/home-basecamp-v12.js'
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/multiplication-gangemagi-v1.js'
      - 'tests/laria-magical-book-v2.*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collection-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify local original art and contracts
        run: |
          test -s laer-litt-mer/laria-collection-book-ornaments-approved.webp
          node --check laer-litt-mer/laria-magical-collection-v2.js
          node --check laer-litt-mer/home-basecamp-v12.js
          node --check tests/laria-magical-book-v2.playwright.js
          node --test tests/laria-magical-book-v2.test.cjs tests/laria-collection-core.test.cjs
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify six devices and collect real screenshots
        env:
          QA_SCREENSHOTS: /tmp/laria-magical-book-v2-evidence
        run: node tests/laria-magical-book-v2.playwright.js
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-magical-book-v2-${{ github.sha }}
          path: /tmp/laria-magical-book-v2-evidence
          retention-days: 14
          if-no-files-found: warn