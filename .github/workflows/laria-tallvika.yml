name: Læria Tallvika – WebKit og Chromium

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/tallvika.*'
      - 'laer-litt-mer/assets/tallvika/**'
      - 'laer-litt-mer/assets/gangemagi-troll/**'
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/sw.js'
      - 'tests/laria-tallvika*'
      - '.github/workflows/laria-tallvika.yml'
  push:
    branches: [main]
    paths:
      - 'laer-litt-mer/tallvika.*'
      - 'laer-litt-mer/assets/tallvika/**'
      - 'laer-litt-mer/assets/gangemagi-troll/**'
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/sw.js'
      - 'tests/laria-tallvika*'
      - '.github/workflows/laria-tallvika.yml'

permissions:
  contents: read

jobs:
  tallvika:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      # Test the precise PR head, never GitHub's synthetic merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Verify Tallvika data contract
        run: node tests/laria-tallvika-contract.test.cjs
      - name: Start exact-head server
        run: python3 -m http.server 8765 --directory . >/tmp/tallvika-http.log 2>&1 &
      - name: Capture iPhone and iPad in Chromium and WebKit
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_TALLVIKA_SCREENSHOTS: /tmp/laria-tallvika
        run: node tests/laria-tallvika.playwright.js
      - name: Capture NEW two-post sign navigation on desktop, iPad and iPhone
        # Even if old regressions fail, inspect new sign evidence independently.
        if: always()
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LARIA_TALLVIKA_PREMIUM_SCREENSHOTS: /tmp/laria-tallvika-premium
        run: |
          node --check tests/laria-tallvika-premium-signs.playwright.js
          node tests/laria-tallvika-premium-signs.playwright.js
      - name: Upload PR-head premium sign screenshots and gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-tallvika-premium-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/laria-tallvika-premium
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exact repo source image for visual integrity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-tallvika-original-art-${{ github.sha }}
          path: laer-litt-mer/assets/tallvika/laria-tallvika-premium-locked-20261027.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-tallvika-${{ github.sha }}
          path: /tmp/laria-tallvika
          if-no-files-found: warn
          retention-days: 14

  pages-live:
    name: Verify published Tallvika source (not only local browser tests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tallvika
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub Pages serves the exact merged HTML, JS, CSS and locked image
        shell: bash
        run: |
          set -euo pipefail
          base="https://almenning.github.io/Flyt-app/laer-litt-mer"
          download() {
            curl --fail --silent --show-error --location --max-time 25 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "$1" --output "$2"
          }
          for attempt in $(seq 1 48); do
            if download "$base/?app=laria&revision=$GITHUB_SHA" /tmp/laria-live.html &&
               download "$base/tallvika.js?revision=$GITHUB_SHA" /tmp/laria-live-tallvika.js &&
               download "$base/tallvika.css?revision=$GITHUB_SHA" /tmp/laria-live-tallvika.css &&
               download "$base/sw.js?revision=$GITHUB_SHA" /tmp/laria-live-sw.js &&
               download "$base/assets/tallvika/laria-tallvika-premium-locked-20261027.png?revision=$GITHUB_SHA" /tmp/laria-live-art.png &&
               cmp -s /tmp/laria-live.html laer-litt-mer/index.html &&
               cmp -s /tmp/laria-live-tallvika.js laer-litt-mer/tallvika.js &&
               cmp -s /tmp/laria-live-tallvika.css laer-litt-mer/tallvika.css &&
               cmp -s /tmp/laria-live-sw.js laer-litt-mer/sw.js &&
               cmp -s /tmp/laria-live-art.png laer-litt-mer/assets/tallvika/laria-tallvika-premium-locked-20261027.png; then
              if grep -Eq 'tv-dock|tv-mobile-actions|tv-portal-card' /tmp/laria-live-tallvika.js; then
                echo 'FAIL: obsolete parallel Tallvika navigation is still in published JS.' >&2
                exit 1
              fi
              echo "PASS: Pages serves exact merged HTML, JS, CSS, service worker and approved Tallvika art for $GITHUB_SHA."
              sha256sum /tmp/laria-live-art.png
              exit 0
            fi
            echo "Pages content not yet equal to main; attempt $attempt/48"
            sleep 10
          done
          echo 'FAIL: GitHub Pages remains out of sync with merged Tallvika.' >&2
          exit 1
