name: Bust Oss cache 1318
on:
  push:
    paths:
      - '.github/workflows/bust-oss-cache-1318.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust Oss cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./oss.js?v=20260824-1214'
          new='./oss.js?v=20260824-1318'
          if old not in s:
              raise SystemExit('oss cache anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bust cache for Ja Nei dialog"
          git push
