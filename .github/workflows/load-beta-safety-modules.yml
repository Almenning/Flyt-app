name: Load beta safety modules
on:
  push:
    paths:
      - '.github/workflows/load-beta-safety-modules.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add script tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="./sync.js" defer></script>'
          if marker not in s: raise SystemExit('sync script marker missing')
          add='''<script src="./sync.js" defer></script>\n<script src="./oss.js" defer></script>\n<script src="./app-watchdog.js" defer></script>'''
          if '<script src="./oss.js" defer></script>' not in s:
              s=s.replace(marker,add,1)
          elif '<script src="./app-watchdog.js" defer></script>' not in s:
              s=s.replace('<script src="./oss.js" defer></script>','<script src="./oss.js" defer></script>\n<script src="./app-watchdog.js" defer></script>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Last inn Oss og oppstartsvakt i beta"
          git push
