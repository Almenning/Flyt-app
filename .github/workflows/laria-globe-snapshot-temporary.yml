name: Temporary Laria globe source snapshot
on:
  push:
    branches: [fix/globe-geography-alignment-v32]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Package local visual QA sources
        run: tar -czf /tmp/laria-globe-debug-src.tar.gz laer-litt-mer laer/data
      - name: Upload local visual QA sources
        uses: actions/upload-artifact@v4
        with:
          name: laria-globe-source-${{ github.sha }}
          path: /tmp/laria-globe-debug-src.tar.gz
          if-no-files-found: error
          retention-days: 1
