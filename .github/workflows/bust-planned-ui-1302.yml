name: Bust planned UI cache 1302
on:
  push:
    paths:
      - '.github/workflows/bust-planned-ui-1302.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./planned-ui.js?v=20260824-1232'
          new='./planned-ui.js?v=20260824-1302'
          if old not in s:
              raise SystemExit('cache anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bust cache for ny Sett-visning"
          git push
