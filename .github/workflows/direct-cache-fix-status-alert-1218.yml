name: Direct cache fix status alert 1218
on:
  push:
    paths:
      - '.github/workflows/direct-cache-fix-status-alert-1218.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('planned-ui.js')
          s=p.read_text()
          if './seen-ui.js?v=20260824-1114' not in s: raise SystemExit('seen ref missing')
          p.write_text(s.replace('./seen-ui.js?v=20260824-1114','./seen-ui.js?v=20260824-1212',1))
          p=Path('index.html')
          s=p.read_text()
          if './oss.js?v=20260824-0802' not in s: raise SystemExit('oss ref missing')
          if './planned-ui.js?v=20260824-1124' not in s: raise SystemExit('planned ref missing')
          s=s.replace('./oss.js?v=20260824-0802','./oss.js?v=20260824-1214',1)
          s=s.replace('./planned-ui.js?v=20260824-1124','./planned-ui.js?v=20260824-1218',1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planned-ui.js index.html
          git commit -m "Aktiver dagsformvarsler i klienten"
          git push