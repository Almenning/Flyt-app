name: Add Flyt pair sync UI
on:
  push:
    paths:
      - '.github/workflows/add-sync-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old='<link rel="manifest" href="./manifest.webmanifest">\n<title>Flyt for to</title>'
          new='<link rel="manifest" href="./manifest.webmanifest">\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script src="./sync.js" defer></script>\n<title>Flyt for to</title>'
          if old not in s: raise SystemExit('head marker missing')
          s=s.replace(old,new,1)

          old='.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3d2925ee;color:#fff;padding:12px 14px;border-radius:13px;width:min(390px,calc(100% - 28px));z-index:80}.section'
          new='.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3d2925ee;color:#fff;padding:12px 14px;border-radius:13px;width:min(390px,calc(100% - 28px));z-index:80}.syncModal{position:fixed;inset:0;z-index:85;background:#3a211b77;display:flex;align-items:flex-end;justify-content:center}.syncSheet{width:100%;max-height:88dvh;overflow:auto;padding:18px 15px max(18px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:#fff7f1;box-shadow:0 -20px 60px #4d291f33}@media(min-width:700px){.syncModal{align-items:center}.syncSheet{width:400px;border-radius:26px;max-height:800px}}.section'
          if old not in s: raise SystemExit('css marker missing')
          s=s.replace(old,new,1)

          old='<div class="app"><header class="top"><button id="switchUser" class="pill">Tore + Jannicke ▾</button><div style="display:flex;gap:7px"><button id="setupBtn" class="pill">Oppsett</button><button id="lock" class="pill">Lås</button></div></header>'
          new='<div class="app"><header class="top"><button id="switchUser" class="pill">Tore + Jannicke ▾</button><div style="display:flex;gap:7px"><button id="syncBtn" class="pill">Koble</button><button id="setupBtn" class="pill">Oppsett</button><button id="lock" class="pill">Lås</button></div></header>'
          if old not in s: raise SystemExit('header marker missing')
          s=s.replace(old,new,1)

          old="function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}"
          new="function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}if(window.FlytSync)window.FlytSync.queueSave()}"
          if old not in s: raise SystemExit('save marker missing')
          s=s.replace(old,new,1)

          old="render();\n})();"
          new="window.FlytBridge={getState:()=>state,setState:(next)=>{state=next;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()},toast};\nrender();\n})();"
          if old not in s: raise SystemExit('bridge marker missing')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Koble Flyt til Supabase par-synk"
          git push
