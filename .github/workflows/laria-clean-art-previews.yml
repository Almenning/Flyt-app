name: "Læria clean-art candidates - review only"
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/laria_art/**"
      - "tools/laria_release/verify_clean_candidate.py"
      - ".github/workflows/laria-clean-art-previews.yml"
      - "docs/LARIA-CLEAN-ART-REVIEW-2026-11-08.md"
permissions:
  contents: read
concurrency:
  group: laria-art-preview-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  art-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image comparison dependencies
        run: python -m pip install "Pillow>=11,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Validate source and pixel-guarded generator
        run: |
          python -m py_compile tools/laria_art/prepare_clean_art_previews.py
          python tools/laria_art/prepare_clean_art_previews.py --self-test
          python -m py_compile tools/laria_release/verify_clean_candidate.py
          python tools/laria_release/verify_clean_candidate.py --self-test
      - name: Generate non-approved previews from exact locked original files
        run: python tools/laria_art/prepare_clean_art_previews.py --output-dir /tmp/laria-art-preview
      - name: Include byte-identical source art for controlled retouch review
        run: |
          mkdir -p /tmp/laria-art-preview/locked-source
          cp laer-litt-mer/assets/home-v15/kjosnes-home-tablet.webp /tmp/laria-art-preview/locked-source/GROVANOVA-original-locked.webp
          cp laer-litt-mer/assets/kinnaklova/kinnaklova-scene-clean-approved-20261026.webp /tmp/laria-art-preview/locked-source/KINNAKLOVA-original-locked.webp
          sha256sum /tmp/laria-art-preview/locked-source/*.webp > /tmp/laria-art-preview/locked-source/SOURCE-SHA256.txt
          echo "REVIEW ONLY: these are unchanged historical originals; not UI-free premium art." > /tmp/laria-art-preview/locked-source/READ-ME.txt
      - name: Collect locked Nordlysleiren source candidates (read-only resolution review)
        run: |
          mkdir -p /tmp/laria-art-preview/geography-source
          cp laer-litt-mer/locked-journeys/nordlysleiren-locked-20261010.png /tmp/laria-art-preview/geography-source/
          cp laer-litt-mer/locked-journeys/nordlysleiren-fox-free-20261011.webp /tmp/laria-art-preview/geography-source/
          cp laer-litt-mer/assets/cards/reisen/geography-premium.webp /tmp/laria-art-preview/geography-source/current-geography-premium.webp
          cp laer-litt-mer/globe-storyscape-v36-landscape.webp /tmp/laria-art-preview/geography-source/
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import pathlib,json,hashlib
          root=pathlib.Path('/tmp/laria-art-preview/geography-source')
          files=sorted([p for p in root.iterdir() if p.suffix.lower() in ('.png','.webp')])
          data=[];cards=[];tile_w=680;tile_h=430
          for p in files:
           im=Image.open(p).convert('RGB')
           data.append(dict(file=p.name,width=im.width,height=im.height,bytes=p.stat().st_size,
               sha256=hashlib.sha256(p.read_bytes()).hexdigest()))
           fitted=ImageOps.contain(im,(tile_w-20,tile_h-74))
           tile=Image.new('RGB',(tile_w,tile_h),'#172b3a')
           tile.paste(fitted,((tile_w-fitted.width)//2,8))
           d=ImageDraw.Draw(tile)
           d.text((14,tile_h-59),p.name,fill='white')
           d.text((14,tile_h-36),f'{im.width} x {im.height} | {p.stat().st_size//1024} KiB',fill='#c8e9ed')
           cards.append(tile)
          sheet=Image.new('RGB',(tile_w*2,tile_h*2),'#172b3a')
          for i,t in enumerate(cards):sheet.paste(t,((i%2)*tile_w,(i//2)*tile_h))
          sheet.save(root/'geography-source-review-NOT-APPROVED.png',optimize=True)
          (root/'SOURCE-INVENTORY.json').write_text(json.dumps({'release_approved':False,'source_integrity':'read-only','candidates':data},indent=2))
          PY
      - name: Upload image candidates and pixel-integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-art-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/laria-art-preview
          retention-days: 14
          if-no-files-found: error
