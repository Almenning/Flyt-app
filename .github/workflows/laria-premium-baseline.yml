name: Laria premium baseline
on:
  push:
    branches: [qa/laria-premium-snapshot-20261015]
    paths: [.github/workflows/laria-premium-baseline.yml, tests/laria-premium-observe.playwright.js]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/laria-premium-observe.playwright.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-premium-baseline
          path: /tmp/laria-observe/
          retention-days: 7
