name: Add setup history
on:
  push:
    paths:
      - '.github/workflows/add-setup-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add setup history bank
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          s=s.replace("status:{Tore:{energy:'med',capacity:'med',closeness:'med',desire:'med',stress:'med',needs:[]},Jannicke:{energy:'med',capacity:'med',closeness:'med',desire:'med',stress:'med',needs:[]}},work:[]","status:{Tore:{energy:'med',capacity:'med',closeness:'med',desire:'med',stress:'med',needs:[]},Jannicke:{energy:'med',capacity:'med',closeness:'med',desire:'med',stress:'med',needs:[]}},setupHistory:[],work:[]",1)

          anchor="function closeSetup(){state.setupDone=true;save();$('#setup').classList.add('hidden');render()}"
          repl="""function setupSnapshot(label){return{id:Date.now()+'_'+Math.random().toString(36).slice(2,7),savedAt:new Date().toISOString(),label:label||'Lagret oppsett',tasks:JSON.parse(JSON.stringify(state.tasks||[])),custom:JSON.parse(JSON.stringify(state.custom||[])),areas:JSON.parse(JSON.stringify(state.areas||{})),trainingFor:JSON.parse(JSON.stringify(state.trainingFor||{}))}}
function setupSignature(x){return JSON.stringify({tasks:x.tasks||[],custom:x.custom||[],areas:x.areas||{},trainingFor:x.trainingFor||{}})}
function archiveSetup(label){state.setupHistory=Array.isArray(state.setupHistory)?state.setupHistory:[];const snap=setupSnapshot(label);const last=state.setupHistory[0];if(last&&setupSignature(last)===setupSignature(snap))return;state.setupHistory.unshift(snap);state.setupHistory=state.setupHistory.slice(0,20)}
function restoreSetupSnapshot(id){const snap=(state.setupHistory||[]).find(x=>x.id===id);if(!snap)return;archiveSetup('Før gjenoppretting');state.tasks=JSON.parse(JSON.stringify(snap.tasks||[]));state.custom=JSON.parse(JSON.stringify(snap.custom||[]));state.areas=JSON.parse(JSON.stringify(snap.areas||state.areas||{}));state.trainingFor=JSON.parse(JSON.stringify(snap.trainingFor||state.trainingFor||{}));setupExpanded={};save();renderSetup();toast('Tidligere oppsett er gjenopprettet')}
function setupHistoryHtml(){const hist=Array.isArray(state.setupHistory)?state.setupHistory:[];if(!hist.length)return '<p class=\"sub\">Ingen tidligere oppsett lagret ennå.</p>';return hist.map(x=>{const d=new Date(x.savedAt),when=isNaN(d)?'Ukjent tidspunkt':d.toLocaleString('nb-NO',{dateStyle:'short',timeStyle:'short'}),count=(x.tasks||[]).length;return `<div class=\"card row\"><div class=\"grow\"><strong>${x.label||'Lagret oppsett'}</strong><div class=\"taskmeta\">${when} · ${count} gjøremål</div></div><button type=\"button\" class=\"small\" data-restore-setup=\"${x.id}\">Gjenopprett</button></div>`}).join('')}
function closeSetup(){archiveSetup('Lagret oppsett');state.setupDone=true;save();$('#setup').classList.add('hidden');render()}"""
          if anchor not in s:
            raise SystemExit('closeSetup anchor not found')
          s=s.replace(anchor,repl,1)

          old="""<div class=\"section\"><div class=\"card\"><strong>Tilbakestill gjøremål</strong><p class=\"sub\">Setter oppgavelisten tilbake til standardforslaget. Historikk, poeng og gjennomføringer beholdes.</p><button type=\"button\" id=\"resetTasks\" class=\"secondary full\">Tilbakestill gjøremål</button></div></div>`;bindSetup()}"""
          new="""<div class=\"section\"><strong>Oppsettshistorikk</strong><p class=\"sub\">Tidligere oppsett kan gjenopprettes uten å slette poeng, statistikk eller gjennomførte gjøremål.</p>${setupHistoryHtml()}</div><div class=\"section\"><div class=\"card\"><strong>Tilbakestill gjøremål</strong><p class=\"sub\">Setter oppgavelisten tilbake til standardforslaget. Historikk, poeng, statistikk og gjennomføringer beholdes.</p><button type=\"button\" id=\"resetTasks\" class=\"secondary full\">Tilbakestill gjøremål</button></div></div>`;bindSetup()}"""
          if old not in s:
            raise SystemExit('reset section anchor not found')
          s=s.replace(old,new,1)

          old_reset="""const reset=$('#resetTasks');if(reset)reset.onclick=()=>{if(!confirm('Tilbakestille gjøremål til standardoppsettet? Historikk og poeng beholdes.'))return;const ids=['dish_empty','dish_fill','kitchen','dinner','lunch','bag','bath','bed','laundry','trash','train'];state.tasks=LIB.filter(x=>ids.includes(x.id)).map(x=>({...x,owner:'Begge'}));state.custom=[];setupExpanded={};save();renderSetup();toast('Gjøremål er tilbakestilt')};"""
          new_reset="""document.querySelectorAll('[data-restore-setup]').forEach(el=>el.onclick=()=>{if(confirm('Gjenopprette dette oppsettet? Poeng, statistikk og gjennomføringer beholdes.'))restoreSetupSnapshot(el.dataset.restoreSetup)});const reset=$('#resetTasks');if(reset)reset.onclick=()=>{if(!confirm('Tilbakestille gjøremål til standardoppsettet? Poeng, statistikk og gjennomføringer beholdes.'))return;archiveSetup('Før tilbakestilling');const ids=['dish_empty','dish_fill','kitchen','dinner','lunch','bag','bath','bed','laundry','trash','train'];state.tasks=LIB.filter(x=>ids.includes(x.id)).map(x=>({...x,owner:'Begge'}));state.custom=[];setupExpanded={};save();renderSetup();toast('Gjøremål er tilbakestilt')};"""
          if old_reset not in s:
            raise SystemExit('reset handler anchor not found')
          s=s.replace(old_reset,new_reset,1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Legg til oppsettshistorikk som bevarer statistikk"
          git push
