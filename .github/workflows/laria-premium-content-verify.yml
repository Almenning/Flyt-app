name: Laria faithful task content verification
on:
  push:
    branches: [qa/laria-premium-snapshot-20261015]
    paths: [.github/workflows/laria-premium-content-verify.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/laria-premium-retry-flow-20261015
      - run: test "$(git rev-parse HEAD)" = ad64daeb52f0ef61ad18d2cee23ea300dba5e182
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture the existing spelling task and completion before changes
        env:
          LARIA_RETRY_ENGINE: chromium
          LARIA_RETRY_FORMATS: 390x844,1180x820
          LARIA_RETRY_SUBJECTS: norwegian
          LARIA_RETRY_EVIDENCE: /tmp/content-before
        run: |
          mkdir -p /tmp/content-before
          git rev-parse HEAD > /tmp/content-before/REVISION.txt
          node tests/laria-premium-retry-flow.playwright.js
      - name: Apply exact locally verified patch without touching main or D2
        id: apply
        env:
          PATCH: 
        run: |
          python3 - <<'PY'
          import os,base64,zlib,hashlib,pathlib
          patch=zlib.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(patch).hexdigest()=='d988f49f169812d0d1a1f814a30fe9e826db06dc1bae65f5e3ea231add775a54'
          pathlib.Path('/tmp/faithful-content.patch').write_bytes(patch)
          PY
          git apply --check /tmp/faithful-content.patch
          git apply /tmp/faithful-content.patch
          npm run test:node > /tmp/content-before/node-tests-after.log
          node --check laer-litt-mer/laria-task-scene-v15.js
          node --check tests/laria-premium-retry-flow.playwright.js
          git add laer-litt-mer/index.html laer-litt-mer/laria-task-scene-v15.js laer-litt-mer/sw.js tests/laria-premium-content-integrity.test.cjs tests/laria-premium-retry-flow.playwright.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(laria): match plural artwork and completion messages to the actual round'
          git push origin HEAD:refs/heads/fix/laria-premium-retry-flow-20261015
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/content-before/AFTER_REVISION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-faithful-content-before
          path: /tmp/content-before/
          retention-days: 7
  browser:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify unchanged real journeys and the changed content in both engines
        env:
          LARIA_RETRY_ENGINE: ${{ matrix.engine }}
          LARIA_RETRY_FORMATS: 320x568,390x844,1180x820
          LARIA_RETRY_EVIDENCE: /tmp/content-after
        run: |
          set -o pipefail
          mkdir -p /tmp/content-after
          git rev-parse HEAD > /tmp/content-after/REVISION.txt
          if [ "$LARIA_RETRY_ENGINE" = webkit ]; then
            printf '%s\n' "const {webkit}=require('./node_modules/playwright');const launch=webkit.launch.bind(webkit);webkit.launch=o=>launch({...o,headless:false});" > .content-browser-mode.cjs
            xvfb-run -a node -r ./.content-browser-mode.cjs tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/content-after/browser.log
          else
            node tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/content-after/browser.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-faithful-content-${{ matrix.engine }}
          path: /tmp/content-after/
          retention-days: 7
