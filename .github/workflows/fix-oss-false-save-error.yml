name: Fix Oss false save error
on:
  push:
    paths:
      - '.github/workflows/fix-oss-false-save-error.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separate save success from refresh failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('oss.js')
          s=p.read_text()
          old="async function save(a){const {error}=await sb.rpc('save_my_status',{p_energy:a.energy,p_capacity:a.capacity,p_closeness:a.closeness,p_desire:a.desire,p_stress:a.stress,p_needs:a.needs||[]});if(error)throw error;await refreshContext();paint({resetScroll:false})}"
          new="async function save(a){const {error}=await sb.rpc('save_my_status',{p_energy:a.energy,p_capacity:a.capacity,p_closeness:a.closeness,p_desire:a.desire,p_stress:a.stress,p_needs:a.needs||[]});if(error)throw error;try{await refreshContext();paint({resetScroll:false})}catch(e){console.warn('Flyt Oss refresh after save failed; keeping optimistic value',e);paint({resetScroll:false})}}"
          if old not in s:
            raise SystemExit('save function anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('index.html')
          s=p.read_text()
          import re
          s,n=re.subn(r'\./oss\.js\?v=[^"\']+','./oss.js?v=20260824-0802',s,count=1)
          if n!=1:
            raise SystemExit('oss cache ref not found')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oss.js index.html
          git commit -m "Fjern falsk lagringsfeil i Oss"
          git push
