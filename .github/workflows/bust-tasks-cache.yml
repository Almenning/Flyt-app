name: Bust Tasks cache
on:
  push:
    paths:
      - '.github/workflows/bust-tasks-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Tasks script version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./tasks-ui.js?v=20260823-1948','./tasks-ui.js?v=20260823-2013',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tving fersk Gjøre-modul på mobil"
          git push
