name: Læria exact-commit external preview smoke
on:
  push:
    branches: [test/laria-github-commit-preview-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Playwright client
        run: npm ci
      - name: Verify third-party static preview serves exact commit sources
        env:
          PREVIEW_URL: https://raw.githack.com/Almenning/Flyt-app/047d7490cf306a61c635cd73c9c629ce010a9214/laer-litt-mer/index.html?app=laria
        run: |
          set -euo pipefail
          mkdir -p /tmp/laria-exact-preview
          curl --max-time 35 --retry 2 --retry-delay 2 -fLsS -D /tmp/laria-exact-preview/headers.txt "$PREVIEW_URL" -o /tmp/laria-exact-preview/index.html
          grep -q '<title>Læria</title>' /tmp/laria-exact-preview/index.html
          grep -qi 'text/html' /tmp/laria-exact-preview/headers.txt
          curl --max-time 35 --retry 2 --retry-delay 2 -fLsS "https://raw.githack.com/Almenning/Flyt-app/047d7490cf306a61c635cd73c9c629ce010a9214/laer-litt-mer/laria-task-scene-v15.css" -o /tmp/laria-exact-preview/task-scene.css
          grep -q 'task-scene' /tmp/laria-exact-preview/task-scene.css
          echo "PASS exact-commit HTML and CSS are served by preview proxy"
      - name: Check interactive Læria in Chromium and WebKit
        env:
          PREVIEW_URL: https://raw.githack.com/Almenning/Flyt-app/047d7490cf306a61c635cd73c9c629ce010a9214/laer-litt-mer/index.html?app=laria
        run: |
          node - <<'NODE'
          const {chromium,webkit}=require('playwright');
          const fs=require('node:fs');
          const url=process.env.PREVIEW_URL;
          (async()=>{
            for(const [name,type] of [['chromium',chromium],['webkit',webkit]]){
              const browser=await type.launch({headless:true,args:name==='chromium'?['--no-sandbox']:[]});
              try{
                for(const [size,viewport] of [['portrait',{width:820,height:1180}],['landscape',{width:1180,height:820}]]){
                  const ctx=await browser.newContext({viewport,serviceWorkers:'block',hasTouch:true,reducedMotion:'reduce'});
                  const page=await ctx.newPage();const errors=[];
                  page.on('pageerror',x=>errors.push(x.message));
                  await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                  await page.locator('title').waitFor({state:'attached',timeout:25000});
                  const title=await page.title();
                  if(title!=='Læria') throw new Error(name+' '+size+' wrong page title: '+title);
                  await page.waitForFunction(()=>Boolean(document.querySelector('#home-screen.active'))||
                    Boolean(document.querySelector('.bc15-locked-home')),null,{timeout:25000});
                  const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src).slice(0,10));
                  const body=await page.locator('body').innerText();
                  if(!body.length) throw new Error(name+' '+size+' empty app page');
                  await page.screenshot({path:'/tmp/laria-exact-preview/'+name+'-'+size+'.png',animations:'disabled'});
                  fs.appendFileSync('/tmp/laria-exact-preview/results.txt',JSON.stringify({name,size,title,bodyLength:body.length,broken,errors})+'\n');
                  if(errors.length) throw new Error(name+' '+size+' script errors: '+JSON.stringify(errors));
                  await ctx.close();
                }
              }finally{await browser.close()}
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Save third-party preview verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-exact-commit-web-preview
          path: /tmp/laria-exact-preview
          retention-days: 7
          if-no-files-found: warn
