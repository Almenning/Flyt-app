name: Reload Oss safely
on:
  push:
    paths:
      - '.github/workflows/reload-oss-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore safe module loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="./sync.js" defer></script>'
          if marker not in s:
              raise SystemExit('sync marker not found')
          add=marker+'\n<script src="./oss.js" defer></script>\n<script src="./app-watchdog.js" defer></script>'
          if '<script src="./oss.js" defer></script>' not in s:
              s=s.replace(marker,add,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Last inn Oss-modulen og oppstartsvakten igjen"
          git push
