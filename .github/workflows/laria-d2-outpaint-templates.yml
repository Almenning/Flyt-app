name: Laria D2 pixel-exact outpainting templates

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/laria_d2_outpaint.py'
      - 'tests/test_laria_d2_outpaint.py'
      - 'laer-litt-mer/locked-journeys/*-locked-20261010.png'
      - '.github/workflows/laria-d2-outpaint-templates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-outpaint-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Python 3.12 for lossless image checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for OFFLINE image processing
        run: python -m pip install 'Pillow>=10,<12'
      - name: Verify candidate checks reject altered originals and bad image inputs
        run: python -m unittest discover -s tests -p 'test_laria_d2_outpaint.py' -v
      - name: Generate masks from the actual locked October 10 PNG paintings
        run: python scripts/laria_d2_outpaint.py templates --output /tmp/laria-d2-exact-templates
      - name: Verify all original image anchors and masks
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import importlib.util
          s=importlib.util.spec_from_file_location('d2','scripts/laria_d2_outpaint.py')
          module=importlib.util.module_from_spec(s);s.loader.exec_module(module)
          base=Path('/tmp/laria-d2-exact-templates')
          for subject,name in module.SUBJECTS.items():
              original=module.original_image(module.ROOT,subject)
              context=Image.open(base/(name+'-outpaint-exact.png')).convert('RGBA')
              assert context.size==(941,725)
              assert ImageChops.difference(context.convert('RGB').crop((0,0,941,300)),
                  original.crop((0,1372,941,1672))).getbbox() is None
              mask=Image.open(base/(name+'-paint-mask-white.png'))
              assert mask.size==(941,725)
              assert mask.getpixel((470,100))==0 and mask.getpixel((470,500))==255
              anchor=Image.open(base/(name+'-43px-exact-anchor.png')).convert('RGBA')
              assert anchor.size==(941,468)
              assert ImageChops.difference(anchor.convert('RGB').crop((0,0,941,43)),
                  original.crop((0,1629,941,1672))).getbbox() is None
              assert anchor.getpixel((470,100))[3]==0
              print('PASS '+subject+' 300px source unchanged; 43px seam original; 425px paint area')
          PY
      - name: Upload four exact PNG source contexts and masks
        uses: actions/upload-artifact@v4
        with:
          name: laria-d2-pixel-exact-paint-masters-${{ github.sha }}
          path: /tmp/laria-d2-exact-templates
          if-no-files-found: error
          retention-days: 14
