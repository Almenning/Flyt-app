name: "Læria Home v15 - locked Grovanova art and safe-area QA"
on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/home-kjosnes-v15.js'
      - 'laer-litt-mer/home-kjosnes-v15.css'
      - 'laer-litt-mer/assets/home-v15/**'
      - 'laer-litt-mer/assets/home-v16/**'
      - 'laer-litt-mer/laria-grovanova-v16.js'
      - 'laer-litt-mer/laria-grovanova-v16.css'
      - 'tests/laria-grovanova-v16.playwright.js'
      - 'tests/laria-grovanova-v16-approved.test.cjs'
      - 'tests/laria-home-kjosnes-v15.playwright.js'
      - '.github/workflows/laria-home-v15-locked-art.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laria-home-v15-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-art-and-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Verify Home renderer and test syntax
        run: |
          node --check laer-litt-mer/home-kjosnes-v15.js
          node --check laer-litt-mer/laria-grovanova-v16.js
          node --check tests/laria-home-kjosnes-v15.playwright.js
          node --check tests/laria-grovanova-v16.playwright.js
          node --test tests/laria-grovanova-v16-approved.test.cjs
      - name: Serve exact PR version
        run: python3 -m http.server 8765 --directory . > /tmp/laria-home-http.log 2>&1 &
      - name: Verify locked artwork, living greeting bubble, navigation and saved child progress
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          HOME_V15_SCREENSHOTS: /tmp/laria-home-v15
        run: node tests/laria-home-kjosnes-v15.playwright.js
      - name: Review owner-approved Grovanova v16 in REAL Chromium and WebKit
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          HOME_V15_SCREENSHOTS: /tmp/laria-home-v15
        run: node tests/laria-grovanova-v16.playwright.js
      - name: Emit review-sized iPad screenshots for PR 250
        if: ${{ github.event.pull_request.number == 250 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, glob, os
          for filename in sorted(glob.glob('/tmp/laria-home-v15/*-home-review.jpg')):
              if not any(tag in filename for tag in ('ipad', 'iphone')):
                  continue
              with open(filename, 'rb') as raw:
                  encoded=base64.b64encode(raw.read()).decode('ascii')
              name=os.path.basename(filename)
              print('LARIA_SHOT_BEGIN '+name,flush=True)
              for n in range(0,len(encoded),3000):
                  print('LARIA_SHOT_DATA '+encoded[n:n+3000],flush=True)
              print('LARIA_SHOT_END '+name,flush=True)
          PY
      - name: Upload actual iPad and iPhone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-home-v15-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/laria-home-v15
          retention-days: 14
          if-no-files-found: warn
