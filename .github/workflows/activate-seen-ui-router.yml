name: Activate Seen UI router
on:
  push:
    paths:
      - '.github/workflows/activate-seen-ui-router.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delegate Sett to FlytSeenUI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function render(){if(state.view==='home'&&window.FlytHomeUI?.render){window.FlytHomeUI.render();return}if(state.view==='tasks'&&window.FlytTasksUI?.render){window.FlytTasksUI.render();return}if(state.view==='us'&&window.FlytOss?.render){window.FlytOss.render({refresh:false});return}const map={seen,rewards};const fn=map[state.view]||home;$('#content').innerHTML=fn();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}"
          new="function render(){if(state.view==='home'&&window.FlytHomeUI?.render){window.FlytHomeUI.render();return}if(state.view==='tasks'&&window.FlytTasksUI?.render){window.FlytTasksUI.render();return}if(state.view==='seen'&&window.FlytSeenUI?.render){window.FlytSeenUI.render();return}if(state.view==='us'&&window.FlytOss?.render){window.FlytOss.render({refresh:false});return}const map={seen,rewards};const fn=map[state.view]||home;$('#content').innerHTML=fn();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}"
          if old not in s:
              raise SystemExit('render anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aktiver ny Sett-visning"
          git push
