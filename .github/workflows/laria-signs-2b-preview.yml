name: Læria Premium 3.0 Fase 2B – skiltforankring iPad
on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/laria-signs-2b-preview.*'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-signs-2b-preview.playwright.js'
      - '.github/workflows/laria-signs-2b-preview.yml'
      - 'docs/laria-premium-3/phase-2b-signs-design-contract.md'
permissions:
  contents: read
jobs:
  visual-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Validate feature flag and visual QA script
        run: node --check laer-litt-mer/laria-signs-2b-preview.js && node --check tests/laria-signs-2b-preview.playwright.js
      - name: Serve exact PR head
        run: python3 -m http.server 8765 --directory . >/tmp/laria-signs-2b-http.log 2>&1 &
      - name: Compare existing Home and real scene controls in five iPad sizes
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_SIGNS_2B_SHOTS: /tmp/laria-signs-2b
        run: node tests/laria-signs-2b-preview.playwright.js
      - name: Upload actual 2B before/after iPad screenshots (not visual approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-signs-2b-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/laria-signs-2b
          retention-days: 14
          if-no-files-found: warn
