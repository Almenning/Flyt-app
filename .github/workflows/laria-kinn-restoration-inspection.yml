    branches:
      - feat/laria-premium-beta-cleanup-20261106
    paths:
      - .github/workflows/laria-kinn-restoration-inspection.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Retrieve generated repair ONLY as a visual inspection candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://files2.heygen.ai/gen_os/generated_images/d29ad0d3e09d41ba8edccf6ff33a5ca4.png?Expires=1795349511&Signature=mLqyagAtJrmRLP7n4DHGIIMuJusyOWFBkHvgUH1JuEx8f2I59hvc5lypUpjXT82zkpjECmeAMJ46eIWdZzwePKAF5VSKhy6EP-z3-q7zC2~VI~UBYu3~DbrfKMv7LeqdZtIOwALfrr82ij984otepOJBDn1mN0CIu~n6JCYsEhwbMxgR6g8yRfUUSNAwXoz9D~PkpvDAhR8mtsy7xp-ZMybCwjbBlvOGHn5lAI5cJ3rCGm5BiihDjvCWwGuhtCjgdSFZpArnkWreAg94zhx7ep4XpZIfsuIIU4dRkiAg8R2TfvRcgP4fFwg4dhWAIw7bkJZY-YORFQHoKLrF6wDGsQ__&Key-Pair-Id=K3TSZ3KU01LY58' --output /tmp/kinnaklova-restoration-candidate.png
          file /tmp/kinnaklova-restoration-candidate.png
          test "$(stat -c%s /tmp/kinnaklova-restoration-candidate.png)" -gt 200000
      - uses: actions/upload-artifact@v4
        with:
          name: kinnaklova-restoration-candidate-inspection
          path: /tmp/kinnaklova-restoration-candidate.png
          if-no-files-found: error
