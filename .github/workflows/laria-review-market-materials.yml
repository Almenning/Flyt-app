name: Laria review bounded market refinement
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/laria-review-market-materials.yml'
      - '.github/patches/gangemagi-material-review.json.gz'
permissions:
  contents: read
jobs:
  prepare-reviewed-files:
    if: github.repository == 'Almenning/Flyt-app' && github.event.pull_request.number == 192 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/laria-gangemagi-premium-main-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce locally reviewed edits against exact original hashes
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, subprocess
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          packed=Path('.github/patches/gangemagi-material-review.json.gz').read_bytes()
          assert blob(packed)=='e5512c48406f952748e364317e0eb7564bfffdef'
          payload=json.loads(gzip.decompress(packed))
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==payload['parent']=='e106684c371990e5a73499cddd99e1023325acf2'
          allowed={'laer-litt-mer/gangemagi-dagens-oppdrag-v1.css','laer-litt-mer/gangemagi-quest-board-painted.svg','laer-litt-mer/gangemagi-market-table-premium.svg','laer-litt-mer/gangemagi-math-parchment.svg','laer-litt-mer/index.html','laer-litt-mer/sw.js','tests/laria-gangemagi.playwright.js','tests/laria-gangemagi-release-cache.test.cjs'}
          assert {e['path'] for e in payload['files']}==allowed
          for e in payload['files']:
              p=Path(e['path'])
              if e['before'] is None:
                  assert not p.exists()
                  before=''
              else:
                  assert blob(p.read_bytes())==e['before'],e['path']
                  before=p.read_text()
              if 'content' in e:
                  after=e['content']
              else:
                  after=before
                  for i,j,text in reversed(e['edits']):
                      assert 0<=i<=j<=len(before)
                      after=after[:i]+text+after[j:]
              data=after.encode()
              assert blob(data)==e['after'],e['path']
              p.write_bytes(data)
          workflow=Path('.github/workflows/laria-gangemagi-approved.yml')
          assert blob(workflow.read_bytes())=='b358410b7c938039e6fd41318d4181205da2a138'
          text=workflow.read_text()
          anchor="      - 'tests/laria-gangemagi.playwright.js'\n"
          assert text.count(anchor)==2
          extra=''.join("      - '"+p+"'\n" for p in sorted(allowed) if p.endswith(('.css','.svg')))
          workflow.write_text(text.replace(anchor,anchor+extra))
          log=Path('docs/LARIA-GANGEMAGI-PREMIUM-ARBEIDSLOGG-2026-10-18.md')
          log.write_text(log.read_text()+'\n\n## 21. oktober: handlingsbilder og samlet marked, referanserevisjon\n\n'
            '- Videreforer den gjenfunne originalen Gangemagi i Tallengas hage.png (fil-ID file_00000000ba048210a3365748b25cc26b) og den senere markedsillustrasjonen (file_000000008ab48210b7a5615e529e50af). Ingen ny spillmodell eller ny standardrev.\n'
            '- Endret eksisterende komponentregler, ikke lagt til en overstyringsfil: storre billedsteg innenfor tavlens plass, roligere trinnrammer, varmere malt tre/pergament og fysisk duk under kurver og jordbaerkilde. Kilden har storre baer og lesbart Plukk-skilt; ingen generisk legg-til-knapp.\n'
            '- Konkret revfeil: SVG-ens automatiske minste radstorrelse gjorde en 227px beholder til et 345px malt bilde pa iPad. Minmax(0,1fr) og begrensning av selve SVG-en hindrer at figuren males bak regnestykket. Personlig rev og animasjoner bevares.\n'
            '- Lokalt: seks Chromium-storrelser 320x568, 390x844, 820x1180, 1180x820, 844x390 og 1440x900 bestod alle atte oppdrag og synlig hovedhandling. Dette var en offline rendringsfixture med lagringsadapter, ikke en produksjons-/CSP-test eller WebKit-test. 13 faktiske Node-motor/cache/handler-regresjoner bestod.\n'
            '- Eksisterende Playwright-regresjon er utvidet til a male faktisk reve-SVG, storrelse pa billedsteg, jordbaerkildens motiv og fravaer av bakgrunnsuskarphet. Ny ressursversjon release2 og SW-cache bevarer oppdateringer.\n'
            '- GitHub Chromium/WebKit og full regresjon ma besta pa endelig commit; inspiser bildene mot originalene for premiumgodkjenning. Ikke merget eller publisert.\n')
          names=sorted(allowed|{str(workflow),str(log)})
          out=Path('/tmp/laria-material-review');out.mkdir()
          (out/'paths.json').write_text(json.dumps(names))
          import xml.etree.ElementTree as ET
          for name in names:
              if name.endswith('.svg'):ET.parse(name)
          print('REVIEWED_FILES',json.dumps([{ 'path':n,'sha':blob(Path(n).read_bytes())} for n in names]))
          PY
      - name: Validate real application and all thirteen focused regressions
        run: |
          node --check laer-litt-mer/multiplication-gangemagi-v1.js
          node --check tests/laria-gangemagi.playwright.js
          node --test tests/laria-gangemagi-engine.test.cjs tests/laria-gangemagi-release-cache.test.cjs tests/laria-gangemagi-tap-intent.test.cjs
      - name: Store reviewed blobs only without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='Almenning/Flyt-app'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_HEAD']
          out=Path('/tmp/laria-material-review');names=json.loads((out/'paths.json').read_text());entries=[]
          for name in names:
              data=Path(name).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/Almenning/Flyt-app/git/blobs',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              assert result['sha']==sha
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
              target=out/'reviewed-files'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          manifest={'parent':os.environ['SOURCE_HEAD'],'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tree_elements':entries,'remote_refs_changed':False}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('MATERIAL_REVIEW_MANIFEST',json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-material-review-${{ github.event.pull_request.head.sha }}
          path: /tmp/laria-material-review
          if-no-files-found: error
          retention-days: 3
