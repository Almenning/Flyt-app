name: Restore index after task bust
on:
  push:
    paths:
      - '.github/workflows/restore-index-after-task-bust.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore complete index and keep fresh tasks module
        run: |
          git show HEAD^:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./tasks-ui.js?v=20260823-2031','./tasks-ui.js?v=20260823-2204',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Gjenopprett komplett index med fersk Gjøre-modul"
          git push
