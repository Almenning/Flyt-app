name: Laria sprint 2 task outcome
on:
  push:
    branches: [qa/laria-premium-snapshot-20261015]
    paths: [.github/workflows/laria-sprint2-outcome.yml]
permissions:
  contents: read
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/laria-premium-retry-flow-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: apply
        name: Apply locally reviewed changes with a branch lease
        env:
          SOURCE: 
        run: |
          test "$(git rev-parse HEAD)" = 3ef79e86388b15b54fdb947343f7e2c6534f0992
          python3 - <<'PY'
          import os,base64,zlib,hashlib
          encoded=os.environ['SOURCE'].replace('539Lh0+s5bfBeOt+c5bfBeOt+c83R','539Lh0+s5bfBeOt+c83R')
          source=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(source).hexdigest()=='b52399b7b66b5acb0f7e61774382d4a3b3b16cc1f10f2743d873ef8724013d23'
          exec(compile(source,'reviewed-sprint2.py','exec'))
          PY
          git diff --check
          node --check laer-litt-mer/laria-task-scene-v15.js
          node --check tests/laria-premium-retry-flow.playwright.js
          npm ci --no-audit --no-fund
          npm run test:node
          git add laer-litt-mer/index.html laer-litt-mer/sw.js laer-litt-mer/laria-task-scene-v15.js laer-litt-mer/laria-task-young-v18.css laer-litt-mer/laria-task-feedback-stable-v1.css tests/laria-premium-retry-flow.playwright.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(laria): keep task feedback and Next together without clipping artwork'
          git push origin HEAD:refs/heads/fix/laria-premium-retry-flow-20261015
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  browser:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        formats: ['320x568,390x844,430x932,844x390', '820x1180,1180x820', '1440x900']
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Capture matching before state on landscape iPad
        if: matrix.formats == '820x1180,1180x820'
        env:
          LARIA_RETRY_ENGINE: ${{ matrix.engine }}
          LARIA_RETRY_FORMATS: 1180x820
          LARIA_RETRY_SUBJECTS: norwegian
          LARIA_OUTCOME_BASELINE: '1'
          LARIA_RETRY_EVIDENCE: /tmp/sprint2/before
        run: |
          mkdir -p /tmp/sprint2/before
          for f in laer-litt-mer/index.html laer-litt-mer/sw.js laer-litt-mer/laria-task-scene-v15.js laer-litt-mer/laria-task-young-v18.css laer-litt-mer/laria-task-feedback-stable-v1.css; do git show 3ef79e86388b15b54fdb947343f7e2c6534f0992:$f > "$f"; done
          echo 3ef79e86388b15b54fdb947343f7e2c6534f0992 > /tmp/sprint2/before/REVISION.txt
          node tests/laria-premium-retry-flow.playwright.js > /tmp/sprint2/before/browser.log 2>&1
      - name: Verify exact changed revision through real child actions
        if: always()
        env:
          LARIA_RETRY_ENGINE: ${{ matrix.engine }}
          LARIA_RETRY_FORMATS: ${{ matrix.formats }}
          LARIA_RETRY_EVIDENCE: /tmp/sprint2/after
        run: |
          git restore laer-litt-mer
          mkdir -p /tmp/sprint2/after
          git rev-parse HEAD > /tmp/sprint2/after/REVISION.txt
          set -o pipefail
          node tests/laria-premium-retry-flow.playwright.js 2>&1 | tee /tmp/sprint2/after/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-sprint2-${{ matrix.engine }}-${{ matrix.formats }}
          path: /tmp/sprint2/
          retention-days: 7
