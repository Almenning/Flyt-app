name: Cache bust active Flyt modules
on:
  push:
    paths:
      - '.github/workflows/cache-bust-active-modules.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version script URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          repl={
            '<script src="./sync.js" defer></script>':'<script src="./sync.js?v=20260823-1516" defer></script>',
            '<script src="./oss.js" defer></script>':'<script src="./oss.js?v=20260823-1516" defer></script>',
            '<script src="./app-watchdog.js" defer></script>':'<script src="./app-watchdog.js?v=20260823-1516" defer></script>',
            '<script src="./tasks-ui.js" defer></script>':'<script src="./tasks-ui.js?v=20260823-1516" defer></script>'
          }
          for old,new in repl.items():
              if old in s:
                  s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tving ferske modulversjoner i Flyt"
          git push
