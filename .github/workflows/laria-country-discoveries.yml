name: Laria country discoveries
on:
  push:
    branches: [main, feat/laria-country-discoveries-20261015]
    paths:
      - 'laer-litt-mer/**'
      - 'tests/laria-country*'
      - '.github/workflows/laria-country-discoveries.yml'
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/**'
      - 'tests/laria-country*'
      - '.github/workflows/laria-country-discoveries.yml'
permissions:
  contents: read
concurrency:
  group: country-discoveries-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reading-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Editorial, coverage and integration contracts
        run: |
          node --check laer-litt-mer/country-discoveries-v1.js
          node --check laer-litt-mer/country-discoveries-ui-v1.js
          node --check laer-litt-mer/laria-country-detail-premium-v1.js
          node --check laer-litt-mer/globe-v25-renderer.js
          node --test tests/laria-country-discoveries.test.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Country discoveries, speech and six responsive configurations
        env:
          COUNTRY_DISCOVERY_SCREENSHOTS: /tmp/laria-country-discoveries
        run: node tests/laria-country-discoveries.playwright.js
      - name: Existing country art, selected fox and practice on five configurations
        env:
          COUNTRY_STORY_QA_SCREENSHOTS: /tmp/laria-country-story
        run: node tests/laria-country-detail-premium.playwright.js
      - name: Visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-discoveries-${{ github.sha }}
          path: |
            /tmp/laria-country-discoveries
            /tmp/laria-country-story
          retention-days: 7
          if-no-files-found: warn
