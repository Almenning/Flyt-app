name: Laria QA

on:
  push:
    branches: [main, fix/laria-globe-locked-scenery-v36, feat/laria-oct10-locked-journeys-phase1, feat/laria-personal-fox-20261011, feat/laria-fox-live-companion-20261011]
    paths:
      - 'laer-litt-mer/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/laria-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/laria-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  country-story:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify illustrated country detail on iPhone and iPad
        env:
          COUNTRY_STORY_QA_SCREENSHOTS: /tmp/laria-country-story
        run: |
          node --check laer-litt-mer/laria-country-detail-premium-v1.js
          node --check laer-litt-mer/globe-v25-renderer.js
          node --check tests/laria-country-detail-premium.playwright.js
          node tests/laria-country-detail-premium.playwright.js
      - name: Upload country-story visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-country-story-${{ github.sha }}
          path: /tmp/laria-country-story
          if-no-files-found: warn
          retention-days: 7

  laria-qa:
    runs-on: ubuntu-latest
    # Run 39678827816 reached the 38-minute job limit after passing the
    # browser suite. Keep every test and its own timeout; allow final evidence.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static and Node regression suite
        run: npm run test:node

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify Plukk og tell in iPhone and iPad Chromium and WebKit
        env:
          PICK_QA_SCREENSHOTS: /tmp/laria-pick-play
        run: node tests/laria-pick-play.browser.playwright.js

      - name: Upload Plukk og tell storybook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-pick-play-${{ github.sha }}
          path: /tmp/laria-pick-play
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Ordjakt responsive touch in Chromium and WebKit
        env:
          WORD_HUNT_QA_SCREENSHOTS: /tmp/laria-wordhunt-phase4
        run: node tests/laria-word-hunt-phase4.playwright.js

      - name: Upload Ordjakt phone and iPad screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-wordhunt-phase4-${{ github.sha }}
          path: /tmp/laria-wordhunt-phase4
          if-no-files-found: warn
          retention-days: 7

      - name: Verify illustrated Ordjakt topic cards, magic and collection in Chromium and WebKit
        env:
          WORD_HUNT_THEMES_SCREENSHOTS: /tmp/laria-wordhunt-themes
        run: node tests/laria-word-hunt-themes.playwright.js

      - name: Upload Ordjakt theme picker, board and collection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-wordhunt-themes-${{ github.sha }}
          path: /tmp/laria-wordhunt-themes
          if-no-files-found: warn
          retention-days: 7

      - name: Verify young Maths on iPhone and iPad Chromium and WebKit
        env:
          MATH_TAP_QA_SCREENSHOTS: /tmp/laria-math-tap
        run: node tests/laria-math-tap.browser.playwright.js

      - name: Upload young Maths visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-math-tap-${{ github.sha }}
          path: /tmp/laria-math-tap
          if-no-files-found: warn
          retention-days: 7

      - name: Verify flat atlas perspective and retained classic globe
        env:
          ATLAS_QA_SCREENSHOTS: /tmp/laria-atlas-v1
        run: node tests/laria-atlas-perspective.playwright.js

      - name: Upload atlas perspective screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-atlas-v1-${{ github.sha }}
          path: /tmp/laria-atlas-v1
          if-no-files-found: warn
          retention-days: 7

      - name: Verify premium Brøklaben in Chromium and WebKit
        env:
          FRACTION_QA_SCREENSHOTS: /tmp/laria-fraction-workshop
        run: node tests/laria-fraction-premium.playwright.js

      - name: Upload Brøklaben screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-fraction-workshop-${{ github.sha }}
          path: /tmp/laria-fraction-workshop
          if-no-files-found: warn
          retention-days: 7

      - name: Verify premium multiplication in Chromium and WebKit
        env:
          QA_SCREENSHOTS: /tmp/laria-multiplication-v2
        run: node tests/laria-multiplication-premium.playwright.js

      - name: Upload premium multiplication screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-multiplication-v2-${{ github.sha }}
          path: /tmp/laria-multiplication-v2
          if-no-files-found: warn
          retention-days: 7

      - name: Verify original Gangemagi play on iPhone/iPad in Chromium and WebKit
        env:
          QA_SCREENSHOTS: /tmp/laria-gangemagi-v1
        run: |
          node --check laer-litt-mer/multiplication-gangemagi-engine-v1.js
          node --check laer-litt-mer/multiplication-gangemagi-v1.js
          node --check tests/laria-gangemagi.playwright.js
          node tests/laria-gangemagi.playwright.js

      - name: Upload Gangemagi first-fold and play screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-gangemagi-v1-${{ github.sha }}
          path: /tmp/laria-gangemagi-v1
          if-no-files-found: warn
          retention-days: 7

      - name: Full browser regression suite
        run: npm run test:browser

      - name: Start exact-head local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/laria-http.log 2>&1 &
          echo $! >/tmp/laria-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/laer-litt-mer/?app=laria >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/laria-http.log
          exit 1

      - name: Laria Basecamp Chromium + WebKit performance gate
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          QA_WEBKIT_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
        run: node tests/laria-basecamp-v12.cjs

      - name: Prompt 17 visual/device hardening matrix
        env:
          QA_SCREENSHOTS: /tmp/laria-device-hardening
        run: node tests/laria-device-hardening.playwright.js

      - name: Upload Prompt 17 device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-device-hardening-${{ github.sha }}
          path: /tmp/laria-device-hardening
          if-no-files-found: warn
          retention-days: 7

      - name: Prompt 18 globe visual evidence
        env:
          QA_SCREENSHOTS: /tmp/laria-p18-globe
        run: node tests/laria-globe-visual-p18.playwright.js

      - name: Upload Prompt 18 globe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-p18-globe-${{ github.sha }}
          path: /tmp/laria-p18-globe
          if-no-files-found: warn
          retention-days: 7



  laria-mapboard:
    runs-on: ubuntu-latest
    # Full WebKit phone + tablet mission matrix added; the previous 12-minute
    # budget cancelled the job after tests passed, before persistence checks.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify eight painted premium images against locked manifest
        run: node tests/laria-premium-art-integrity.cjs
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Start exact-head local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/laria-nav-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/laer-litt-mer/?app=laria >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laria-nav-http.log
          exit 1
      - name: Verify Basecamp travel and explore on iPhone and iPad
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          NAV_QA_SCREENSHOTS: /tmp/laria-navigation-v13
        run: node tests/laria-navigation-v13.playwright.js
      - name: UX phase 1 - verify button and edge swipe return parity
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_UX_NAV_SHOTS: /tmp/laria-ux-phase1
        run: |
          node --check tests/laria-ux-phase1-navigation.playwright.js
          node tests/laria-ux-phase1-navigation.playwright.js
      - name: Validate eight premium WebP card scenes across real layouts
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_PREMIUM_PREVIEW: '1'
        run: |
          node --check tests/laria-premium-cards.playwright.js
          node tests/laria-premium-cards.playwright.js
      - name: Verify locked Kjøsnesfjorden Home v15 on iPhone and iPad
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          HOME_V15_SCREENSHOTS: /tmp/laria-home-v15
        run: |
          node --check laer-litt-mer/home-kjosnes-v15.js
          node --check tests/laria-home-kjosnes-v15.playwright.js
          node tests/laria-home-kjosnes-v15.playwright.js
      - name: Upload Kjøsnesfjorden Home v15 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-home-v15-${{ github.sha }}
          path: /tmp/laria-home-v15
          if-no-files-found: warn
          retention-days: 7
      - name: Locked journey interaction geometry (synthetic decoder only; NOT visual parity)
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LOCKED_JOURNEY_QA: /tmp/laria-locked-journey-geometry
        run: |
          node --check laer-litt-mer/locked-journey-renderer.js
          node --check laer-litt-mer/locked-journey-contract.js
          node tests/laria-locked-journeys.playwright.js
      - name: Upload locked journey interaction screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-locked-journey-interaction-${{ github.sha }}
          path: /tmp/laria-locked-journey-geometry
          if-no-files-found: warn
          retention-days: 7
      - name: Integrated four-journey task and return paths on iPhone and iPad
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
        run: node tests/laria-journey-integrated-ux.playwright.js
      - name: Verify systematic grade-2 journey learning flow
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
        run: |
          node --check laer-litt-mer/journey-learning-system-v1.js
          node --check laer-litt-mer/geography-journey-learning-system-v1.js
          node --check tests/laria-journey-learning-system.playwright.js
          node --check tests/laria-geography-journey-learning-system.playwright.js
          node --check tests/laria-chapter1-completion.playwright.js
          node tests/laria-journey-learning-system.playwright.js
          node tests/laria-geography-journey-learning-system.playwright.js
          node tests/laria-chapter1-completion.playwright.js
      - name: Unified premium mission menus before and after completion
        env:
          MISSION_QA_SCREENSHOTS: /tmp/laria-mission-visual
        run: |
          node --check laer-litt-mer/locked-journey-renderer.js
          node --check tests/laria-journey-mission-premium.playwright.js
          node tests/laria-journey-mission-premium.playwright.js
      - name: Upload mission cards before and after completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-mission-panels-${{ github.sha }}
          path: /tmp/laria-mission-visual
          if-no-files-found: warn
          retention-days: 7
      - name: Selected fox across four journeys and tasks (iPhone/iPad WebKit and Chromium)
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_FOX_SCREENSHOTS: /tmp/laria-fox-identity
        run: node tests/laria-fox-identity.playwright.js
      - name: Verify one living personalized fox across Home, journey and tasks
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_LIVE_FOX_QA: /tmp/laria-live-fox
        run: node tests/laria-live-fox-presence.playwright.js
      - name: Upload living-fox preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-live-fox-${{ github.sha }}
          path: /tmp/laria-live-fox
          if-no-files-found: warn
          retention-days: 7
      - name: Upload selected-fox journey and task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-fox-identity-${{ github.sha }}
          path: /tmp/laria-fox-identity
          if-no-files-found: warn
          retention-days: 7
      - name: Selected fox in Brøklab, Plukk og tell, Ordjakt and globe
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_FOX_FREEPLAY_SCREENSHOTS: /tmp/laria-fox-freeplay
        run: node tests/laria-fox-freeplay.playwright.js
      - name: Upload selected-fox free-play screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-fox-freeplay-${{ github.sha }}
          path: /tmp/laria-fox-freeplay
          if-no-files-found: warn
          retention-days: 7
      - name: Verify magical collection inventory across Safari and Chromium reloads
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_COLLECTION_QA: /tmp/laria-collection-review
        run: node tests/laria-collection-persistence.playwright.js
      - name: Upload magical collection book screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-magical-collection-${{ github.sha }}
          path: /tmp/laria-collection-review
          if-no-files-found: warn
          retention-days: 7
      - name: Verify old checkpoint progression survives reload on approved artwork
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
        run: node tests/laria-locked-persistence.playwright.js
      - name: Real locked art screenshot validation (requires approved original PNGs)
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LOCKED_ORIGINAL_QA: /tmp/laria-locked-originals
        run: node tests/laria-locked-reference-visual.playwright.js
      - name: Upload original-PNG visual and touch-area evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-locked-original-reference-${{ github.sha }}
          path: /tmp/laria-locked-originals
          if-no-files-found: warn
          retention-days: 7
      - name: Upload subject Home visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-home-subjects-v14-${{ github.sha }}
          path: /tmp/laria-home-v14
          if-no-files-found: warn
          retention-days: 7
      - name: Upload map-board screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-navigation-v13-${{ github.sha }}
          path: |
            /tmp/laria-navigation-v13
            /tmp/laria-ux-phase1
          if-no-files-found: warn
          retention-days: 7


  # Isolate the slow fullscreen globe stress test from the complete QA matrix
  # so device-mode regressions can be caught and diagnosed in minutes.
  laria-globe-mode-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify genuine globe button taps and preserved geometry
        env:
          QA_SCREENSHOTS: /tmp/laria-globe-mode-touch
        run: node tests/laria-globe-visual-p18.playwright.js
      - name: Upload globe phone-tablet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-globe-mode-touch-${{ github.sha }}
          path: /tmp/laria-globe-mode-touch
          if-no-files-found: warn
          retention-days: 7

  # Separate from the synthetic UI tests. This gate deliberately FAILS while
  # the approved source PNGs are missing, so an otherwise green PR cannot be
  # mistaken for a visually finished implementation.
  locked-original-artwork-release:
    if: (github.event_name == 'pull_request' && github.head_ref == 'feat/laria-oct10-locked-journeys-phase1') || (github.event_name == 'push' && github.ref == 'refs/heads/feat/laria-oct10-locked-journeys-phase1')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Verify approved original artwork release readiness
        run: node scripts/laria-locked-release-gate.cjs

  # Real course progression, restart and daily goal gate.
  # Separated from visual map verification so failures have a focused report.
  laria-journey-progress-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check journey recovery test syntax
        run: node --check tests/laria-journey-progress-recovery.playwright.js
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Start exact-head local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/laria-recovery-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/laer-litt-mer/?app=laria >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laria-recovery-http.log
          exit 1
      - name: Verify four real course progress and interrupted recovery flows
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
        run: node tests/laria-journey-progress-recovery.playwright.js

# Focused task-scene quality gate with real device-sized screenshots.
  laria-task-phase3-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check for shared task engine and premium QA
        run: |
          node --check laer-litt-mer/laria-task-scene-v15.js
          node --check tests/laria-task-phase3-polish.playwright.js
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify four-subject premium task scene on iPhone and iPad
        env:
          LARIA_TASK_POLISH_SHOTS: /tmp/laria-task-phase3-polish
        run: node tests/laria-task-phase3-polish.playwright.js
      - name: Upload task-scene device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-task-phase3-polish-${{ github.sha }}
          path: /tmp/laria-task-phase3-polish
          if-no-files-found: warn
          retention-days: 7

