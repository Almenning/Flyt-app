name: Continuous smoke checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)
      - name: Install browser engines for Læria runtime verification
        run: npx playwright install --with-deps chromium webkit
      - name: Run complete Node test suite
        run: npm run test:node
      - name: Verify registered geography in Chromium and WebKit
        env:
          QA_SCREENSHOTS: /tmp/laria-geo-screenshots
        run: node tests/laria-globe-visual-p18.playwright.js
      - name: Archive globe geography screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-geo-globe-${{ github.sha }}
          path: /tmp/laria-geo-screenshots
          if-no-files-found: warn
          retention-days: 7
      - name: Run Læria local browser verification
        run: node tests/laer-litt-mer.playwright.js
      - name: Run Basecamp interaction verification in Chromium and WebKit
        if: always()
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          QA_WEBKIT_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
        shell: bash
        run: |
          python3 -m http.server 8765 --directory . >/tmp/laria-basecamp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' >/dev/null; then break; fi
            sleep 0.5
          done
          node tests/laria-basecamp-v12.cjs
      - name: Run general repository browser suite
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:browser 2>&1 | tee browser-test.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Verify published Læria runtime
        if: always()
        env:
          QA_URL: https://almenning.github.io/Flyt-app/laer-litt-mer/?app=laria
        run: npm run test:laria-live
      - name: Upload browser test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-log-${{ github.run_id }}
          path: browser-test.log
          if-no-files-found: ignore
          retention-days: 7

  pages-config:
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.source.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: source
        with:
          script: |
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              if (data.build_type === 'workflow') return true;
              core.warning('Pages still uses legacy branch deployment. Select Settings > Pages > Source > GitHub Actions to enforce the test gate.');
              return false;
            } catch (error) {
              core.warning('Pages configuration could not be verified; gated deployment is skipped.');
              return false;
            }

  pages-build:
    needs: pages-config
    if: needs.pages-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package public app files only
        run: node scripts/copy-capacitor-web-assets.mjs && touch www/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  pages-deploy:
    needs: pages-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
