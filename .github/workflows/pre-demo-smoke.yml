name: Pre-demo smoke checks

on:
  push:
    branches: [main, "audit/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify scripts referenced by index exist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'<script[^>]+src="\./([^"?]+\.js)', html)
          missing = [ref for ref in refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit('Missing local scripts: ' + ', '.join(missing))
          print('Referenced local scripts:', ', '.join(refs))
          PY
      - name: Enforce one Supabase auth client in the main app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t clients < <(grep -l 'supabase\.createClient' ./*.js 2>/dev/null || true)
          if [ "${#clients[@]}" -ne 1 ] || [ "${clients[0]:-}" != "./sync.js" ]; then
            printf 'Expected only ./sync.js to create the main Supabase client. Found: %s\n' "${clients[*]:-none}"
            exit 1
          fi
      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<< |>>>>>>> )' --include='*.js' --include='*.html' .; then
            echo 'Unresolved merge markers found'
            exit 1
          fi
