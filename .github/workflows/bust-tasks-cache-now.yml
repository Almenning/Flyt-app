name: Bust tasks cache now
on:
  push:
    paths:
      - '.github/workflows/bust-tasks-cache-now.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tasks cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./tasks-ui.js?v=20260823-2218'
          new='./tasks-ui.js?v=20260824-0847'
          if old not in s:
            raise SystemExit('tasks cache reference not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bust cache for nytt oppgavebibliotek"
          git push
