name: Targeted rewards edge swipe
on:
  push:
    branches:
      - work/edge-swipe-rewards-flows-20260930
jobs:
  edge-swipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/rewards-edge-swipe.playwright.js
