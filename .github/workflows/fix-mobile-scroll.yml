name: Fix mobile beta scroll
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile scroll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=".login{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#efb99d,#fff1e8 60%,#e9aa87)}.loginbox{width:min(100%,390px);padding:30px 24px;border-radius:28px;background:#fffaf6f5;text-align:center;box-shadow:0 25px 70px #5d2e1f44}"
          new=".login{position:fixed;inset:0;z-index:90;display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(24px,env(safe-area-inset-top)) 24px max(40px,calc(env(safe-area-inset-bottom) + 24px));background:linear-gradient(145deg,#efb99d,#fff1e8 60%,#e9aa87)}.loginbox{width:min(100%,390px);margin:0 auto;min-height:max-content;padding:30px 24px;border-radius:28px;background:#fffaf6f5;text-align:center;box-shadow:0 25px 70px #5d2e1f44}"
          if old not in s:
              raise SystemExit('login css pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fiks vertikal scrolling i beta-onboarding"
          git push
