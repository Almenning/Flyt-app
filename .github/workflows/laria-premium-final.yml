name: Laria premium final verification
on:
  push:
    branches: [fix/laria-premium-retry-flow-20261015]
    paths: [.github/workflows/laria-premium-final.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.patch.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: patch
        name: Apply reviewed adjustments on sprint branch only
        env:
          PATCH_B64: ''
        run: |
          python3 - <<'PY'
          import os,base64,zlib,hashlib,pathlib
          patch=zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          assert hashlib.sha256(patch).hexdigest()=='8b9d33212f7aef8d307cfae43d76951a86362f9629b2200ebf76addb50e7cec0'
          pathlib.Path('/tmp/final.patch').write_bytes(patch)
          PY
          git apply --check /tmp/final.patch
          git apply /tmp/final.patch
          git rm .github/workflows/laria-premium-final.yml
          git add laer-litt-mer/index.html laer-litt-mer/sw.js tests/laria-premium-retry-flow.playwright.js tests/laria-premium-retry-flow.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(laria): distinguish number-pattern hints and close solved word input'
          git push origin HEAD:refs/heads/fix/laria-premium-retry-flow-20261015
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:node
  browser:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      LARIA_RETRY_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify real retries, correction, reload, replay and return
        run: |
          mkdir -p /tmp/laria-final/grade2 /tmp/laria-final/grade1
          git rev-parse HEAD > /tmp/laria-final/REVISION.txt
          set +e
          LARIA_RETRY_EVIDENCE=/tmp/laria-final/grade2 timeout 240 node tests/laria-premium-retry-flow.playwright.js > /tmp/laria-final/grade2.log 2>&1
          grade2=$?
          LARIA_RETRY_GRADE=1 LARIA_RETRY_FORMATS=390x844 LARIA_RETRY_EVIDENCE=/tmp/laria-final/grade1 timeout 90 node tests/laria-premium-retry-flow.playwright.js > /tmp/laria-final/grade1.log 2>&1
          grade1=$?
          cat /tmp/laria-final/grade2.log /tmp/laria-final/grade1.log
          test "$grade2" = 0 && test "$grade1" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laria-final-${{ matrix.engine }}
          path: /tmp/laria-final/
          retention-days: 7
