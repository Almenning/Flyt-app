name: Laria responsive phase C3

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/laria-responsive-phaseb.css'
      - 'laer-litt-mer/laria-journey-ground-v1.css'
      - 'laer-litt-mer/locked-journey-renderer.js'
      - 'laer-litt-mer/index.html'
      - 'laer-litt-mer/sw.js'
      - 'tests/laria-responsive-phasec3-iphone-journeys.playwright.js'
      - 'tests/laria-d2-feature-gate.playwright.js'
      - 'scripts/laria_d2_outpaint.py'
      - 'tests/laria-responsive-phasea-bokskogen.playwright.js'
      - 'docs/laria-d2-seam-art-contract.md'
      - '.github/workflows/laria-responsive-phasec3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone-original-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify test syntax
        run: |
          node --check tests/laria-responsive-phasec3-iphone-journeys.playwright.js
          node --check laer-litt-mer/locked-journey-renderer.js
      - name: Install real WebKit and Chromium browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Test four original maps, safe edges, fox and navigation on iPhone
        env:
          LARIA_RESPONSIVE_C3_IMAGES: /tmp/laria-responsive-c3
        run: node tests/laria-responsive-phasec3-iphone-journeys.playwright.js
      - name: Verify D2 art gate in WebKit and Chromium
        run: node tests/laria-d2-feature-gate.playwright.js
      - name: Upload actual browser screenshots and layout geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-responsive-c3-${{ github.sha }}
          path: /tmp/laria-responsive-c3
          if-no-files-found: warn
          retention-days: 7

      - name: Archive four approved fox-free paintings for D2 illustration seam QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-d2-approved-paintings-${{ github.sha }}
          path: |
            laer-litt-mer/locked-journeys/bokskogen-fox-free-20261011.webp
            laer-litt-mer/locked-journeys/tallenga-fox-free-20261011.webp
            laer-litt-mer/locked-journeys/ordlandsbyen-fox-free-20261011.webp
            laer-litt-mer/locked-journeys/nordlysleiren-fox-free-20261011.webp
          if-no-files-found: error
          retention-days: 7

      - name: Set up Python 3.12 for exact-source D2 masters
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build masks from the four unchanged locked PNGs
        run: |
          python -m pip install 'Pillow>=10,<12'
          python scripts/laria_d2_outpaint.py templates --output /tmp/laria-d2-exact-masters
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from PIL import Image, ImageChops
          spec=importlib.util.spec_from_file_location('d2','scripts/laria_d2_outpaint.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          base=Path('/tmp/laria-d2-exact-masters')
          for subject,name in module.SUBJECTS.items():
              original=module.original_image(module.ROOT,subject)
              art=Image.open(base/(name+'-outpaint-exact.png')).convert('RGBA')
              mask=Image.open(base/(name+'-paint-mask-white.png'))
              anchor=Image.open(base/(name+'-43px-exact-anchor.png')).convert('RGBA')
              assert art.size==(941,725) and anchor.size==(941,468)
              assert ImageChops.difference(art.convert('RGB').crop((0,0,941,300)),
                  original.crop((0,1372,941,1672))).getbbox() is None
              assert ImageChops.difference(anchor.convert('RGB').crop((0,0,941,43)),
                  original.crop((0,1629,941,1672))).getbbox() is None
              assert mask.getpixel((500,100))==0 and mask.getpixel((500,500))==255
              assert anchor.getpixel((500,100))[3]==0
              print('PASS '+subject+' exact 300px context, original 43px anchor, 425px paint mask')
          PY
      - name: Upload D2 pixel-exact outpainting masters
        uses: actions/upload-artifact@v4
        with:
          name: laria-d2-exact-masters-${{ github.sha }}
          path: /tmp/laria-d2-exact-masters
          if-no-files-found: error
          retention-days: 14
