name: Laria responsive phase C3

on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/laria-responsive-phaseb.css'
      - 'laer-litt-mer/locked-journey-renderer.js'
      - 'tests/laria-responsive-phasec3-iphone-journeys.playwright.js'
      - '.github/workflows/laria-responsive-phasec3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laria-responsive-phasec3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone-original-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify test syntax
        run: |
          node --check tests/laria-responsive-phasec3-iphone-journeys.playwright.js
          node --check laer-litt-mer/locked-journey-renderer.js
      - name: Install real WebKit and Chromium browsers
        run: npx playwright install --with-deps webkit chromium
      - name: Test four original maps, safe edges, fox and navigation on iPhone
        env:
          LARIA_RESPONSIVE_C3_IMAGES: /tmp/laria-responsive-c3
        run: node tests/laria-responsive-phasec3-iphone-journeys.playwright.js
      - name: Upload actual browser screenshots and layout geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-responsive-c3-${{ github.sha }}
          path: /tmp/laria-responsive-c3
          if-no-files-found: warn
          retention-days: 7
