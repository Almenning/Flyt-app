name: iOS native build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '*.js'
      - '*.html'
      - 'vendor/**'
      - 'icons/**'
      - 'scripts/copy-capacitor-web-assets.mjs'
      - 'scripts/prepare-ios-native-qa.py'
      - 'scripts/run-ios-native-qa.sh'
      - '.github/workflows/ios-native-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '*.js'
      - '*.html'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'vendor/**'
      - 'icons/**'
      - 'scripts/copy-capacitor-web-assets.mjs'
      - 'scripts/prepare-ios-native-qa.py'
      - 'scripts/run-ios-native-qa.sh'
      - '.github/workflows/ios-native-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor iOS project
        run: npm run cap:sync
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build iOS simulator target
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "${{ runner.temp }}/hverdagsoss-native-qa/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run actual native startup, Keychain and URL tests
        run: bash scripts/run-ios-native-qa.sh
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hverdagsoss-native-qa/*.xcresult
            ${{ runner.temp }}/hverdagsoss-native-qa/*.log
            ${{ runner.temp }}/hverdagsoss-native-qa/simulator-state.json
            ${{ runner.temp }}/hverdagsoss-native-qa/failure.png
          if-no-files-found: warn
          retention-days: 7
