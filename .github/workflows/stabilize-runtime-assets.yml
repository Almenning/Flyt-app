name: Stabilize runtime assets
on:
  push:
    paths:
      - '.github/workflows/stabilize-runtime-assets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin current Flyt modules and disable legacy setup handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<script src="./sync.js?v=20260823-2218" defer></script>
<script src="./oss.js?v=20260824-1318" defer></script>
<script src="./app-watchdog.js?v=20260823-2034" defer></script>
<script src="./tasks-ui.js?v=20260824-1120" defer></script>
<script src="./planned-ui.js?v=20260824-1302" defer></script>
<script src="./home-ui.js?v=20260823-2218" defer></script>'''
          new='''<script src="./sync.js?v=20260825-0905" defer></script>
<script src="./oss.js?v=20260825-0905" defer></script>
<script src="./modal-ui.js?v=20260825-0905" defer></script>
<script src="./tasks-ui.js?v=20260825-0905" defer></script>
<script src="./planned-ui.js?v=20260825-0905" defer></script>
<script src="./home-ui.js?v=20260825-0905" defer></script>
<script src="./custom-categories-ui.js?v=20260825-0905" defer></script>
<script src="./recurrence-ui.js?v=20260825-0905" defer></script>
<script src="./responsive-ui.js?v=20260825-0905" defer></script>
<script src="./setup-nav-guard.js?v=20260825-0905" defer></script>
<script src="./task-actions-guard.js?v=20260825-0905" defer></script>
<script src="./rewards-edit-guard.js?v=20260825-0905" defer></script>
<script src="./seen-ui.js?v=20260825-0905" defer></script>
<script src="./beta-ui.js?v=20260825-0905" defer></script>
<script src="./legacy-cleanup.js?v=20260825-0905" defer></script>
<script src="./app-watchdog.js?v=20260825-0905" defer></script>'''
          if old not in s:
            raise SystemExit('critical script block not found')
          s=s.replace(old,new,1)
          s=s.replace("$('#setupBtn').onclick=()=>openSetup(0);","/* modern setup-ui owns #setupBtn */",1)
          s=s.replace("if(b.dataset.openSetup)openSetup(0);","/* modern setup-ui owns setup launch */",1)
          s=s.replace("$('#setupBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.area){state.areas[b.dataset.area]=!state.areas[b.dataset.area];save();renderSetup()}if(b.dataset.train){state.trainingFor[b.dataset.train]=!state.trainingFor[b.dataset.train];save();renderSetup()}};\n$('#setupBack').onclick=()=>{if(step>0){step--;renderSetup()}};\n$('#setupNext').onclick=()=>{if(step<2){step++;renderSetup()}else closeSetup()};","/* modern tasks-ui owns setup body and navigation */",1)
          if "navigator.serviceWorker.register('./sw.js?v=20260825-0905')" not in s:
            s=s.replace('</body>',"<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20260825-0905').catch(()=>{}));}</script>\n</body>",1)
          p.write_text(s)
          PY
      - name: Commit runtime stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Pin current runtime modules and retire legacy setup handlers"
          git push