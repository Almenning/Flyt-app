name: Laria Fortellingsdalen Pilot
on:
  pull_request:
    branches: [main]
    paths:
      - 'laer-litt-mer/chapter-expansion-v1.js'
      - 'laer-litt-mer/fortellingsdalen-*'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-fortellingsdalen-chapter2.*'
      - '.github/workflows/laria-chapter2-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'laer-litt-mer/chapter-expansion-v1.js'
      - 'laer-litt-mer/fortellingsdalen-*'
      - 'laer-litt-mer/index.html'
      - 'tests/laria-fortellingsdalen-chapter2.*'
      - '.github/workflows/laria-chapter2-pilot.yml'
permissions:
  contents: read
concurrency:
  group: laria-chapter2-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chapter data and persistence invariants
        run: |
          node --check laer-litt-mer/fortellingsdalen-stories-v1.js
          node --check laer-litt-mer/chapter-expansion-v1.js
          node --check laer-litt-mer/fortellingsdalen-preview-v1.js
          node --check tests/laria-fortellingsdalen-chapter2.playwright.js
          node --test tests/laria-fortellingsdalen-chapter2.test.cjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Start exact-branch app server
        run: |
          python3 -m http.server 8765 --directory . > /tmp/laria-c2-server.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS 'http://127.0.0.1:8765/laer-litt-mer/?app=laria' > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laria-c2-server.log
          exit 1
      - name: Chapter-two preview on iPhone and iPad
        env:
          QA_URL: http://127.0.0.1:8765/laer-litt-mer/?app=laria
          LARIA_CHAPTER2_SCREENSHOTS: /tmp/laria-fortellingsdalen
        run: node tests/laria-fortellingsdalen-chapter2.playwright.js
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laria-fortellingsdalen-preview-${{ github.sha }}
          path: /tmp/laria-fortellingsdalen
          if-no-files-found: warn
          retention-days: 7
