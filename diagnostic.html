<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>HverdagsOss – oppstartsdiagnose</title>
  <style>
    :root {
      color-scheme: light;
      --cream: #fff8f2;
      --paper: #fffdf9;
      --brown: #492f29;
      --muted: #826f68;
      --coral: #dc7058;
      --line: #eadbd2;
      --ok: #2f7658;
      --bad: #a53f39;
      --wait: #8a6730;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: max(24px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom));
      background: linear-gradient(155deg, #f6c7ae 0%, var(--cream) 42%, #f3b993 100%);
      color: var(--brown);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 720px); margin: 0 auto; }
    .card {
      border: 1px solid rgba(73, 47, 41, .12);
      border-radius: 28px;
      background: rgba(255, 253, 249, .96);
      box-shadow: 0 18px 45px rgba(73, 47, 41, .14);
      padding: 24px 20px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--coral);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(34px, 9vw, 52px); line-height: 1; }
    .lead { margin: 14px 0 22px; color: var(--muted); font-size: 17px; line-height: 1.45; }
    .summary {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--cream);
      font-size: 14px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .status { font-weight: 800; }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .status.wait { color: var(--wait); }
    #results { display: grid; gap: 9px; margin: 0 0 18px; padding: 0; list-style: none; }
    .result {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
    }
    .result strong, .result small { display: block; overflow-wrap: anywhere; }
    .result strong { font-size: 14px; line-height: 1.3; }
    .result small { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .icon { font-size: 18px; line-height: 1.1; }
    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 16px;
      background: var(--coral);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .55; }
    #copy { margin-top: 10px; background: var(--brown); }
    pre {
      max-height: 220px;
      margin: 16px 0 0;
      padding: 12px;
      overflow: auto;
      border-radius: 14px;
      background: #2f2421;
      color: #fffaf6;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">HverdagsOss</p>
      <h1 id="title">Oppstartsdiagnose</h1>
      <p class="lead">Denne siden endrer ikke appen. Den kontrollerer bare om nettleseren får lastet filene som oppstarten er avhengig av.</p>

      <div class="summary" id="summary" role="status" aria-live="polite">
        <div><span class="status ok">JavaScript kjører.</span></div>
        <div id="environment">Samler nettleserinformasjon …</div>
        <div id="worker">Kontrollerer service worker …</div>
        <div id="overall">Starter filtest …</div>
      </div>

      <ol id="results" aria-label="Testresultater"></ol>
      <button id="rerun" type="button">Kjør testen på nytt</button>
      <button id="copy" type="button">Kopier resultat</button>
      <pre id="report" aria-label="Diagnoserapport"></pre>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const FILES = [
        './index.html',
        './vendor/supabase-2.116.0.js',
        './task-language.js',
        './day-plan.js',
        './daily-loop.js',
        './couple-core.js',
        './couple-insights.js',
        './seen-core.js',
        './seen-ui.js',
        './rewards-goals-core.js',
        './sync.js',
        './daily-status.js',
        './oss.js',
        './nav-scroll-top-ui.js',
        './edge-swipe-back.js',
        './app-watchdog.js',
        './tasks-ui.js',
        './category-accordion.js',
        './recurrence-ui.js',
        './tasks-view-guard.js',
        './planned-ui.js',
        './home-ui.js',
        './daily-checkin-popup.js',
        './settings-ui.js',
        './modal-scroll-lock.js',
        './nudge-ui.js'
      ];
      const TIMEOUT_MS = 12000;
      const resultsNode = document.getElementById('results');
      const reportNode = document.getElementById('report');
      const overallNode = document.getElementById('overall');
      const rerunButton = document.getElementById('rerun');
      const copyButton = document.getElementById('copy');
      let lastReport = '';

      const now = () => new Date().toISOString();
      const detail = `${navigator.userAgent}\nonline=${navigator.onLine} readyState=${document.readyState}`;
      document.getElementById('environment').textContent = detail;

      function renderRow(file, state, message) {
        const item = document.createElement('li');
        item.className = 'result';
        item.dataset.file = file;
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = state === 'ok' ? '✓' : state === 'bad' ? '✕' : '…';
        const text = document.createElement('div');
        const name = document.createElement('strong');
        name.textContent = file.replace('./', '');
        const info = document.createElement('small');
        info.textContent = message;
        text.append(name, info);
        item.append(icon, text);
        resultsNode.append(item);
        return item;
      }

      async function inspectWorker() {
        const node = document.getElementById('worker');
        if (!('serviceWorker' in navigator)) {
          node.textContent = 'Service worker: støttes ikke i denne nettleseren.';
          return 'unsupported';
        }
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const controlled = Boolean(navigator.serviceWorker.controller);
          node.textContent = `Service worker: controlled=${controlled}, registrations=${registrations.length}`;
          return `controlled=${controlled}, registrations=${registrations.length}`;
        } catch (error) {
          node.textContent = `Service worker: kunne ikke leses (${String(error)})`;
          return `error=${String(error)}`;
        }
      }

      async function checkFile(file, runId) {
        const started = performance.now();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        const separator = file.includes('?') ? '&' : '?';
        const url = `${file}${separator}diagnostic=${runId}`;
        try {
          const response = await fetch(url, {
            cache: 'no-store',
            credentials: 'same-origin',
            signal: controller.signal
          });
          const body = await response.text();
          const elapsed = Math.round(performance.now() - started);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          if (!body.length) throw new Error('Tom respons');
          return { file, ok: true, status: response.status, bytes: body.length, elapsed };
        } catch (error) {
          const elapsed = Math.round(performance.now() - started);
          const timedOut = error && error.name === 'AbortError';
          return { file, ok: false, elapsed, error: timedOut ? `TIMEOUT etter ${TIMEOUT_MS / 1000} s` : String(error) };
        } finally {
          clearTimeout(timer);
        }
      }

      async function run() {
        rerunButton.disabled = true;
        resultsNode.replaceChildren();
        reportNode.textContent = 'Testen kjører …';
        overallNode.innerHTML = '<span class="status wait">Tester oppstartsfiler …</span>';
        const runId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const worker = await inspectWorker();
        const output = [];

        for (const file of FILES) renderRow(file, 'wait', 'Venter …');

        for (let index = 0; index < FILES.length; index += 4) {
          const group = FILES.slice(index, index + 4);
          const groupResults = await Promise.all(group.map(file => checkFile(file, runId)));
          output.push(...groupResults);
          groupResults.forEach(result => {
            const oldRow = resultsNode.querySelector(`[data-file="${CSS.escape(result.file)}"]`);
            const message = result.ok
              ? `OK · HTTP ${result.status} · ${result.bytes} tegn · ${result.elapsed} ms`
              : `${result.error} · ${result.elapsed} ms`;
            const replacement = renderRow(result.file, result.ok ? 'ok' : 'bad', message);
            resultsNode.insertBefore(replacement, oldRow);
            oldRow.remove();
          });
        }

        const failures = output.filter(item => !item.ok);
        overallNode.innerHTML = failures.length
          ? `<span class="status bad">${failures.length} fil(er) feilet. Resultatet under viser hvilke.</span>`
          : '<span class="status ok">Alle oppstartsfiler svarte.</span>';

        const lines = [
          'HverdagsOss oppstartsdiagnose',
          `tid=${now()}`,
          `url=${location.href}`,
          `userAgent=${navigator.userAgent}`,
          `online=${navigator.onLine}`,
          `serviceWorker=${worker}`,
          '',
          ...output.map(item => item.ok
            ? `OK ${item.file} HTTP=${item.status} bytes=${item.bytes} tid=${item.elapsed}ms`
            : `FEIL ${item.file} ${item.error} tid=${item.elapsed}ms`)
        ];
        lastReport = lines.join('\n');
        reportNode.textContent = lastReport;
        rerunButton.disabled = false;
      }

      rerunButton.addEventListener('click', run);
      copyButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(lastReport);
          copyButton.textContent = 'Kopiert';
        } catch (_) {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(reportNode);
          selection.removeAllRanges();
          selection.addRange(range);
          copyButton.textContent = 'Resultatet er markert';
        }
        setTimeout(() => { copyButton.textContent = 'Kopier resultat'; }, 1800);
      });

      run();
    })();
  </script>
</body>
</html>
