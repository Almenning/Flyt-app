<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e87961">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flyt">
<link rel="manifest" href="./manifest.webmanifest">
<title>Flyt for to</title>
<style>
:root{--bg:#fff6f0;--paper:#fffdfa;--ink:#432d27;--muted:#806b63;--line:#ead8d0;--accent:#e87961;--deep:#af493b;--peach:#f8d1bd;--rose:#f6dde0;--sage:#e8efe3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,#efb99d,#fff1e8 60%,#e9aa87)}button,input{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#efb99d,#fff1e8 60%,#e9aa87)}.login{width:min(100%,390px);padding:30px 24px;border-radius:28px;background:#fffaf6f4;box-shadow:0 25px 75px #5d2e1f44;text-align:center}.logo{font:700 44px Georgia}.logo b{color:var(--accent)}.login h1{font:500 30px Georgia;margin:12px 0 6px}.login p{color:var(--muted)}#pin{width:100%;height:58px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:center;font-size:26px;font-weight:800;letter-spacing:.25em;padding-left:.25em}.primary{border:0;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--deep));color:#fff;font-weight:900;min-height:50px;padding:12px 16px}.full{width:100%}.err{min-height:20px;color:#a63c31;font-size:13px;font-weight:800}.remember{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;color:var(--muted);font-size:13px}
.app{width:100%;height:100vh;height:100dvh;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.top{padding:max(12px,env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#fffaf7ef}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:850}.content{overflow:auto;padding:18px 15px 34px;background:radial-gradient(circle at 95% 0,#f8d1bd88,transparent 30%),linear-gradient(#fffaf7,#fff4ed)}.ey{font-size:11px;color:var(--deep);font-weight:900;letter-spacing:.13em;text-transform:uppercase}.title{font:500 34px/1.05 Georgia;margin:8px 0}.sub{color:var(--muted);line-height:1.45}.card{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:20px;background:#ffffffdf;box-shadow:0 10px 28px #67351d14}.hero{background:linear-gradient(145deg,var(--peach),#fff0e7)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.tag{padding:6px 9px;border-radius:999px;background:#fee5d6;color:#99502f;font-size:12px;font-weight:900}.action{width:100%;min-height:68px;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;gap:11px;text-align:left}.action.hot{background:linear-gradient(145deg,#fee4d4,#f8c5ad)}.action.rose{background:linear-gradient(145deg,#fff8f7,var(--rose))}.action.green{background:linear-gradient(145deg,#fbfcfa,var(--sage))}.ico{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:21px}.small{border:0;border-radius:999px;padding:10px 13px;background:#e8796118;color:var(--deep);font-size:12px;font-weight:900}.nav{display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fffaf7f0}.nav button{border:0;background:none;color:#8a746c;min-height:52px;font-size:10px;font-weight:800}.nav b{display:block;font-size:20px}.nav button.on{color:var(--deep)}.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.segments button{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--muted);font-weight:800}.segments button.on{border-color:var(--accent);background:#fff0e8;color:var(--deep)}.needgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.need{position:relative;min-height:58px;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:850}.need.on{border-color:var(--accent);background:#fff0e8}.need.on:after{content:'✓';position:absolute;top:6px;right:8px;background:var(--accent);color:#fff;border-radius:50%;width:19px;height:19px;display:grid;place-items:center;font-size:11px}.reward{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:20px;height:20px;accent-color:var(--accent)}.progress{height:8px;border-radius:999px;background:#eee3de;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--accent)}.field{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;margin:6px 0}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3d2925ee;color:#fff;padding:12px 14px;border-radius:13px;width:min(390px,calc(100% - 28px));z-index:40}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 8px}@media(min-width:700px){body{display:grid;place-items:center;padding:20px}.app{width:420px;height:min(880px,calc(100dvh - 40px));border:7px solid #211816;border-radius:38px}}
</style>
</head>
<body>
<div id="gate">
  <div class="login">
    <div class="logo">fl<b>y</b>t</div>
    <div class="ey">Privat pilot</div>
    <h1>Flyt for to</h1>
    <p>Mer initiativ. Mindre masing. Mer flyt.</p>
    <form id="loginForm">
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
      <label class="remember"><input id="remember" type="checkbox" checked> Husk meg på denne enheten</label>
      <button class="primary full" type="submit">Åpne Flyt</button>
      <div id="loginError" class="err"></div>
    </form>
  </div>
</div>
<div class="app">
  <header class="top"><button id="switchUser" class="pill">Tore + Jannicke ▾</button><button id="lock" class="pill">Lås</button></header>
  <main id="content" class="content"></main>
  <nav id="nav" class="nav">
    <button data-view="home" class="on"><b>⌂</b>Hjem</button>
    <button data-view="tasks"><b>✓</b>Gjøre</button>
    <button data-view="seen"><b>◉</b>Sett</button>
    <button data-view="rewards"><b>♡</b>Fristelser</button>
    <button data-view="us"><b>☺</b>Oss</button>
  </nav>
</div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
const PIN='427816',AUTH='flyt_auth_v3',DATA='flyt_state_v3';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({user:'Tore',view:'home',house:112,points:{Tore:130,Jannicke:210},status:{Tore:{energy:'high',capacity:'med',closeness:'high',desire:'high',stress:'low',needs:['sex']},Jannicke:{energy:'low',capacity:'low',closeness:'med',desire:'low',stress:'high',needs:['relief','closeness']}},tasks:[{id:1,title:'Ta kjøkkenet',pts:45,mins:8,target:'Tore',done:false},{id:2,title:'Vask badet',pts:70,mins:15,target:'Jannicke',done:false}],work:[{id:1,title:'Bestilte tannlegetime',by:'Jannicke',seen:false},{id:2,title:'Handlet inn til middag',by:'Tore',seen:true}],rewards:[{id:1,title:'20 min massasje',by:'Jannicke',requiresPoints:true,cost:250},{id:2,title:'Favorittbakst',by:'Jannicke',requiresPoints:true,cost:180},{id:3,title:'Sovemorgen',by:'Tore',requiresPoints:false,cost:0}]});
let state;try{state=JSON.parse(localStorage.getItem(DATA))||fresh()}catch(e){state=fresh()}
const save=()=>localStorage.setItem(DATA,JSON.stringify(state));const partner=()=>state.user==='Tore'?'Jannicke':'Tore';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)};
function unlock(){try{return localStorage.getItem(AUTH)==='1'||sessionStorage.getItem(AUTH)==='1'}catch(e){return false}}
function openApp(){document.getElementById('gate').classList.add('hidden')}
if(unlock())openApp();
$('#pin').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);$('#loginError').textContent=''});
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#pin').value.replace(/\D/g,'');if(v!==PIN){$('#loginError').textContent='Feil kode. Prøv 427816.';return}try{($('#remember').checked?localStorage:sessionStorage).setItem(AUTH,'1')}catch(x){}openApp();render()});
$('#lock').onclick=()=>{try{localStorage.removeItem(AUTH);sessionStorage.removeItem(AUTH)}catch(e){}$('#gate').classList.remove('hidden');$('#pin').value='';setTimeout(()=>$('#pin').focus(),100)};
$('#switchUser').onclick=()=>{state.user=partner();save();render();toast('Du ser Flyt som '+state.user)};
const levels=['low','med','high'],labels={low:'Lav',med:'Middels',high:'Høy'};
function statusRow(key,label){const v=state.status[state.user][key];return `<div class="card"><strong>${label}</strong><div class="segments">${levels.map(x=>`<button data-level="${key}" data-value="${x}" class="${v===x?'on':''}">${labels[x]}</button>`).join('')}</div></div>`}
function home(){const p=partner(),s=state.status[p];return `<div class="ey">Flyt akkurat nå</div><h1 class="title">God kveld, ${state.user}</h1><p class="sub">Hva gir mest verdi akkurat nå?</p><div class="card hero"><div class="row"><div class="grow"><strong>Huset ${state.house}%</strong><p>${state.house-100}% foran planen. Det ekstra dere gjør i dag kjøper ro senere.</p></div><span class="tag">Flyt</span></div></div><button class="action hot" data-go="tasks"><span class="ico">⚡</span><span><strong>Gjør noe</strong><small>Kjøkkenet tar ca. 8 min · +45 poeng</small></span></button><button class="action rose" data-go="rewards"><span class="ico">🔥</span><span><strong>Tjen mot en fristelse</strong><small>Se hva ${p} har lagt ut</small></span></button><button class="action green" data-go="us"><span class="ico">❤️</span><span><strong>Gjør ${p} glad</strong><small>${p} har ${labels[s.energy].toLowerCase()} energi og ønsker ${s.needs.length?s.needs.map(needLabel).join(', '):'ingen bestemt hjelp'}.</small></span></button>`}
function tasks(){const list=state.tasks.filter(t=>!t.done&&t.target===state.user);return `<div class="ey">Små handlinger</div><h1 class="title">Hva kan du ta nå?</h1><p class="sub">Ingen ordre. Bare tydelige muligheter.</p>${list.map(t=>`<div class="card row"><div class="ico">✓</div><div class="grow"><strong>${esc(t.title)}</strong><p>${t.mins} min · +${t.pts} poeng</p></div><button class="small" data-done="${t.id}">Ferdig</button></div>`).join('')||'<div class="card">Alt under kontroll akkurat nå.</div>'}<button id="addTask" class="primary full">+ Send oppgave til ${partner()}</button>`}
function seen(){return `<div class="ey">Usynlig arbeid</div><h1 class="title">Se det som ellers forsvinner</h1><p class="sub">Begge ser hele sin egen innsats, men bare deler av den andres.</p>${state.work.map(w=>`<div class="card row"><div class="ico">${w.by[0]}</div><div class="grow"><strong>${esc(w.title)}</strong><p>${w.by}</p></div>${w.by!==state.user&&!w.seen?`<button class="small" data-seen="${w.id}">Jeg så det</button>`:(w.seen?'<span class="tag">Sett ✓</span>':'')}</div>`).join('')}<button id="addWork" class="primary full">+ Legg til bidrag</button>`}
function rewards(){const offered=state.rewards.filter(r=>r.by===partner());const mine=state.rewards.filter(r=>r.by===state.user);return `<div class="ey">Fristelser</div><h1 class="title">Noe å glede seg til</h1><p class="sub">Invitasjon, aldri krav.</p><div class="card row"><div class="grow"><strong>${state.user}</strong></div><span class="tag">${state.points[state.user]} poeng</span></div><div class="section"><h2>Fra ${partner()}</h2>${offered.map(rewardCard).join('')||'<div class="card">Ingen fristelser ennå.</div>'}</div><div class="section"><h2>Mine tilbud</h2>${mine.map(rewardOwner).join('')}</div><button id="addReward" class="primary full">+ Lag fristelse</button>`}
function rewardCard(r){const bal=state.points[state.user],open=!r.requiresPoints||bal>=r.cost,pct=r.requiresPoints?Math.min(100,Math.round(bal/r.cost*100)):100;return `<div class="card"><div class="reward"><div><strong>${esc(r.title)}</strong><p>${r.requiresPoints?r.cost+' poeng':'Åpen fristelse'}</p></div><button class="small" data-claim="${r.id}" ${open?'':'disabled'}>${open?'Aktiver':'Låst'}</button></div>${r.requiresPoints?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}</div>`}
function rewardOwner(r){return `<div class="card"><div class="reward"><div><strong>${esc(r.title)}</strong><p>${r.requiresPoints?r.cost+' poeng':'Åpen uten poeng'}</p></div><label class="toggle"><input type="checkbox" data-lock="${r.id}" ${r.requiresPoints?'checked':''}> Poeng</label></div>${r.requiresPoints?`<input class="field" type="number" min="1" value="${r.cost}" data-cost="${r.id}" aria-label="Poengkrav">`:''}</div>`}
function us(){const s=state.status[state.user];const needs=['relief','closeness','sex','alone','initiative','quiet'];return `<div class="ey">Dagsform</div><h1 class="title">Hvordan har ${state.user} det?</h1><p class="sub">Forventningsavklaring, ikke kontrakt.</p>${statusRow('energy','Energi')}${statusRow('capacity','Overskudd')}${statusRow('closeness','Nærhet')}${statusRow('desire','Sexlyst')}${statusRow('stress','Stress')}<div class="section"><h2>Hva trenger du akkurat nå?</h2><div class="needgrid">${needs.map(n=>`<button class="need ${s.needs.includes(n)?'on':''}" data-need="${n}">${needIcon(n)} ${needLabel(n)}</button>`).join('')}</div></div>`}
function needLabel(n){return({relief:'avlastning',closeness:'nærhet',sex:'sex',alone:'alenetid',initiative:'initiativ',quiet:'ro'})[n]||n}function needIcon(n){return({relief:'💛',closeness:'💗',sex:'🔥',alone:'🌿',initiative:'⚡',quiet:'🌙'})[n]||'•'}
function render(){const views={home,tasks,seen,rewards,us};$('#content').innerHTML=views[state.view]();$('#switchUser').textContent=state.user+' + '+partner()+' ▾';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}
$('#nav').onclick=e=>{const b=e.target.closest('button[data-view]');if(!b)return;state.view=b.dataset.view;save();render()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){state.view=b.dataset.go;save();render()}if(b.dataset.done){const t=state.tasks.find(x=>x.id==b.dataset.done);if(t){t.done=true;state.points[state.user]+=t.pts;state.house=Math.min(150,state.house+4);state.work.unshift({id:Date.now(),title:t.title,by:state.user,seen:false});save();render();toast('+'+t.pts+' poeng')}}if(b.dataset.seen){const w=state.work.find(x=>x.id==b.dataset.seen);if(w){w.seen=true;save();render();toast('Det ble lagt merke til ❤️')}}if(b.dataset.claim){const r=state.rewards.find(x=>x.id==b.dataset.claim);if(r&&(!r.requiresPoints||state.points[state.user]>=r.cost)){if(r.requiresPoints)state.points[state.user]-=r.cost;save();render();toast('Fristelsen er aktivert')}}if(b.dataset.level){state.status[state.user][b.dataset.level]=b.dataset.value;save();render()}if(b.dataset.need){const a=state.status[state.user].needs,n=b.dataset.need,i=a.indexOf(n);i>=0?a.splice(i,1):a.push(n);save();render()}if(b.id==='addTask'){const title=prompt('Hva ønsker du at '+partner()+' skal gjøre?');if(title){const pts=Number(prompt('Hvor mange poeng?',45))||45;state.tasks.unshift({id:Date.now(),title,pts,mins:10,target:partner(),done:false});save();render()}}if(b.id==='addWork'){const title=prompt('Hva gjorde du?');if(title){state.work.unshift({id:Date.now(),title,by:state.user,seen:false});save();render()}}if(b.id==='addReward'){const title=prompt('Hva vil du tilby '+partner()+'?');if(title){const req=confirm('Skal fristelsen kreve poeng?');const cost=req?(Number(prompt('Hvor mange poeng?',250))||250):0;state.rewards.unshift({id:Date.now(),title,by:state.user,requiresPoints:req,cost});save();render()}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.lock){const r=state.rewards.find(x=>x.id==el.dataset.lock);r.requiresPoints=el.checked;if(el.checked&&!r.cost)r.cost=250;save();render()}if(el.dataset.cost){const r=state.rewards.find(x=>x.id==el.dataset.cost);r.cost=Math.max(1,Number(el.value)||1);save();toast('Poengkravet er lagret')}});
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
