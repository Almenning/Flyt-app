<style>

font-weight:900}.action{width:100%;min-height:68px;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;align-items:center;gap:11px;text-align:left}.action.hot{background:linear-gradient(145deg,#fee4d4,#f8c5ad)}.action.green{background:linear-gradient(145deg,#fbfcfa,var(--sage))}.ico{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:21px}.nav{display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fffaf7f0}.nav button{border:0;background:none;color:#8a746c;min-height:52px;font-size:10px;font-weight:800}.nav b{display:block;font-size:20px}.nav button.on{color:var(--deep)}.progress{height:10px;border-radius:999px;background:#eee3de;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.segments{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.segments button{min-height:43px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--muted);font-weight:800}.segments button.on{border-color:var(--accent);background:#fff0e8;color:var(--deep)}.need{position:relative;min-height:56px;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:850}.need.on{border-color:var(--accent);background:#fff0e8}.need.on:after{content:'✓';position:absolute;top:6px;right:8px;background:var(--accent);color:#fff;border-radius:50%;width:19px;height:19px;display:grid;place-items:center;font-size:11px}.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 11px;margin:5px 0}.label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{padding:12px 8px;text-align:center;border-radius:15px;background:#fff;border:1px solid var(--line)}.stat b{display:block;font-size:20px}.taskmeta{font-size:12px;color:var(--muted)}.setup{position:fixed;inset:0;z-index:60;background:#fff7f1;display:grid;grid-template-rows:auto 1fr auto}.setupHead{padding:max(14px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);background:#fff}.setupBody{overflow:auto;padding:18px 15px}.setupFoot{padding:10px 15px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;display:flex;gap:8px}.stepdots{display:flex;gap:6px}.stepdots i{width:8px;height:8px;border-radius:50%;background:#ead8d0}.stepdots i.on{background:var(--accent)}.template{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff;margin:8px 0}.template input{margin-top:4px;transform:scale(1.25);accent-color:var(--accent)}.config{padding:12px;border-radius:14px;background:#fff9f5;border:1px solid #f0ddd3;margin-top:8px}.config .grid2{grid-template-columns:1fr 1fr}.mini{font-size:11px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3d2925ee;color:#fff;padding:12px 14px;border-radius:13px;width:min(390px,calc(100% - 28px));z-index:80}.login{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#efb99d,#fff1e8 60%,#e9aa87)}.loginbox{width:min(100%,390px);padding:30px 24px;border-radius:28px;background:#fffaf6f4;box-shadow:0 25px 75px #5d2e1f44;text-align:center}.logo{font:700 44px Georgia}.logo b{color:var(--accent)}#pin{width:100%;height:58px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:center;font-size:26px;font-weight:800;letter-spacing:.25em;padding-left:.25em}.section{margin-top:22px}.muted{color:var(--muted)}@media(min-width:700px){body{display:grid;place-items:center;padding:20px}.app{width:420px;height:min(880px,calc(100dvh - 40px));border:7px solid #211816;border-radius:38px}.setup{width:420px;height:min(880px,calc(100dvh - 40px));inset:auto;border:7px solid #211816;border-radius:38px;overflow:hidden}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo">fl<b>y</b>t</div><div class="ey">Privat pilot · v0.2</div><h1 style="font:500 30px Georgia">Flyt for to</h1><p class="muted">Mer initiativ. Mindre masing. Mer flyt.</p><form id="loginForm"><input id="pin" inputmode="numeric" maxlength="6" placeholder="••••••"><label style="display:block;margin:14px 0;color:var(--muted)"><input id="remember" type="checkbox" checked> Husk meg</label><button class="primary full">Åpne Flyt</button><div id="err" style="min-height:20px;color:#a63c31;font-weight:800;font-size:13px"></div></form></div></div>
<div class="app"><header class="top"><button id="switchUser" class="pill">Tore + Jannicke ▾</button><div style="display:flex;gap:7px"><button id="setupBtn" class="pill">Oppsett</button><button id="lock" class="pill">Lås</button></div></header><main id="content" class="content"></main><nav id="nav" class="nav"><button data-view="home" class="on"><b>⌂</b>Hjem</button><button data-view="tasks"><b>✓</b>Gjøre</button><button data-view="seen"><b>◉</b>Sett</button><button data-view="rewards"><b>♡</b>Fristelser</button><button data-view="us"><b>☺</b>Oss</button></nav></div>
<div id="setup" class="setup hidden"><div class="setupHead"><div class="row"><div class="grow"><div class="ey">Husholdningsoppsett</div><strong id="setupTitle">Hva betyr noe for dere?</strong></div><div class="stepdots"><i></i><i></i><i></i></div></div></div><div id="setupBody" class="setupBody"></div><div class="setupFoot"><button id="setupBack" class="secondary grow">Tilbake</button><button id="setupNext" class="primary grow">Neste</button></div></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
const PIN='427816',AUTH='flyt_auth_v4',KEY='flyt_state_v4';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIB=[
{id:'dish',cat:'Kjøkken',name:'Tømme/fylle oppvaskmaskin',freq:7,pts:20,type:'daily',kind:'house'},{id:'kitchen',cat:'Kjøkken',name:'Rydde kjøkken',freq:7,pts:25,type:'daily',kind:'house'},{id:'dinner',cat:'Kjøkken',name:'Lage middag',freq:5,pts:40,type:'daily',kind:'house'},{id:'shop',cat:'Kjøkken',name:'Handle mat',freq:2,pts:45,type:'flex',kind:'house'},
{id:'lunch',cat:'Barn',name:'Lage matpakker',freq:5,pts:25,type:'daily',kind:'house'},{id:'bag',cat:'Barn',name:'Tømme/pakke barnas sekk',freq:5,pts:15,type:'daily',kind:'house'},{id:'bedkids',cat:'Barn',name:'Legging',freq:7,pts:35,type:'daily',kind:'house'},{id:'school',cat:'Barn',name:'Skole/barnehage-kommunikasjon',freq:2,pts:25,type:'flex',kind:'house'},
{id:'bath',cat:'Hus',name:'Vaske bad',freq:1,pts:70,type:'flex',kind:'house'},{id:'vacuum',cat:'Hus',name:'Støvsuge',freq:2,pts:50,type:'flex',kind:'house'},{id:'bed',cat:'Hus',name:'Bytte sengetøy',freq:1,pts:60,type:'flex',kind:'house'},{id:'laundry',cat:'Hus',name:'Vaske/brette klær',freq:3,pts:45,type:'flex',kind:'house'},{id:'trash',cat:'Hus',name:'Søppel/pant',freq:2,pts:25,type:'flex',kind:'house'},
{id:'admin',cat:'Usynlig arbeid',name:'Avtaler, lege og tannlege',freq:1,pts:40,type:'period',kind:'house'},{id:'gifts',cat:'Usynlig arbeid',name:'Gaver og bursdager',freq:1,pts:35,type:'period',kind:'house'},
{id:'train',cat:'Personlig investering',name:'Trening',freq:3,pts:40,type:'flex',kind:'personal'}];
const fresh=()=>({version:2,user:'Tore',view:'home',setupDone:false,setupStep:0,areas:{home:true,children:true,mental:true,training:true,closeness:true,sex:true},trainingFor:{Tore:true,Jannicke:true},tasks:LIB.filter(x=>['dish','kitchen','dinner','lunch','bag','bath','bed','laundry','trash','train'].includes(x.id)).map(x=>({...x,owner:'Begge'})),custom:[],completions:[],points:{Tore:0,Jannicke:0},status:{Tore:{energy:'med',capacity:'med',closeness:'med',desire:'med',stress:'med',needs:[]},Jannicke:{energy:'med',capacity:'med',closeness:'med',desire:'med',stress:'med',needs:[]}},work:[],rewards:[{id:1,title:'20 min massasje',by:'Jannicke',requiresPoints:true,cost:250},{id:2,title:'Sovemorgen',by:'Tore',requiresPoints:true,cost:350}]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}const save=()=>localStorage.setItem(KEY,JSON.stringify(state)),partner=()=>state.user==='Tore'?'Jannicke':'Tore';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}function authed(){try{return localStorage.getItem(AUTH)==='1'||sessionStorage.getItem(AUTH)==='1'}catch(e){return false}}function openApp(){ $('#login').classList.add('hidden'); if(!state.setupDone)openSetup(0)}if(authed())openApp();
$('#loginForm').onsubmit=e=>{e.preventDefault();const v=$('#pin').value.replace(/\D/g,'');if(v!==PIN){$('#err').textContent='Feil kode.';return}try{($('#remember').checked?localStorage:sessionStorage).setItem(AUTH,'1')}catch(x){}openApp();render()};$('#pin').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);$('#lock').onclick=()=>{localStorage.removeItem(AUTH);sessionStorage.removeItem(AUTH);$('#login').classList.remove('hidden')};$('#switchUser').onclick=()=>{state.user=partner();save();render();toast('Du ser Flyt som '+state.user)};$('#setupBtn').onclick=()=>openSetup(0);
const weekStart=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x},iso=d=>new Date(d).toISOString().slice(0,10),today=()=>iso(new Date());
function weekComps(){const s=weekStart(new Date());return state.completions.filter(c=>new Date(c.date)>=s)}function totalWeekly(){return state.tasks.filter(t=>t.kind==='house').reduce((a,t)=>a+t.freq*t.pts,0)}function doneWeekly(){return weekComps().filter(c=>c.kind==='house').reduce((a,c)=>a+c.housePts,0)}function weekPct(){const t=totalWeekly();return t?Math.round(doneWeekly()/t*700):0}function expectedPct(){const now=new Date(),day=((now.getDay()+6)%7)+1;return day*100}function todayPct(){const t=totalWeekly()/7||1;return Math.round(state.completions.filter(c=>c.date===today()&&c.kind==='house').reduce((a,c)=>a+c.housePts,0)/t*100)}function countTaskWeek(id){return weekComps().filter(c=>c.taskId===id).length}
function home(){const wp=weekPct(),exp=expectedPct(),delta=wp-exp,dp=todayPct(),tot=totalWeekly();return `<div class="ey">Husholdningsmotor</div><h1 class="title">God kveld, ${state.user}</h1><p class="sub">Flyt regner på det dere faktisk har bestemt at hjemmet trenger.</p><div class="card hero"><div class="row"><div class="grow"><strong>Ukebanken</strong><p>${delta>=0?`Dere ligger ${delta}% foran ukerytmen.`:`Dere ligger ${Math.abs(delta)}% bak ukerytmen.`}</p></div><span class="tag">${wp}/700%</span></div><div class="progress"><i style="width:${Math.min(100,wp/7)}%"></i></div></div><div class="stat"><div><b>${dp}%</b><span>I dag</span></div><div><b>${wp}%</b><span>Denne uken</span></div><div><b>${tot}</b><span>ukepoeng</span></div></div><button class="action hot" data-go="tasks"><span class="ico">⚡</span><span><strong>Gjør noe nå</strong><small>Ta en oppgave og flytt ukebanken.</small></span></button><button class="action green" data-open-setup="1"><span class="ico">⚙️</span><span><strong>Juster husholdningen</strong><small>Oppgaver, frekvens, poeng og ansvar.</small></span></button>`}
function tasks(){const rows=state.tasks.map(t=>{const n=countTaskWeek(t.id),left=Math.max(0,t.freq-n),done=left===0;return `<div class="card"><div class="row"><div class="grow"><strong>${esc(t.name)}</strong><div class="taskmeta">${t.cat} · ${t.owner} · ${t.type==='daily'?'dagsbundet':t.type==='flex'?'fleksibel':'periodebundet'}</div><div class="taskmeta">${n}/${t.freq} denne uken · ${t.pts} poeng hver</div></div>${done?'<span class="tag">Ferdig ✓</span>':`<button class="small" data-complete="${t.id}">+ Gjort</button>`}</div></div>`}).join('');return `<div class="ey">Gjøremål</div><h1 class="title">Denne uken</h1><p class="sub">Fleksible oppgaver kan tas tidlig. Dagsbundne ting kommer når livet faktisk skjer.</p>${rows}<button class="primary full" data-open-setup="1">Rediger oppsett</button>`}
function seen(){return `<div class="ey">Usynlig arbeid</div><h1 class="title">Se det som ellers ikke blir sett</h1><p class="sub">Registrer planlegging og småting som ellers forsvinner.</p>${state.work.map(w=>`<div class="card row"><div class="grow"><strong>${esc(w.title)}</strong><div class="taskmeta">${w.by}</div></div>${w.by!==state.user&&!w.seen?`<button class="small" data-seen="${w.id}">Jeg så det</button>`:'<span class="tag">Sett</span>'}</div>`).join('')||'<div class="card">Ingen registrerte bidrag ennå.</div>'}<button id="addWork" class="primary full">+ Legg til bidrag</button>`}
function rewards(){const offered=state.rewards.filter(r=>r.by===partner()),mine=state.rewards.filter(r=>r.by===state.user);return `<div class="ey">Fristelser</div><h1 class="title">Noe å glede seg til</h1><div class="card row"><strong class="grow">${state.user}</strong><span class="tag">${state.points[state.user]} poeng</span></div><div class="section"><strong>Fra ${partner()}</strong>${offered.map(r=>`<div class="card row"><div class="grow"><strong>${esc(r.title)}</strong><div class="taskmeta">${r.requiresPoints?r.cost+' poeng':'Åpen'}</div></div><button class="small" ${r.requiresPoints&&state.points[state.user]<r.cost?'disabled':''} data-claim="${r.id}">${r.requiresPoints&&state.points[state.user]<r.cost?'Låst':'Aktiver'}</button></div>`).join('')}</div><div class="section"><strong>Mine tilbud</strong>${mine.map(r=>`<div class="card"><strong>${esc(r.title)}</strong><div class="grid2"><label><span class="label">Krever poeng</span><select class="field" data-rlock="${r.id}"><option value="1" ${r.requiresPoints?'selected':''}>Ja</option><option value="0" ${!r.requiresPoints?'selected':''}>Nei</option></select></label><label><span class="label">Poeng</span><input class="field" data-rcost="${r.id}" type="number" value="${r.cost}" ${!r.requiresPoints?'disabled':''}></label></div></div>`).join('')}</div><button id="addReward" class="primary full">+ Lag fristelse</button>`}
const levels=['low','med','high'],lab={low:'Lav',med:'Middels',high:'Høy'};function statRow(k,n){const v=state.status[state.user][k];return `<div class="card"><strong>${n}</strong><div class="segments">${levels.map(x=>`<button data-level="${k}" data-value="${x}" class="${v===x?'on':''}">${lab[x]}</button>`).join('')}</div></div>`}function us(){const s=state.status[state.user],needs=[['relief','💛 Avlastning'],['closeness','💗 Nærhet'],['sex','🔥 Sex'],['alone','🌿 Alenetid'],['initiative','⚡ Initiativ'],['quiet','🌙 Ro']];return `<div class="ey">Dagsform</div><h1 class="title">Hvordan har ${state.user} det?</h1><p class="sub">Forventningsavklaring, ikke kontrakt.</p>${statRow('energy','Energi')}${statRow('capacity','Overskudd')}${statRow('closeness','Nærhet')}${statRow('desire','Sexlyst')}${statRow('stress','Stress')}<div class="section"><strong>Hva trenger du akkurat nå?</strong><div class="grid2" style="margin-top:8px">${needs.map(([k,n])=>`<button class="need ${s.needs.includes(k)?'on':''}" data-need="${k}">${n}</button>`).join('')}</div></div>`}
function render(){const views={home,tasks,seen,rewards,us};$('#content').innerHTML=views[state.view]();$('#switchUser').textContent=state.user+' + '+partner()+' ▾';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view))}
$('#nav').onclick=e=>{const b=e.target.closest('button[data-view]');if(!b)return;state.view=b.dataset.view;save();render()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){state.view=b.dataset.go;save();render()}if(b.dataset.openSetup)openSetup(0);if(b.dataset.complete){const t=state.tasks.find(x=>x.id===b.dataset.complete);if(!t||countTaskWeek(t.id)>=t.freq)return;const housePts=t.kind==='house'?t.pts:Math.round(t.pts*.2),personal=t.pts;state.completions.push({id:Date.now(),taskId:t.id,date:today(),by:state.user,kind:t.kind,housePts,personalPts:personal});state.points[state.user]+=personal;state.work.unshift({id:Date.now()+1,title:t.name,by:state.user,seen:false});save();render();toast(`+${personal} poeng · ${t.kind==='house'?'+husflyt':'personlig investering'}`)}if(b.dataset.seen){const w=state.work.find(x=>x.id==b.dataset.seen);if(w){w.seen=true;save();render();toast('Det ble lagt merke til ❤️')}}if(b.dataset.claim){const r=state.rewards.find(x=>x.id==b.dataset.claim);if(r&&(!r.requiresPoints||state.points[state.user]>=r.cost)){if(r.requiresPoints)state.points[state.user]-=r.cost;save();render();toast('Fristelsen er aktivert')}}if(b.dataset.level){state.status[state.user][b.dataset.level]=b.dataset.value;save();render()}if(b.dataset.need){const a=state.status[state.user].needs,k=b.dataset.need,i=a.indexOf(k);i>=0?a.splice(i,1):a.push(k);save();render()}if(b.id==='addWork'){const t=prompt('Hva gjorde du?');if(t){state.work.unshift({id:Date.now(),title:t,by:state.user,seen:false});save();render()}}if(b.id==='addReward'){const t=prompt('Hva vil du tilby '+partner()+'?');if(t){const req=confirm('Skal den kreve poeng?'),cost=req?(Number(prompt('Hvor mange poeng?',250))||250):0;state.rewards.unshift({id:Date.now(),title:t,by:state.user,requiresPoints:req,cost});save();render()}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.rlock){const r=state.rewards.find(x=>x.id==el.dataset.rlock);r.requiresPoints=el.value==='1';if(r.requiresPoints&&!r.cost)r.cost=250;save();render()}if(el.dataset.rcost){const r=state.rewards.find(x=>x.id==el.dataset.rcost);r.cost=Math.max(1,Number(el.value)||1);save()}});
let step=0;function openSetup(s){step=s;$('#setup').classList.remove('hidden');renderSetup()}function closeSetup(){state.setupDone=true;save();$('#setup').classList.add('hidden');render()}function renderSetup(){document.querySelectorAll('.stepdots i').forEach((x,i)=>x.classList.toggle('on',i===step));$('#setupBack').style.visibility=step===0?'hidden':'visible';$('#setupNext').textContent=step===2?'Start Flyt':'Neste';const body=$('#setupBody');if(step===0){$('#setupTitle').textContent='Hva er viktig for dere?';body.innerHTML=`<h1 class="title">Hva skal Flyt hjelpe med?</h1><p class="sub">Velg områder dere faktisk vil investere i.</p><div class="grid2">${[['home','🏠 Hjem'],['children','👨‍👩‍👧 Barn'],['mental','🧠 Mental load'],['training','🏃 Trening'],['closeness','❤️ Nærhet'],['sex','🔥 Sexliv']].map(([k,n])=>`<button class="need ${state.areas[k]?'on':''}" data-area="${k}">${n}</button>`).join('')}</div><div class="card"><strong>Hvem er trening viktig for?</strong><div class="grid2" style="margin-top:8px"><button class="need ${state.trainingFor.Tore?'on':''}" data-train="Tore">Tore</button><button class="need ${state.trainingFor.Jannicke?'on':''}" data-train="Jannicke">Jannicke</button></div></div>`}else if(step===1){$('#setupTitle').textContent='Bygg husholdningen';const cats=[...new Set(LIB.map(x=>x.cat))];body.innerHTML=`<h1 class="title">Hva gjør dere i løpet av en uke?</h1><p class="sub">Velg standardoppgaver. Juster antall, poeng og ansvar. Du kan gjøre dette om senere.</p>${cats.map(cat=>`<div class="section"><strong>${cat}</strong>${LIB.filter(x=>x.cat===cat).map(t=>templateRow(t)).join('')}</div>`).join('')}<button id="customTask" class="secondary full" style="margin-top:14px">+ Egendefinert oppgave</button>${state.custom.map(t=>templateRow(t)).join('')}`;bindSetupInputs()}else{$('#setupTitle').textContent='Slik blir Flyt';const total=totalWeekly(),personal=state.tasks.filter(t=>t.kind==='personal').reduce((a,t)=>a+t.freq*t.pts,0);body.innerHTML=`<h1 class="title">Dette er deres uke</h1><p class="sub">Flyt gjør totalen om til 700 %, altså et gjennomsnitt på 100 % per dag.</p><div class="card hero"><div class="stat"><div><b>${state.tasks.filter(t=>t.kind==='house').length}</b><span>husoppgaver</span></div><div><b>${total}</b><span>huspoeng</span></div><div><b>${Math.round(total/7)}</b><span>dagssnitt</span></div></div></div><div class="card"><strong>Personlig investering</strong><p>${personal} mulige personlige poeng per uke. Trening gir bare en liten felles bonus, så ingen kan jogge seg fri fra badet.</p></div><div class="card"><strong>Prinsippet</strong><p>Gjør dere mer enn dagsnittet, bygger dere opp ukebanken. Fleksible oppgaver kan tas tidlig. Dagsbundne oppgaver må fortsatt skje når de hører hjemme.</p></div>`}}
function templateRow(t){const sel=state.tasks.find(x=>x.id===t.id);return `<div class="template"><input type="checkbox" data-taskcheck="${t.id}" ${sel?'checked':''}><div class="grow"><strong>${esc(t.name)}</strong><div class="mini">${t.kind==='personal'?'Personlig investering':t.type==='daily'?'Dagsbundet':t.type==='flex'?'Fleksibel':'Periodebundet'}</div>${sel?`<div class="config"><div class="grid2"><label><span class="label">Ganger/uke</span><input class="field" type="number" min="1" max="21" data-freq="${t.id}" value="${sel.freq}"></label><label><span class="label">Poeng</span><input class="field" type="number" min="1" data-pts="${t.id}" value="${sel.pts}"></label><label><span class="label">Vanligvis</span><select class="field" data-owner="${t.id}">${['Begge','Tore','Jannicke','Ingen fast'].map(o=>`<option ${sel.owner===o?'selected':''}>${o}</option>`).join('')}</select></label><label><span class="label">Timing</span><select class="field" data-type="${t.id}"><option value="daily" ${sel.type==='daily'?'selected':''}>Dagsbundet</option><option value="flex" ${sel.type==='flex'?'selected':''}>Fleksibel</option><option value="period" ${sel.type==='period'?'selected':''}>Periodebundet</option></select></label></div></div>`:''}</div></div>`}
function bindSetupInputs(){document.querySelectorAll('[data-taskcheck]').forEach(el=>el.onchange=()=>{const id=el.dataset.taskcheck,base=[...LIB,...state.custom].find(x=>x.id===id),i=state.tasks.findIndex(x=>x.id===id);if(el.checked&&i<0)state.tasks.push({...base,owner:'Begge'});if(!el.checked&&i>=0)state.tasks.splice(i,1);save();renderSetup()});['freq','pts','owner','type'].forEach(k=>document.querySelectorAll(`[data-${k}]`).forEach(el=>el.onchange=()=>{const t=state.tasks.find(x=>x.id===el.dataset[k]);t[k==='freq'?'freq':k==='pts'?'pts':k]=k==='freq'||k==='pts'?Math.max(1,Number(el.value)||1):el.value;save()}));const c=$('#customTask');if(c)c.onclick=()=>{const name=prompt('Navn på oppgaven');if(!name)return;const id='custom_'+Date.now(),x={id,cat:'Egendefinert',name,freq:1,pts:30,type:'flex',kind:'house'};state.custom.push(x);state.tasks.push({...x,owner:'Begge'});save();renderSetup()}}
$('#setupBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.area){state.areas[b.dataset.area]=!state.areas[b.dataset.area];save();renderSetup()}if(b.dataset.train){state.trainingFor[b.dataset.train]=!state.trainingFor[b.dataset.train];save();renderSetup()}};$('#setupBack').onclick=()=>{if(step>0){step--;renderSetup()}};$('#setupNext').onclick=()=>{if(step<2){step++;renderSetup()}else closeSetup()};
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
