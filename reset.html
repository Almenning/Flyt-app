<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e87961">
<title>Nytt passord · Flyt</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#452f29;--muted:#806d65;--line:#ead8d0;--accent:#e87961;--deep:#ad4a3c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,#efb99d,#fff1e8 60%,#e9aa87)}body{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(100%,390px);padding:30px 24px;border-radius:28px;background:#fffaf6f5;box-shadow:0 25px 70px #5d2e1f44;text-align:center}.logo{font:700 44px Georgia}.logo b{color:var(--accent)}.ey{font-size:11px;color:var(--deep);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.sub{color:var(--muted);line-height:1.45}.field{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 12px;margin:8px 0;font:inherit}.primary{width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--deep));color:#fff;font-weight:900;min-height:50px;padding:12px 16px;margin-top:8px}.secondary{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;font-weight:800;min-height:46px;padding:10px 14px;margin-top:10px}.status{min-height:44px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<div class="box"><div class="logo">fl<b>y</b>t</div><div class="ey">Nytt passord</div><h1 style="font:500 30px Georgia;margin:12px 0 6px">Lag nytt passord</h1><p class="sub">Velg et nytt passord for Flyt-kontoen din.</p><input id="pw" class="field" type="password" minlength="6" autocomplete="new-password" placeholder="Nytt passord, minst 6 tegn"><button id="save" class="primary">Lagre nytt passord</button><button id="back" class="secondary">Tilbake til Flyt</button><p id="status" class="status">Kontrollerer reset-lenken…</p></div>
<script>
const sb=window.supabase.createClient('https://uopzveejnztbovncqbpq.supabase.co','sb_publishable_uK6xd8TJhN2MY10qHSQ2GQ_7hSIr2gv');
const status=document.getElementById('status');
let ready=false;
function msg(t,bad=false){status.textContent=t;status.style.color=bad?'#a63c31':'var(--muted)'}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){ready=true;msg('Lenken er godkjent. Skriv inn nytt passord.')}});
(async()=>{const {data:{session},error}=await sb.auth.getSession();if(error){msg('Kunne ikke lese reset-lenken.',true);return}if(session){ready=true;msg('Lenken er godkjent. Skriv inn nytt passord.')}else setTimeout(()=>{if(!ready)msg('Reset-lenken er ugyldig eller utløpt. Be om en ny fra Flyt.',true)},1200)})();
document.getElementById('save').onclick=async()=>{const pw=document.getElementById('pw').value;if(pw.length<6){msg('Passordet må ha minst 6 tegn.',true);return}if(!ready){msg('Reset-lenken er ikke godkjent. Be om en ny fra Flyt.',true);return}msg('Lagrer…');const {error}=await sb.auth.updateUser({password:pw});if(error){msg(error.message,true);return}await sb.auth.signOut();msg('Passordet er endret. Du kan nå logge inn i Flyt.');};
document.getElementById('back').onclick=()=>location.href='./';
</script>
</body>
</html>
